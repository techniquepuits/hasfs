            <div class="cm-legend"><button type="button" class="cm-pick cm-r0" onclick="clsApply('none')">غير محفوظ</button><button type="button" class="cm-pick cm-r4" onclick="clsApply('prog')">قيد الحفظ</button><button type="button" class="cm-pick cm-r1" onclick="clsApply('new')">جديد</button><button type="button" class="cm-pick cm-r2" onclick="clsApply('mid')">متوسط</button><button type="button" class="cm-pick cm-r3" onclick="clsApply('rasikh')">راسخ</button></div>
            <div id="cm-status" class="cm-status">اضغط آية البداية</div>
            <div class="surah-list-container cm-map" id="cm-map" style="flex: 1; min-height: 0; max-height: none;">${clsMapHtml()}</div>
        </div>
        ${hfUtilRow('رجوع', 'showMainButtons()')}
    `;
    renderInContainer(html);
    applyTheme();
}

function clsPaint() {
    document.querySelectorAll('#cm-map .cm-a').forEach((e) => {
        e.classList.toggle('sel', clsInSel(+e.dataset.s, +e.dataset.a) || (!clsB && !!clsA && +e.dataset.s === clsA.s && +e.dataset.a === clsA.a));
    });
    const st = document.getElementById('cm-status');
    if (!st) return;
    if (!clsA) st.textContent = 'اضغط آية البداية';
    else if (!clsB) st.textContent = 'اضغط آية النهاية';
    else st.textContent = clsRangeLabel() + ' · اختر الدرجة أو اضغط للإلغاء';
}

function clsRangeLabel() {
    const f = (p) => surahsNames[p.s] + ' ' + p.a;
    return clsA.s === clsB.s && clsA.a === clsB.a ? f(clsA) : f(clsA) + ' ← ' + f(clsB);
}

// إطار أحمر على نهايات الحد المختار؛ الضغط على الزر نفسه ثانية يخفي الإطار
function clsSetMark(k) {
    if (!(CLS_MARKS[userRiwaya] && CLS_MARKS[userRiwaya][k])) {
        showToast('لا توجد أثمان في مصحف حفص (المدني)؛ الأثمان لرواية ورش فقط.');
        return;
    }
    clsMark = clsMark === k ? null : k;
    document.querySelectorAll('.cm-mkbtn').forEach((b) => b.classList.toggle('on', b.id === 'cm-mk-' + clsMark));
    const mk = clsMarkSet(), off = clsOffsets();
    document.querySelectorAll('#cm-map .cm-a').forEach((e) => e.classList.toggle('mk', !!mk && mk.has(off[+e.dataset.s] + +e.dataset.a)));
}

// ضغطة في أي مكان من الشاشة: تلغي التحديد الكامل (الأصفر)، وأزرار الدرجات في الأعلى تصنّفه
function clsGlobalTap(ev) {
    const t = ev.target;
    if (t.closest && (t.closest('.cm-pick') || t.closest('.cm-mkbtn'))) return;
    if (clsA && clsB) { clsA = null; clsB = null; clsPaint(); return; }
    clsTap(ev);
}

function clsTap(ev) {
    const el = ev.target.closest && ev.target.closest('.cm-a');
    if (!el) return;
    const s = +el.dataset.s, a = +el.dataset.a;
    if (clsA && clsB) {
        clsA = null; clsB = null; clsPaint(); return;
    } else if (clsA && !clsB) {
        if (clsA.s === s && clsA.a === a) {                 // الضغط على آية البداية نفسها: فاصل أجزاء (التصنيف لا يكون بآية واحدة)
            clsA = null;
            const R = clsRanks();
            if (!R.get(s)[a]) { clsPaint(); return; }       // آية بيضاء: نلغي التحديد فقط
            if (clsNextRank(R, s, a) !== R.get(s)[a]) { showToast("آخر آية في المقطع داكنة تلقائياً."); clsPaint(); return; }
            clsToggleCut(s, a);
            clsRefreshCut(s, a);
            clsPaint();
            return;
        }
        if (clsCmp(s, a, clsA.s, clsA.a) < 0) clsA = { s, a };   // قبل البداية: تصير هي البداية وننتظر النهاية
        else clsB = { s, a };
    } else {
        const R = clsRanks();
        if (clsIsManualCut(R, lsGet(LS_KEYS.cuts(userRiwaya), {}) || {}, s, a)) {   // ضغطة على فاصل يدوي: يُلغى الفاصل ويصير المقطعان مقطعاً واحداً
            clsToggleCut(s, a);
            clsRefreshCut(s, a);
            return;
        }
        clsA = { s, a };
    }
    clsPaint();
}

function clsRefreshCut(s, a) {
    const el = document.getElementById(`cm-${s}-${a}`);
    if (el) el.classList.toggle('cut', clsIsCut(clsRanks(), lsGet(LS_KEYS.cuts(userRiwaya), {}) || {}, s, a));
}

function clsApply(cat) {
    if (!clsA || !clsB) { showToast('حدّد المقطع أولاً: اضغط آية البداية ثم آية النهاية.'); return; }
    const label = clsRangeLabel();
    clsAssignRange(cat, clsA.s, clsA.a, clsB.s, clsB.a);
    clsA = null; clsB = null;
    const box = document.getElementById('cm-map');
    const top = box ? box.scrollTop : 0;
    if (box) { box.innerHTML = clsMapHtml(); box.scrollTop = top; }
    clsPaint();
    showToast(label + (cat === 'none' ? ': غير محفوظ.' : ': ' + CLS_CATS[cat].name + '.'));
}

// ==========================================================
// 9ب. «مراجعة الحفظ الجديد»
// المقطع الذي يُترك في «الحفظ مع الشيخ» لمقطع آخر ينتقل تلقائياً إلى هذه القائمة (الأحدث في الأسفل)،
// والمراجعة تعيد استعمال شاشة المراجعة اليومية: الآية الأولى مطلعاً أزرق ثم يتلو الباقي إلى آخر المقطع.
// لا تعثّر ولا عقال آيات هنا، ولا يتغير موضع التوقف الخاص بالمراجعة اليومية.
// ==========================================================
let newReviewMode = false;
let reviewOrigin = 'new';        // قائمة الرجوع: 'new' أو 'mid'
let newReviewPending = null;     // فهرس عنصر ينتظر تأكيد الإلغاء
let newReviewPendTimer = null;

function newReviewLoad() {
    const l = lsGet(LS_KEYS.newrev, []);
    return Array.isArray(l) ? l : [];
}

function newReviewValid(e) {
    return e && Number.isInteger(e.surah) && surahsNames[e.surah] && Number.isInteger(e.start) && Number.isInteger(e.end) &&
        e.start >= 1 && e.end >= e.start && e.end <= (getAyatCount(e.surah, e.riwaya) || 0);
}

// old: المقطع المحفوظ سابقاً في «الحفظ مع الشيخ» (خاماً من التخزين)، next: المقطع الجديد المؤكَّد
function newReviewAgeText(t) {
    if (!Number.isFinite(t)) return '';
    const d = Math.max(0, Math.floor((Date.now() - t) / DAY_MS));
    if (d === 0) return 'حُفظ اليوم';
    if (d === 1) return 'حُفظ أمس';
    if (d === 2) return 'حُفظ قبل يومين';
    if (d <= 10) return 'حُفظ قبل ' + d + ' أيام';
    return 'حُفظ قبل ' + d + ' يوماً';
}

// أجزاء مرتبة بترتيب المصحف ومدموجة (المتلامس والمتداخل في سورة واحدة يصير جزءاً واحداً)
function segsFromEntries(entries) {
    const by = {};
    entries.forEach((e) => { (by[e.surah] = by[e.surah] || []).push([e.start, e.end]); });
    const out = [];
    Object.keys(by).map(Number).sort((a, b) => a - b).forEach((sv) => {
        mergeRanges(by[sv]).forEach(([st, en]) => out.push({ surah: sv, start: st, end: en }));
    });
    return out;
}

function unitLabelOf(segs) {
    const f = segs[0], l = segs[segs.length - 1];
    return f.surah === l.surah ? `${surahsNames[f.surah]} — من ${f.start} إلى ${l.end}` : `من ${surahsNames[f.surah]} ${f.start} إلى ${surahsNames[l.surah]} ${l.end}`;
}

let newList = [];
function showNewReviewList() {
    newList = rankPassages(1);
    const li = lastPassIndex(1, newList.map((p) => p.segs));
    renderPassageList({
        items: newList.map((p, i) => ({ label: unitLabelOf(p.segs), cls: 'cm-r1', last: i === li, sig: passSig(1, p.segs) })),
        startFn: 'startNewPassage', title: 'اختر المقطع الذي تريد مراجعته',
        empty: 'لا توجد مقاطع في «الجديد» بعد.<br>صنّف ما حفظتَه حديثاً من «تصنيف القرآن» باختيار «جديد».'
    });
}

function startNewPassage(k) {
    const p = newList[k];
    if (p) { lastPassSet(1, p.segs[0].surah, p.segs[0].start); startUnitReview('new', p.segs); }
}

// ---------- المراجعة المتوسطة ----------
function midLoad() {
    const l = lsGet(LS_KEYS.midrev, []);
    return Array.isArray(l) ? l : [];
}

function midValid(u) {
    return u && Array.isArray(u.segs) && u.segs.length && u.segs.every((g) => newReviewValid({ surah: g.surah, start: g.start, end: g.end, riwaya: u.riwaya }));
}

let midList = [];
function showMidReviewList() {
    midList = rankPassages(2);
    const li = lastPassIndex(2, midList.map((p) => p.segs));
    renderPassageList({
        items: midList.map((p, i) => ({ label: unitLabelOf(p.segs), cls: 'cm-r2', last: i === li, sig: passSig(2, p.segs) })),
        startFn: 'startMidPassage', title: 'اختر ما تريد مراجعته',
        empty: 'لا توجد وحدات في «المتوسط» بعد.<br>صنّف ما تريد من «تصنيف القرآن» باختيار «متوسط».'
    });
}

function startMidPassage(k) {
    const p = midList[k];
    if (p) { lastPassSet(2, p.segs[0].surah, p.segs[0].start); startUnitReview('mid', p.segs); }
}

// ---------- قائمتا «الحفظ مع الشيخ» و«مراجعة الراسخ»: المقاطع المصنَّفة ----------
// أي تغيير في التصنيف أو الفواصل = تقسيم جديد: تُلغى علامة «آخر مقطع»، ويُصفَّر عدّاد كل مقطع تغيّر (المقطع الذي بقي كما هو يحتفظ بعدّاده)
function passSig(rank, segs) {
    const f = segs[0], l = segs[segs.length - 1];
    return userRiwaya + ':' + rank + ':' + f.surah + ':' + f.start + '-' + l.surah + ':' + l.end;
}
function passChanged() {
    const pre = userRiwaya + ':';
    const lp = lsGet(LS_KEYS.lastpass, {}) || {};
    Object.keys(lp).forEach((k) => { if (k.startsWith(pre)) delete lp[k]; });
    lsSet(LS_KEYS.lastpass, lp);
    const valid = new Set();
    [1, 2].forEach((r) => rankPassages(r).forEach((p) => valid.add(passSig(r, p.segs))));
    const rc = lsGet(LS_KEYS.revcount, {}) || {};
    Object.keys(rc).forEach((k) => { if (k.startsWith(pre) && !valid.has(k)) delete rc[k]; });
    lsSet(LS_KEYS.revcount, rc);
}
function revCountGet(sig) { const rc = lsGet(LS_KEYS.revcount, {}) || {}; return Math.max(0, +rc[sig] || 0); }
let psSigs = [];
function revCountStep(k, d) {
    const sig = psSigs[k];
    if (!sig) return;
    const rc = lsGet(LS_KEYS.revcount, {}) || {};
    const n = Math.max(0, (+rc[sig] || 0) + d);
    if (n) rc[sig] = n; else delete rc[sig];
    lsSet(LS_KEYS.revcount, rc);
    const el = document.getElementById('rc-' + k);
    if (el) el.textContent = n;
}

function lastPassSet(rank, s, a) {
    const m = lsGet(LS_KEYS.lastpass, {}) || {};
    m[userRiwaya + ':' + rank] = { s, a };
    lsSet(LS_KEYS.lastpass, m);
}

// فهرس المقطع الذي يحوي آخر آية بدأنا منها (يصمد أمام إعادة التقسيم)؛ passages: مصفوفة مقاطع، لكل منها segs
function lastPassIndex(rank, segsOf) {
    const m = lsGet(LS_KEYS.lastpass, {}) || {}, l = m[userRiwaya + ':' + rank];
    if (!l) return -1;
    return segsOf.findIndex((segs) => segs.some((g) => g.surah === l.s && l.a >= g.start && l.a <= g.end));
}

function renderPassageList(o) {
    try { prepStopAudio(); prepRecDiscard(); } catch (e) {}
    newReviewMode = false;
    reviewPlan = null;
    psSigs = o.items.map((it) => it.sig || null);
    const rows = o.items.map((it, k) => {
        const btn = `<button type="button" id="ps-${k}" class="resume-btn ps-btn ${it.cls || ''}${it.last ? ' last' : ''}" onclick="${it.on || (o.startFn + '(' + k + ')')}"><span class="rb-main">${it.label}</span>${it.sig ? `<span class="rc-num" id="rc-${k}" title="عدد المراجعات الصحيحة">${revCountGet(it.sig)}</span>` : ''}</button>`;
        return btn;
    }).join('');
    const html = `
        <div class="exercise-box" id="exercise-container" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="surah-title select-title">${o.title}</div>
            <div class="surah-list-container" style="flex: 1; min-height: 0; max-height: none;">${rows || `<div class="nr-empty">${o.empty}</div>`}</div>
        </div>
        ${hfUtilRow('رجوع', 'showMainButtons()')}
    `;
    renderInContainer(html);
    applyTheme();
    try { const l = document.querySelector('.ps-btn.last'); if (l) l.scrollIntoView({ block: 'center' }); } catch (e) {}
}

// مقاطع «قيد الحفظ»: كل مقطع مصنَّف في سورة واحدة (يُقصّ مما صار في درجة أخرى)
let progList = [];
function progPassages() {
    const out = [];
    rankPassages(4).forEach((p) => p.segs.forEach((g) => out.push({ surah: g.surah, start: g.start, end: g.end })));
    return out;
}

function showProgList() {
    progList = progPassages();
    const li = lastPassIndex(4, progList.map((g) => [g]));
    renderPassageList({
        items: progList.map((g, i) => ({ label: `${surahsNames[g.surah]} — من ${g.start} إلى ${g.end}`, cls: 'cm-r4', last: i === li })),
        startFn: 'startProgPassage',
        title: 'اختر المقطع الذي تحفظه',
        empty: 'لا توجد مقاطع «قيد الحفظ» بعد.<br>صنّف ما تحفظه الآن من «الإعدادات ← تصنيف القرآن حسب درجة الحفظ» باختيار «قيد الحفظ».'
    });
}

function startProgPassage(k) {
    const g = progList[k];
    if (!g) return;
    lastPassSet(4, g.surah, g.start);
    const old = lsGet(LS_KEYS.prep, null);
    const same = old && old.riwaya === userRiwaya && old.surah === g.surah && old.start === g.start && old.end === g.end;
    if (same) { prep = loadPrep(); }
    if (!same || !prep) {
        prep = prepNormalize({ riwaya: userRiwaya, surah: g.surah, start: g.start, end: g.end, cuts: [], t: Date.now() });
        savePrep();
    }
    prepSel = null;
    prepTafEd = 'muyassar';
    showPrepPage();
}

// مقاطع الراسخ: آيات متصلة بترتيب المصحف (قد تمتد عبر سور) وتنقسم عند فواصل الأجزاء
let rasikhList = [];
// مقاطع درجة معيّنة: آيات متصلة بترتيب المصحف تنقسم عند كل آية داكنة (نهاية مقطع أو فاصل يدوي)
function rankPassages(rank) {
    const R = clsRanks(), cuts = lsGet(LS_KEYS.cuts(userRiwaya), {}) || {}, out = [];
    let cur = null;
    for (let s = 0; s < surahsNames.length; s++) {
        const x = R.get(s), N = R.n(s);
        for (let n = 1; n <= N; n++) {
            if (x[n] === rank) {
                if (!cur) cur = { segs: [], count: 0 };
                const last = cur.segs[cur.segs.length - 1];
                if (last && last.surah === s && last.end === n - 1) last.end = n; else cur.segs.push({ surah: s, start: n, end: n });
                cur.count++;
                if (clsIsCut(R, cuts, s, n)) { out.push(cur); cur = null; }
            } else if (cur) { out.push(cur); cur = null; }
        }
    }
    if (cur) out.push(cur);
    return out;
}
function rasikhPassages() { return rankPassages(3); }

function showRasikhList() {
    rasikhList = rasikhPassages();
    const li = lastPassIndex(3, rasikhList.map((p) => p.segs));
    renderPassageList({
        items: rasikhList.map((p, i) => ({ label: unitLabelOf(p.segs), cls: 'cm-r3', last: i === li })),
        startFn: 'startRasikhPassage',
        title: 'اختر المقطع الذي تريد مراجعته',
        empty: 'لا توجد مقاطع في «الراسخ» بعد.<br>صنّف ما حفظتَه من «الإعدادات ← تصنيف القرآن حسب درجة الحفظ» باختيار «راسخ».'
    });
}

function startRasikhPassage(k) {
    const p = rasikhList[k];
    if (p) { lastPassSet(3, p.segs[0].surah, p.segs[0].start); startUnitReview('rasikh', p.segs); }
}

// مراجعة وحدة (مقطع واحد أو مجموعة أجزاء مرتبة بترتيب المصحف) بشاشة المراجعة اليومية:
// الآية الأولى مطلعاً أزرق ثم تُتلى البقية بالتسلسل (تُتخطى الفجوات)، ولا تعثّر ولا موضع توقف
function startUnitReview(origin, segs) {
    const all = [];
    segs.forEach((g) => { for (let n = g.start; n <= g.end; n++) all.push({ s: g.surah, a: n - 1 }); });
    if (!all.length) return;
    showSpecialSessionScreen();            // يبني شاشة المراجعة اليومية بكل أزرارها
    newReviewMode = true;
    reviewOrigin = origin;
    reviewSig = (origin === 'new' || origin === 'mid') ? passSig(origin === 'new' ? 1 : 2, segs) : null;
    selectedSpecialSurah = all[0].s;
    reviewPlan = all.length > 1 ? { seq: all.slice(1), prompt: all[0] } : { seq: all };
    loadSpecialFullSectionExercise();
}

let reviewSig = null;
function revCountAdd(sig, d) {
    if (!sig) return;
    const rc = lsGet(LS_KEYS.revcount, {}) || {};
    const n = Math.max(0, (+rc[sig] || 0) + d);
    if (n) rc[sig] = n; else delete rc[sig];
    lsSet(LS_KEYS.revcount, rc);
}
function closeRcBanner() { const b = document.getElementById('rc-banner'); if (b) b.remove(); }
function showRcBanner() {
    closeRcBanner();
    const n = revCountGet(reviewSig);
    const b = document.createElement('div');
    b.id = 'rc-banner';
    b.className = 'stop-pick-banner rc-banner';
    b.innerHTML = `<div>عدد المراجعات الصحيحة لهذا المقطع: <span id="rc-banner-n">${n}</span></div>
        <button type="button" id="rc-plus" onclick="rcFinish(1)">رفعه بنقطة (+1)</button>
        <button type="button" id="rc-minus" onclick="rcFinish(-1)">حذف نقطة (−1)</button>
        <button type="button" id="rc-keep" onclick="rcFinish(0)">إبقاء العلامة كما هي</button>
        <button type="button" id="rc-back" onclick="closeRcBanner()">متابعة المراجعة</button>`;
    document.body.appendChild(b);
}
function rcFinish(d) { if (d) revCountAdd(reviewSig, d); leaveNewReview(); }

function leaveNewReview() {
    closeRcBanner();
    const keys = reviewOrigin === 'rasikh' ? [...stumbledSet].filter((k) => reviewSeq[k]).map((k) => ayahKey(reviewSeq[k].s, reviewSeq[k].a)) : [];
    resetRecordingStates();
    stopStopPickSafe();
    sessionActive = false;
    reviewPlan = null;
    if (reviewOrigin === 'mid') showMidReviewList(); else if (reviewOrigin === 'rasikh') showRasikhList(); else showNewReviewList();
    if (keys.length) showStumbleReviewPrompt(keys);
}
function stopStopPickSafe() { stopPickMode = false; closeStopDialog(); }

// ==========================================================
// 10. التشغيل

// ==========================================================
// 9. «الحفظ مع الشيخ»
//    اختيار المقطع ← صفحة واحدة: نص المقطع + التفسير + الشيخ + التجزئة
//    النظام يعمل بالآيات (بلا تجزئة) أو بالأجزاء (بعد التجزئة)، لا بهما معاً.
// ==========================================================

let prep = null;              // {riwaya, surah (من 0), start, end, cuts[]}: cuts = آخر آية في كل جزء عدا الأخير
let prepSel = null;           // آية محدَّدة (وإن وُجدت تجزئة فالمحدَّد هو الجزء الذي تنتمي إليه)
let prepScroll = 0;
let prepAudio = null;
let prepPlaying = false;
let prepAudioToken = 0;
let prepSheikhPos = null;      // موضع التوقف: {key, i, t} لمواصلة المقطع نفسه من حيث انتهى
let prepSheikhLive = null;     // الحالة الحيّة للتشغيل: {key, get()}
const prepBlobs = {};          // ملفات الآيات المحمَّلة كاملة (رابط → رابط محلي)
const prepPending = {};
let prepAudioKind = null;       // 'sheikh' | 'rec'
let prepHidden = false;         // النص مخفي (أثناء التسجيل وحتى «العرض»)
let prepRecState = 'idle';      // idle | recording | recorded
let prepRecScope = null, prepRecUrl = null, prepRecorder = null, prepRecStream = null;
let prepRecChunks = [], prepPlayAfterStop = false, prepRecStarting = false;
let prepSurahSel = null;
let prepField = 'start';
let prepStartStr = "";
let prepEndStr = "";
let prepTafToken = 0;
let prepTafEd = 'muyassar';   // الميسّر هو الافتراضي، ويبقى اختياره ما دام المقطع نفسه

// ---------- أدوات مشتركة ----------

function hfUtilRow(endLabel, endOnclick, midHtml) {
    return `
        <div id="util-row" class="util-row">
            <div class="u-start">
                <button id="dark-mode-btn" class="btn-home btn-end-session btn-theme" onclick="toggleDarkMode()" title="${isDarkMode ? 'الوضع العادي' : 'الوضع الليلي'}">${isDarkMode ? 'الوضع العادي' : 'الوضع الليلي'}</button>
            </div>
            <div class="u-mid" id="util-mid">${midHtml || ''}</div>
            <div class="u-end">${endLabel ? `<button class="btn-home btn-end-session" onclick="${endOnclick}">${endLabel}</button>` : ''}</div>
        </div>`;
}

function prepNormalize(p) {
    if (!p) return null;
    const total = getAyatCount(p.surah, p.riwaya);
    if (p.riwaya !== userRiwaya || !surahsNames[p.surah] || !(p.start >= 1) || !(p.end >= p.start) || p.end > total) return null;
    // الافتراضي: كل آية جزء مستقل (قطع بعد كل آية عدا الأخيرة)؛ ما بعد ذلك يعدّله المستخدم بنفسه (cv=1 يعني أنه عُدِّل/حُفظ بهذا النظام)
    let cuts = [];
    if (!p.cv) { for (let n = p.start; n < p.end; n++) cuts.push(n); }
    else (Array.isArray(p.cuts) ? p.cuts : []).forEach((n) => {
        if (Number.isInteger(n) && n >= p.start && n < p.end && (!cuts.length || n > cuts[cuts.length - 1])) cuts.push(n);
    });
    return { riwaya: p.riwaya, surah: p.surah, start: p.start, end: p.end, cuts, cv: 1, t: Number.isFinite(p.t) ? p.t : undefined };
}

function loadPrep() {
    const cur = prepNormalize(lsGet(LS_KEYS.prep, null));
    if (cur) return cur;
    // الإصدار السابق كان يحفظ تجزئة تلقائية: نأخذ منه السورة والآيتين فقط
    const old = lsGet(LS_KEYS.prepOld, null);
    return old ? prepNormalize({ riwaya: old.riwaya, surah: old.surah, start: old.start, end: old.end, cuts: [] }) : null;
}

function savePrep() { if (prep) lsSet(LS_KEYS.prep, prep); }

// ---------- اختيار المقطع ----------

function showPrepSelect() {
    try { prepStopAudio(); prepRecDiscard(); } catch (e) {}
    prepStopAudio();
    prepSurahSel = null;
    let surahsHtml = '';
    surahsNames.forEach((name, index) => {
        surahsHtml += `
            <div class="setting-row-box" style="margin-bottom: 6px; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between;">
                <label class="radio-label" style="cursor: pointer; display: flex; align-items: center; gap: 8px; flex: 1;">
                    <input type="radio" name="prep-surah-radio" value="${index}" onchange="selectPrepSurah(${index})">
                    <span>سورة ${name}</span>
                </label>
            </div>`;
    });
    const saved = loadPrep();
    const resumeHtml = saved
        ? `<button type="button" id="prep-resume-btn" class="resume-btn" onclick="resumePrep()"><span class="rb-main">متابعة المقطع السابق</span><span class="rb-sub">سورة ${surahsNames[saved.surah]} — من الآية ${saved.start} إلى الآية ${saved.end}</span></button>`
        : '';
    const html = `
        <div class="exercise-box" id="exercise-container" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="surah-title select-title">اختر السورة التي تريد حفظها</div>
            <div class="surah-list-container" style="flex: 1; min-height: 0; max-height: none;">
                ${resumeHtml}
                ${surahsHtml}
            </div>
        </div>
        ${hfUtilRow('رجوع', 'showMainButtons()')}
        <div id="prep-modal" class="modal-overlay hidden" onclick="if (event.target === this) cancelPrepModal()"></div>
    `;
    renderInContainer(html);
    applyTheme();
}

function resumePrep() {
    const saved = loadPrep();
    if (!saved) { showPrepSelect(); return; }
    prep = saved;
    prepSel = null;
    prepTafEd = 'muyassar';
    showPrepPage();
}

function selectPrepSurah(surahIndex) {
    prepSurahSel = surahIndex;
    prepStartStr = "";
    prepEndStr = "";
    prepField = 'start';
    const max = getAyatCount(surahIndex) || 7;
    const modal = document.getElementById('prep-modal');
    if (!modal) return;
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-title">سورة ${surahsNames[surahIndex]}</div>
            <div class="numpad-display-row">
                <span class="numpad-label">آية البداية:</span>
                <input type="text" id="prep-start" class="numpad-display pad-active" readonly inputmode="none" placeholder="1" value="" onclick="prepSetField('start')">
                <span class="numpad-max">من ${max}</span>
            </div>
            <div class="numpad-display-row">
                <span class="numpad-label">آية النهاية:</span>
                <input type="text" id="prep-end" class="numpad-display" readonly inputmode="none" placeholder="—" value="" onclick="prepSetField('end')">
                <span class="numpad-max">من ${max}</span>
            </div>
            <div class="numpad">
                <button type="button" onclick="prepNumpadPress('1')">1</button>
                <button type="button" onclick="prepNumpadPress('2')">2</button>
                <button type="button" onclick="prepNumpadPress('3')">3</button>
                <button type="button" onclick="prepNumpadPress('4')">4</button>
                <button type="button" onclick="prepNumpadPress('5')">5</button>
                <button type="button" onclick="prepNumpadPress('6')">6</button>
                <button type="button" class="np-del" onclick="prepNumpadPress('back')" title="حذف">⌫</button>
                <button type="button" onclick="prepNumpadPress('7')">7</button>
                <button type="button" onclick="prepNumpadPress('8')">8</button>
                <button type="button" onclick="prepNumpadPress('9')">9</button>
                <button type="button" onclick="prepNumpadPress('0')">0</button>
                <button type="button" class="np-clear" onclick="prepNumpadPress('clear')" title="مسح الكل">مسح</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-start-review" onclick="confirmPrepSelection()">بدء الحفظ</button>
                <button type="button" class="btn-cancel" onclick="cancelPrepModal()">إلغاء</button>
            </div>
        </div>
    `;
    modal.classList.remove('hidden');
}

function prepSetField(which) {
    prepField = which;
    const a = document.getElementById('prep-start');
    const b = document.getElementById('prep-end');
    if (a) a.classList.toggle('pad-active', which === 'start');
    if (b) b.classList.toggle('pad-active', which === 'end');
}

function prepNumpadPress(key) {
    if (prepSurahSel === null) return;
    const max = getAyatCount(prepSurahSel) || 7;
    let s = prepField === 'start' ? prepStartStr : prepEndStr;
    if (key === 'back') s = s.slice(0, -1);
    else if (key === 'clear') s = "";
    else {
        if (s === "" && key === '0') return;
        let c = s + key;
        if (parseInt(c, 10) > max) c = String(max);
        s = c;
    }
    if (prepField === 'start') prepStartStr = s; else prepEndStr = s;
    const input = document.getElementById(prepField === 'start' ? 'prep-start' : 'prep-end');
    if (input) input.value = s;
}

function closePrepModal() {
    const modal = document.getElementById('prep-modal');
    if (modal) { modal.classList.add('hidden'); modal.innerHTML = ""; }
}

function cancelPrepModal() {
    closePrepModal();
    prepSurahSel = null;
    document.querySelectorAll('input[name="prep-surah-radio"]').forEach((r) => { r.checked = false; });
}

function confirmPrepSelection() {
    if (prepSurahSel === null) return;
    const max = getAyatCount(prepSurahSel) || 7;
    const start = Math.min(Math.max(1, parseInt(prepStartStr, 10) || 1), max);
    if (prepEndStr === "") { showToast("اكتب آية النهاية."); prepSetField('end'); return; }
    const end = Math.min(parseInt(prepEndStr, 10), max);
    if (end < start) { showToast("آية النهاية يجب ألا تسبق آية البداية."); return; }
    prep = prepNormalize({ riwaya: userRiwaya, surah: prepSurahSel, start, end, cuts: [], t: Date.now() });
    prepSel = null;
    prepTafEd = 'muyassar';
    savePrep();
    closePrepModal();
    showPrepPage();
}

// ---------- وحدات المقطع: آية أو جزء ----------

// كل المقطع مجزأ دائماً: الأقطاع تنتهي عندها الأجزاء، والافتراضي كل آية جزء
function prepUnitOf(n) {
    let from = prep.start;
    for (let i = 0; i < prep.cuts.length; i++) {
        if (n <= prep.cuts[i]) return { from, to: prep.cuts[i], idx: i + 1 };
        from = prep.cuts[i] + 1;
    }
    return { from, to: prep.end, idx: prep.cuts.length + 1 };
}

// ما تعمل عليه الأزرار الآن: الوحدة المحدَّدة، وإن لم يوجد تحديد فالمقطع كله
function prepScope() {
    if (prepSel === null) return { from: prep.start, to: prep.end, kind: 'all', label: 'كل آيات المقطع' };
    const u = prepUnitOf(prepSel);
    if (u.from === u.to) return { from: u.from, to: u.to, kind: 'ayah', label: 'الآية ' + u.from };
    const span = u.from === u.to ? 'الآية ' + u.from : 'الآيات ' + u.from + '–' + u.to;
    return { from: u.from, to: u.to, kind: 'part', label: 'الجزء ' + u.idx + ' (' + span + ')' };
}

// أثناء التسجيل وبعده (حتى «العرض») يبقى النص مخفياً ولا تعمل بقية الأزرار
function prepGuardHidden() {
    if (!prepHidden) return false;
    showToast("اضغط «العرض» لإظهار النص أولاً.");
    return true;
}

// ---------- صفحة المقطع ----------

let prepTafMode = false;      // زر التفسير مفعّل وينتظر الضغط على نص آية
let prepTafAyah = null;       // الآية المعروض تفسيرها (وحدها)

function prepTafBtnHtml() {
    return `<button type="button" id="prep-taf-btn" class="btn-home btn-end-session${prepTafMode ? ' taf-on' : ''}" onclick="prepOpenTafsir()">التفسير</button>`;
}

function prepSpeedHtml() {
    return `<span id="speed-ctl" class="speed-ctl" title="سرعة النزول التلقائي"><span class="stepper sm"><button type="button" onclick="changeScrollSpeed(-1)" aria-label="أبطأ">−</button><span id="speed-val" class="st-val speed-val">${scrollLevel}</span><button type="button" onclick="changeScrollSpeed(1)" aria-label="أسرع">+</button></span></span>`;
}

// النزول التلقائي أثناء صوت الشيخ أو «العرض»، بسرعة العدّاد نفسها المستعملة في المراجعة
let prepScrollOn = false, prepHoldUntil = 0, prepScrollPos = 0, prepScrollLast = 0;
function prepScrollFrame(ts) {
    if (!prepScrollOn) return;
    const box = document.getElementById('exercise-container');
    if (!box || !document.getElementById('prep-text') || !prepPlaying) { prepScrollOn = false; return; }
    const dt = prepScrollLast ? Math.min(0.1, (ts - prepScrollLast) / 1000) : 0;
    prepScrollLast = ts;
    if (Date.now() >= prepHoldUntil) {
        if (Math.abs(box.scrollTop - prepScrollPos) > 2) prepScrollPos = box.scrollTop;
        prepScrollPos += scrollLevel * SCROLL_PX_PER_LEVEL * dt;
        box.scrollTop = prepScrollPos;
    } else prepScrollPos = box.scrollTop;
    requestAnimationFrame(prepScrollFrame);
}
function prepScrollSync() {
    const box = document.getElementById('exercise-container');
    const want = !!(prepPlaying && box && document.getElementById('prep-text'));
    if (want && !prepScrollOn) {
        prepScrollOn = true; prepScrollLast = 0; prepScrollPos = box.scrollTop;
        if (!box._prepHold) {
            box._prepHold = true;
            ['touchmove', 'wheel'].forEach((ev) => box.addEventListener(ev, () => { prepHoldUntil = Date.now() + 3000; }, { passive: true }));
        }
        prepHoldUntil = Date.now() + 1500;
        requestAnimationFrame(prepScrollFrame);
    } else if (!want) prepScrollOn = false;
}

function showPrepPage(keep) {
    if (!prep) { showPrepSelect(); return; }
    prepStopAudio();
    if (!keep) { prepSel = null; prepRecDiscard(); prepTafMode = false; prepTafAyah = null; }
    const html = `
        <div class="exercise-box" id="exercise-container" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="surah-title" style="font-size: 16px;">سورة ${surahsNames[prep.surah]} — الآيات ${prep.start} إلى ${prep.end}</div>
            <div id="prep-text" class="continuous-quran-text" style="text-align: right; font-size: 21px; line-height: 3.2;"></div>
        </div>
        <div class="hf-grid3">
            <button type="button" id="prep-sheikh-btn" class="btn-secondary hf-btn" onclick="prepToggleSheikh()">الشيخ</button>
            <button type="button" id="prep-rec-btn" class="btn-secondary hf-btn" onclick="prepRecBtn()">تسجيل</button>
            <button type="button" id="prep-show-btn" class="btn-secondary hf-btn" onclick="prepShowBtn()">العرض</button>
        </div>
        ${hfUtilRow('إنهاء الجلسة', 'showMainButtons()', prepTafBtnHtml())}
    `;
    renderInContainer(html);
    applyTheme();
    prepRefreshUI();
    const box = document.getElementById('exercise-container');
    if (box && keep) box.scrollTop = prepScroll;
}

function prepRenderText() {
    const el = document.getElementById('prep-text');
    if (!el || !prep) return;
    const sel = prepSel !== null ? prepUnitOf(prepSel) : null;
    const hid = (prepHidden && prepRecScope) ? prepRecScope : null;
    const one = (n) => {
        const t = getAyahText(userRiwaya, prep.surah, n - 1) || '';
        const on = sel && n >= sel.from && n <= sel.to;
        const hidden = hid && n >= hid.from && n <= hid.to;
        return `<span class="prep-ayah${on ? ' prep-sel' : ''}" id="pa-${n}" onclick="prepSelectAyah(${n})"><span class="at${hidden ? ' prep-hide' : ''}">${t}</span> <span class="circle-num prep-cn" onclick="prepCircleTap(${n}, event)">${n}</span> </span>`;
    };
    let html = '';
    let from = prep.start, idx = 0;
    prep.cuts.concat([prep.end]).forEach((to) => {
        let inner = '';
        for (let n = from; n <= to; n++) inner += one(n);
        const isSel = sel && sel.from === from;
        html += `<span class="chunk ${idx % 2 === 0 ? 'chunk-a' : 'chunk-b'}${isSel ? ' chunk-sel' : ''}">${inner}</span> `;
        from = to + 1; idx++;
    });
    el.innerHTML = html;
}

function prepRefreshUI() {
    if (!prep) return;
    prepRenderText();
    refreshPrepBtns();
}

// نصوص أزرار الصف الأول وحالتها (الشيخ، التسجيل، العرض)
function refreshPrepBtns() {
    const sh = document.getElementById('prep-sheikh-btn');
    if (sh) sh.textContent = (prepPlaying && prepAudioKind === 'sheikh') ? 'إيقاف' : 'الشيخ';
    const rc = document.getElementById('prep-rec-btn');
    if (rc) {
        const live = prepRecState === 'recording';
        rc.classList.toggle('rec-live', live);
        rc.innerHTML = live ? '<span class="rec-pulse"></span><span>إيقاف</span>' : 'تسجيل';
    }
    const sw = document.getElementById('prep-show-btn');
    if (sw) sw.textContent = (prepPlaying && prepAudioKind === 'rec') ? 'إيقاف' : 'العرض';
    const mid = document.getElementById('util-mid');
    if (mid && document.getElementById('prep-text')) {
        if (prepPlaying && !document.getElementById('speed-ctl')) { mid.innerHTML = prepSpeedHtml(); fitDarkBtn(); }
        else if (!prepPlaying && !document.getElementById('prep-taf-btn')) { mid.innerHTML = prepTafBtnHtml(); fitDarkBtn(); }
    }
    prepScrollSync();
}

function prepSelectAyah(n) {
    if (prepGuardHidden()) return;
    if (prepTafMode) { prepOpenAyahTafsir(n); return; }
    prepStopAudio();
    prepRecDiscard();            // التسجيل مرتبط بما كان محدَّداً
    if (prepSel !== null) {
        const a = prepUnitOf(prepSel), b = prepUnitOf(n);
        if (a.from === b.from && a.to === b.to) { prepSel = null; prepRefreshUI(); return; }
    }
    prepSel = n;
    prepRefreshUI();
}

// ---------- التجزئة: كل آية جزء، والضغط على رقم آية يدمجها مع التي بعدها (يلغي القطع) وإعادة الضغط تعيد القطع ----------

function prepCircleTap(n, ev) {
    if (!prep) return;
    if (ev && ev.stopPropagation) ev.stopPropagation();
    if (prepGuardHidden()) return;
    if (n < prep.start || n >= prep.end) return;      // آخر آية في المقطع نهايته أصلاً
    prepStopAudio();
    prepRecDiscard();
    const i = prep.cuts.indexOf(n);
    if (i >= 0) prep.cuts.splice(i, 1);
    else { prep.cuts.push(n); prep.cuts.sort((a, b) => a - b); }
    prepSel = null;
    savePrep();
    prepRefreshUI();
}

// ---------- صوت الشيخ: الآية أو الجزء أو المقطع كله ----------

function prepStopAudio() {
    prepAudioToken++;
    if (prepAudio) {
        prepAudio.onended = null;
        prepAudio.onerror = null;
        try { prepAudio.pause(); } catch (e) {}
        prepAudio = null;
    }
    if (prepPlaying) releaseWakeLock();
    prepPlaying = false;
    prepAudioKind = null;
    refreshPrepBtns();
}

function prepToggleSheikh() {
    if (!prep) return;
    if (prepPlaying && prepAudioKind === 'sheikh') {
        try { if (prepSheikhLive) { const p = prepSheikhLive.get(); prepSheikhPos = { key: prepSheikhLive.key, i: p.i, t: p.t }; } } catch (e) {}
        prepStopAudio();
        return;
    }
    if (prepGuardHidden()) return;
    prepStopAudio();
    if (userRiwaya !== 1) { showToast("صوت الشيخ متاح حالياً لرواية حفص فقط."); return; }
    stopSheikh();
    const sc = prepScope();
    const urls = [];
    for (let n = sc.from; n <= sc.to; n++) {
        const u = ayahAudioUrls(userRiwaya, prep.surah, n - 1);
        if (u) urls.push(...u);
    }
    if (!urls.length) { showToast("صوت الشيخ متاح حالياً لرواية حفص فقط."); return; }
    prepPlayQueue(urls);
}

function prepPlayQueue(urls) {
    const token = ++prepAudioToken;
    prepPlaying = true;
    prepAudioKind = 'sheikh';
    acquireWakeLock();
    refreshPrepBtns();
    const key = urls.join('|');
    const saved = prepSheikhPos && prepSheikhPos.key === key && prepSheikhPos.i < urls.length ? prepSheikhPos : null;
    prepSheikhPos = null;
    const a = new Audio();
    a.preload = 'auto';
    try { a.defaultPlaybackRate = userRate; a.playbackRate = userRate; a.preservesPitch = true; } catch (e) {}
    prepAudio = a;
    let i = saved ? saved.i : 0, tries = 0, lastT = -1, stall = 0, retryTimer = null, loading = false;
    prepSheikhLive = { key, get: () => ({ i, t: a.currentTime || 0 }) };
    const alive = () => token === prepAudioToken;
    const stopAll = (msg) => {
        if (!alive()) return;
        if (msg) showToast(msg);
        prepStopAudio();
    };
    // تحميل المقطع كله مقدَّماً (ملفات كاملة في الذاكرة) فلا يبقى انتظار بين الآيات
    const ensure = (n) => {
        const u = urls[n];
        if (prepBlobs[u]) return Promise.resolve(prepBlobs[u]);
        if (!prepPending[u]) {
            prepPending[u] = fetch(u).then((r) => { if (!r.ok) throw new Error('http'); return r.blob(); })
                .then((bl) => { const o = URL.createObjectURL(bl); prepBlobs[u] = o; delete prepPending[u]; return o; })
                .catch(() => { delete prepPending[u]; return u; });   // تعذّر التحميل الكامل: نبثّ الرابط مباشرة
        }
        return prepPending[u];
    };
    let nextLoad = i;
    const worker = async () => { while (alive() && nextLoad < urls.length) { const n = nextLoad++; await ensure(n); } };
    for (let k = 0; k < 3; k++) worker();
    const start = (n, at) => {
        if (!alive()) return;
        i = n; lastT = -1; stall = 0; loading = true;
        ensure(n).then((src) => {
            if (!alive() || i !== n) return;
            loading = false;
            a.src = src;
            if (at) a.onloadedmetadata = () => { a.onloadedmetadata = null; try { a.currentTime = at; } catch (e) {} };
            try { a.load(); } catch (e) {}
            const p = a.play();
            if (p && p.catch) p.catch(() => { if (alive()) onFail(); });
        });
    };
    const onFail = () => {
        if (!alive() || retryTimer) return;
        if (++tries > 4) { stopAll("انقطع صوت الشيخ. تحقق من الاتصال بالإنترنت ثم أعد التشغيل."); return; }
        const at = a.currentTime > 1 ? a.currentTime - 0.5 : 0;
        retryTimer = setTimeout(() => { retryTimer = null; start(i, at); }, 500 * tries);
    };
    a.onended = () => {
        if (!alive()) return;
        tries = 0;
        if (i + 1 >= urls.length) { prepSheikhPos = null; prepStopAudio(); return; }
        start(i + 1, 0);
    };
    a.onerror = onFail;
    const wd = setInterval(() => {
        if (!alive()) { clearInterval(wd); if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; } return; }
        if (loading || retryTimer || document.visibilityState !== 'visible') return;
        if (a.ended) return;
        if (a.paused) { const p = a.play(); if (p && p.catch) p.catch(() => {}); return; }
        if (a.currentTime === lastT) { if (++stall >= 12) { stall = 0; onFail(); } } else { stall = 0; lastT = a.currentTime; }
    }, 1000);
    try {
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({ title: 'تلاوة الشيخ', artist: 'ابن باديس' });
            navigator.mediaSession.setActionHandler('pause', () => stopAll());
            navigator.mediaSession.setActionHandler('stop', () => stopAll());
        }
    } catch (e) {}
    start(i, saved ? Math.max(0, saved.t - 0.3) : 0);
}

// ---------- التسجيل والعرض: يُخفى النص (المحدَّد أو كله) ويتلوه المستخدم من حفظه ثم يقارن ----------

function prepRecDiscard() {
    prepPlayAfterStop = false;
    prepRecStarting = false;
    if (prepPlaying && prepAudioKind === 'rec') prepStopAudio();
    if (prepRecorder) {
        const r = prepRecorder;
        prepRecorder = null;
        r.onstop = null;
        try { if (r.state !== 'inactive') r.stop(); } catch (e) {}
    }
    if (prepRecStream) {
        try { prepRecStream.getTracks().forEach((t) => t.stop()); } catch (e) {}
        prepRecStream = null;
    }
    if (prepRecUrl) { try { URL.revokeObjectURL(prepRecUrl); } catch (e) {} prepRecUrl = null; }
    if (prepRecState === 'recording') releaseWakeLock();
    prepRecState = 'idle';
    prepHidden = false;
    prepRecScope = null;
    prepRecChunks = [];
}

async function prepRecBtn() {
    if (!prep || prepRecStarting) return;
    if (prepRecState === 'recording') { prepRecStop(false); return; }
    prepStopAudio();
    prepRecDiscard();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
        showToast("التسجيل غير مدعوم في هذا المتصفح.");
        return;
    }
    prepRecStarting = true;
    let stream = null;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { prepRecStarting = false; showToast("تعذر الوصول إلى الميكروفون. اسمح للتطبيق باستعماله."); return; }
    if (!prepRecStarting) { try { stream.getTracks().forEach((t) => t.stop()); } catch (e) {} return; }   // أُلغي أثناء طلب الإذن
    prepRecStarting = false;
    const rec = new MediaRecorder(stream);
    prepRecStream = stream;
    prepRecorder = rec;
    prepRecChunks = [];
    prepRecScope = prepScope();
    prepHidden = true;
    prepRecState = 'recording';
    rec.ondataavailable = (e) => { if (e.data && e.data.size) prepRecChunks.push(e.data); };
    rec.onstop = () => prepRecFinish(rec);
    rec.start();
    acquireWakeLock();
    prepRefreshUI();
}

function prepRecStop(playAfter) {
    prepPlayAfterStop = !!playAfter;
    const r = prepRecorder;
    if (!r) return;
    try { if (r.state !== 'inactive') r.stop(); else prepRecFinish(r); } catch (e) { prepRecFinish(r); }
}

function prepRecFinish(rec) {
    if (rec !== prepRecorder) return;
    const chunks = prepRecChunks;
    prepRecorder = null;
    if (prepRecStream) { try { prepRecStream.getTracks().forEach((t) => t.stop()); } catch (e) {} prepRecStream = null; }
    releaseWakeLock();
    const play = prepPlayAfterStop;
    prepPlayAfterStop = false;
    if (!chunks.length) {
        prepRecState = 'idle';
        prepHidden = false;
        prepRecScope = null;
        showToast("لم يُسجَّل شيء.");
        prepRefreshUI();
        return;
    }
    prepRecUrl = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || 'audio/webm' }));
    prepRecState = 'recorded';
    if (play) { prepHidden = false; prepRefreshUI(); prepPlayRec(); }
    else prepRefreshUI();
}

// «العرض»: يعيد النص المخفي ويشغّل التسجيل
function prepShowBtn() {
    if (!prep) return;
    if (prepRecState === 'recording') { prepRecStop(true); return; }
    if (prepPlaying && prepAudioKind === 'rec') { prepStopAudio(); return; }
    if (prepRecUrl) { prepHidden = false; prepRefreshUI(); prepPlayRec(); return; }
    if (prepHidden) { prepHidden = false; prepRefreshUI(); return; }
    showToast("لا يوجد تسجيل بعد. اضغط «تسجيل» أولاً.");
}

function prepPlayRec() {
    if (!prepRecUrl) return;
    prepStopAudio();
    stopSheikh();
    const token = ++prepAudioToken;
    prepPlaying = true;
    prepAudioKind = 'rec';
    acquireWakeLock();
    const a = new Audio(prepRecUrl);
    prepAudio = a;
    const fail = () => {
        if (token !== prepAudioToken) return;
        prepStopAudio();
        showToast("تعذر تشغيل التسجيل.");
    };
    a.onended = () => { if (token === prepAudioToken) prepStopAudio(); };
    a.onerror = fail;
    const p = a.play();
    if (p && p.catch) p.catch(fail);
    refreshPrepBtns();
}

// ---------- التفسير ----------

// كتب التفسير مرقّمة بعدّ حفص. في ورش يختلف عدّ الآيات في نحو نصف السور، فنطابق الآيتين بالكلمات:
// نقارن كلمات السورة في الروايتين (بلا تشكيل) ونعرف أي آيات حفص تقابل كل آية في ورش.
const tafsirAlignCache = {};

function tafsirNormWord(w) {
    return w.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640\uFEFF\u200C\u200D\u08D3-\u08FF]/g, '')
            .replace(/[\u0671\u0622\u0623\u0625]/g, '\u0627').replace(/\u0649/g, '\u064A').replace(/\u0629/g, '\u0647');
}

function tafsirWordsOf(ayahs) {
    const words = [], owner = [];
    ayahs.forEach((t, i) => {
        String(t || '').split(/\s+/).filter(Boolean).forEach((w) => {
            const n = tafsirNormWord(w);
            if (n) { words.push(n); owner.push(i + 1); }
        });
    });
    return { words, owner };
}

// يعيد {رقم آية ورش: [أرقام آيات حفص المقابلة]} للسورة
function warshToHafsMap(surah) {
    if (tafsirAlignCache[surah]) return tafsirAlignCache[surah];
    const W = tafsirWordsOf(quranTexts[0][surah]);
    const H = tafsirWordsOf(quranTexts[1][surah]);
    const m = new Array(W.words.length).fill(-1);
    let i = 0, j = 0;
    while (i < W.words.length && j < H.words.length) {
        if (W.words[i] === H.words[j]) { m[i] = j; i++; j++; continue; }
        let found = false;
        for (let d = 1; d <= 8 && !found; d++) {
            for (let a = 0; a <= d && !found; a++) {
                const b = d - a;
                if (i + a < W.words.length && j + b < H.words.length && W.words[i + a] === H.words[j + b] &&
                    (i + a + 1 >= W.words.length || j + b + 1 >= H.words.length || W.words[i + a + 1] === H.words[j + b + 1])) {
                    for (let k = 0; k < a; k++) m[i + k] = Math.min(j + Math.min(k, b), H.words.length - 1);
                    i += a; j += b; found = true;
                }
            }
        }
        if (!found) { m[i] = j; i++; j++; }
    }
    for (; i < W.words.length; i++) m[i] = H.words.length - 1;
    const res = {};
    W.owner.forEach((wa, idx) => {
        const ha = H.owner[m[idx]];
        if (!res[wa]) res[wa] = [];
        if (!res[wa].includes(ha)) res[wa].push(ha);
    });
    tafsirAlignCache[surah] = res;
    return res;
}

// أرقام آيات حفص التي نعرض تفسيرها للآية المحددة (آية واحدة في حفص، وقد تكون أكثر في ورش)
async function tafsirTargets(surah, ayah1) {
    if (userRiwaya === 1) return [ayah1];
    await ensureTextsForRiwaya(1);
    if (!quranTexts[0]?.[surah] || !quranTexts[1]?.[surah]) return null;
    const r = warshToHafsMap(surah)[ayah1];
    return (r && r.length) ? r.slice().sort((a, b) => a - b) : null;
}

// يستخرج نص التفسير من استجابة JSON بصرف النظر عن شكلها الدقيق
function extractTafsirText(j, ayah) {
    if (j === null || j === undefined) return '';
    if (typeof j === 'string') return j;
    if (Array.isArray(j)) return extractTafsirText(j.find((x) => x && Number(x.ayah) === ayah) || j[0], ayah);
    if (typeof j !== 'object') return '';
    if (typeof j.text === 'string') return j.text;
    for (const k of ['tafsir', 'tafseer', 'content', 'body']) {
        if (typeof j[k] === 'string') return j[k];
        if (j[k] && typeof j[k] === 'object') { const r = extractTafsirText(j[k], ayah); if (r) return r; }
    }
    if (Array.isArray(j.ayahs)) return extractTafsirText(j.ayahs, ayah);
    return '';
}

// ذاكرة محلية صغيرة للتفاسير التي جلبها المستخدم (لا تتجاوز 300 آية)
function tafsirCacheGet(key) {
    const v = lsGet(key, null);
    return (v && typeof v.t === 'string') ? v.t : null;
}

function tafsirCachePut(key, text) {
    const idx = lsGet(TAFSIR_IDX_KEY, []) || [];
    if (!idx.includes(key)) idx.push(key);
    while (idx.length > 300) { try { localStorage.removeItem(idx.shift()); } catch (e) {} }
    lsSet(key, { t: text });
    lsSet(TAFSIR_IDX_KEY, idx);
}

async function fetchTafsirOne(ed, surah1, ayah1) {
    const ck = TAFSIR_CACHE_PREFIX + ed.slug + '.' + surah1 + '.' + ayah1;
    const cached = tafsirCacheGet(ck);
    if (cached !== null) return cached;
    let lastErr = null;
    for (const base of TAFSIR_BASES) {
        try {
            const res = await fetch(base + ed.slug + '/' + surah1 + '/' + ayah1 + '.json');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const j = await res.json();
            const t = String(extractTafsirText(j, ayah1) || '').trim();
            tafsirCachePut(ck, t);
            return t;
        } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('تعذر جلب التفسير');
}

// بعض الكتب (كالسعدي) تجمع تفسير عدة آيات عند أولاها: إن كانت الآية بلا نص نرجع للآيات السابقة
async function loadTafsirText(edKey, surah1, ayah1) {
    const ed = TAFSIR_EDITIONS[edKey];
    for (let k = ayah1; k >= Math.max(1, ayah1 - 15); k--) {
        const t = await fetchTafsirOne(ed, surah1, k);
        if (t) return { text: t, from: k };
    }
    return { text: '', from: ayah1 };
}

// صفحة التفسير: تبويبان في الأعلى (الميسّر ثم السعدي)، وتفسير الوحدة المحدَّدة أو المقطع كله
// زر التفسير: يتلوّن (مفعّل) وينتظر الضغط على نص آية؛ الضغط عليه ثانية يلغي التفعيل
function prepOpenTafsir() {
    if (!prep || prepGuardHidden()) return;
    prepStopAudio();
    prepTafMode = !prepTafMode;
    const b = document.getElementById('prep-taf-btn');
    if (b) b.classList.toggle('taf-on', prepTafMode);
    if (prepTafMode) showToast('اضغط على نص آية لعرض تفسيرها.');
}

function prepOpenAyahTafsir(n) {
    prepStopAudio();
    const box = document.getElementById('exercise-container');
    prepScroll = box ? box.scrollTop : 0;
    prepTafAyah = n;
    showPrepTafsir();
}

function prepTafStep(d) {
    const n = prepTafAyah + d;
    if (n < prep.start || n > prep.end) return;
    prepTafAyah = n;
    showPrepTafsir();
}

function prepTafRange() {
    if (prepTafAyah !== null) return { from: prepTafAyah, to: prepTafAyah, label: 'الآية ' + prepTafAyah };
    return prepScope();
}

function showPrepTafsir() {
    const sc = prepTafRange();
    const html = `
        <div class="taf-tabs">
            <button type="button" id="taf-tab-muyassar" class="btn-secondary taf-tab" onclick="prepTafSwitch('muyassar')">${TAFSIR_EDITIONS.muyassar.name}</button>
            <button type="button" id="taf-tab-saadi" class="btn-secondary taf-tab" onclick="prepTafSwitch('saadi')">${TAFSIR_EDITIONS.saadi.name}</button>
        </div>
        <div class="exercise-box" id="exercise-container" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="surah-title" style="font-size: 16px;">سورة ${surahsNames[prep.surah]} — ${sc.label}</div>
            <div id="tafsir-body" class="taf-body"></div>
        </div>
        ${prepTafAyah !== null ? `<div class="taf-nav">
            <button type="button" id="taf-prev-btn" class="btn-secondary hf-btn" onclick="prepTafStep(-1)" ${prepTafAyah <= prep.start ? 'disabled' : ''}>الآية السابقة</button>
            <button type="button" id="taf-next-btn" class="btn-secondary hf-btn" onclick="prepTafStep(1)" ${prepTafAyah >= prep.end ? 'disabled' : ''}>الآية اللاحقة</button>
        </div>` : ''}
        <button type="button" id="taf-back-btn" class="btn-main" style="margin: 0 auto;" onclick="prepBackFromTafsir()">رجوع</button>
        ${hfUtilRow('', '')}
    `;
    renderInContainer(html);
    applyTheme();
    prepTafRender();
}

function prepTafSwitch(edKey) {
    if (edKey === prepTafEd) return;
    prepTafEd = edKey;
    prepTafRender();
}

async function prepTafRender() {
    const myToken = ++prepTafToken;
    const edKey = prepTafEd;
    const _range = prepTafRange();
    ['muyassar', 'saadi'].forEach((k) => {
        const b = document.getElementById('taf-tab-' + k);
        if (b) b.classList.toggle('active', k === edKey);
    });
    const body = document.getElementById('tafsir-body');
    if (!body || !prep) return;
    const sc = _range;
    const multi = sc.to > sc.from;
    body.textContent = '';
    const jobs = [];
    for (let n = sc.from; n <= sc.to; n++) {
        const sec = document.createElement('div');
        sec.className = 'taf-sec';
        if (multi) {
            const t = document.createElement('div');
            t.className = 'taf-sec-title';
            t.textContent = 'الآية ' + n;
            sec.appendChild(t);
        }
        const ay = document.createElement('div');
        ay.className = 'taf-ayah';
        ay.innerHTML = `${getAyahText(userRiwaya, prep.surah, n - 1) || ''} <span class="circle-num">${n}</span>`;
        sec.appendChild(ay);
        const tx = document.createElement('div');
        tx.className = 'taf-text';
        tx.textContent = 'جارٍ تحميل التفسير…';
        sec.appendChild(tx);
        body.appendChild(sec);
        jobs.push({ n, tx });
    }

    const seen = new Set();
    const addMsg = (parent, msg) => {
        const d = document.createElement('div');
        d.textContent = msg;
        parent.appendChild(d);
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn-secondary hf-btn taf-retry';
        b.textContent = 'إعادة المحاولة';
        b.onclick = () => prepTafRender();
        parent.appendChild(b);
    };
    const run = async ({ n, tx }) => {
        let targets = null;
        try { targets = await tafsirTargets(prep.surah, n); } catch (e) { targets = null; }
        if (myToken !== prepTafToken) return;
        tx.textContent = '';
        if (!targets) { addMsg(tx, 'تعذر ضبط ترقيم هذه الآية على رواية حفص. تحقق من الاتصال بالإنترنت.'); return; }
        const showNo = userRiwaya !== 1 && !(targets.length === 1 && targets[0] === n);
        for (const h of targets) {
            const blk = document.createElement('div');
            blk.className = 'taf-blk';
            if (showNo) {
                const t = document.createElement('div');
                t.className = 'taf-sec-title';
                t.textContent = 'تفسير الآية ' + h + ' (ترقيم حفص)';
                blk.appendChild(t);
            }
            tx.appendChild(blk);
            if (seen.has(h)) {
                const d = document.createElement('div');
                d.textContent = 'سبق عرض تفسير هذه الآية.';
                blk.appendChild(d);
                continue;
            }
            seen.add(h);
            try {
                const r = await loadTafsirText(edKey, prep.surah + 1, h);
                if (myToken !== prepTafToken) return;
                if (!r.text) {
                    const d = document.createElement('div');
                    d.textContent = 'لا يوجد تفسير لهذه الآية في هذا الكتاب.';
                    blk.appendChild(d);
                } else {
                    if (r.from !== h) {
                        const note = document.createElement('div');
                        note.className = 'taf-note';
                        note.textContent = 'هذا التفسير مذكور عند الآية ' + r.from + ' لأنه يشمل عدة آيات.';
                        blk.appendChild(note);
                    }
                    const d = document.createElement('div');
                    d.textContent = r.text;
                    blk.appendChild(d);
                }
            } catch (e) {
                if (myToken !== prepTafToken) return;
                seen.delete(h);
                addMsg(blk, 'تعذر تحميل التفسير. تحقق من الاتصال بالإنترنت.');
            }
        }
    };
    // أربع طلبات متوازية على الأكثر حتى لا يُثقَل الهاتف عند تفسير مقطع طويل
    const queue = jobs.slice();
    const workers = Array.from({ length: Math.min(4, queue.length) }, async () => {
        while (queue.length) await run(queue.shift());
    });
    await Promise.all(workers);
}

function prepBackFromTafsir() {
    prepTafToken++;
    prepTafMode = false;
    prepTafAyah = null;
    showPrepPage(true);
}

async function initApp() {
    loadSettings();
    await migrateFromOldIndexedDBOnce();
    applyTheme();
    showWelcomeScreen();
    // تحميل مسبق صامت للنصوص حتى يكون زر "ابدأ الان" فورياً
    ensureTextsForRiwaya(userRiwaya).catch(() => {});
}

initApp();
    </script>
