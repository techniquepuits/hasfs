<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق ابن باديس - تثبيت حفظ القرآن الكريم</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d6a4f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
/* ==========================================================
   تطبيق ابن باديس - الأنماط (style.css سابقاً)
   ========================================================== */
body {
    font-family: 'Amiri', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f0f4f1 0%, #d8e4dc 100%);
    color: #2c3e50;
    text-align: center;
    margin: 0;
    padding: 10px 0;
    min-height: 95vh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    transition: background 0.3s ease, color 0.3s ease;
}

/* الوضع الليلي الكامل المحدث */
body.dark-mode {
    background: linear-gradient(135deg, #111827 0%, #0f172a 100%) !important;
    color: #f1f5f9 !important;
}

body.dark-mode .welcome-container,
body.dark-mode .exercise-box {
    background: #1e293b !important;
    border-color: #334155 !important;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4) !important;
    color: #f1f5f9 !important;
}

body.dark-mode .app-title,
body.dark-mode .surah-title,
body.dark-mode .settings-title {
    color: #34d399 !important;
}

body.dark-mode .app-slogan {
    color: #94a3b8 !important;
}

body.dark-mode .btn-secondary,
body.dark-mode .setting-row-box,
body.dark-mode .surah-list-container {
    background: #0f172a !important;
    border-color: #334155 !important;
    color: #f1f5f9 !important;
}

body.dark-mode .setting-row-label,
body.dark-mode .radio-label {
    color: #e2e8f0 !important;
}

body.dark-mode .header-box {
    border-bottom-color: #334155 !important;
}

body.dark-mode .expand-arc-btn,
body.dark-mode .audio-btn,
body.dark-mode .btn-recording,
body.dark-mode .btn-audio-sheikh,
body.dark-mode .btn-home {
    background: #0f172a !important;
    border-color: #475569 !important;
    color: #34d399 !important;
}

body.dark-mode .expand-arc-btn:hover,
body.dark-mode .audio-btn:hover,
body.dark-mode .btn-recording:hover,
body.dark-mode .btn-audio-sheikh:hover,
body.dark-mode .btn-home:hover {
    background: #34d399 !important;
    color: #0f172a !important;
    border-color: #34d399 !important;
}

body.dark-mode #daily-progress-badge {
    background: #0f172a !important;
    border-color: #475569 !important;
    color: #34d399 !important;
}

body.dark-mode .circle-num {
    border-color: #34d399 !important;
    color: #34d399 !important;
}

body.dark-mode .ayah-blue {
    color: #60a5fa !important;
}

body.dark-mode .ayah-green {
    color: #4ade80 !important;
}

body.dark-mode .ayah-gray {
    color: #94a3b8 !important;
}

body.dark-mode .blank-space-gray {
    color: #94a3b8 !important;
}

#main-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
}

.welcome-container {
    position: relative;
    max-width: 850px;
    width: 92%;
    height: 90vh;
    max-height: 750px;
    margin: 0 auto;
    background: #ffffff;
    padding: 25px 20px;
    border-radius: 24px;
    box-shadow: 0 12px 35px rgba(27, 77, 62, 0.08);
    border: 1px solid rgba(45, 106, 79, 0.15);
    box-sizing: border-box;
    text-align: right;
    display: flex;
    flex-direction: column;
}

.settings-icon {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #1b4d3e;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 10;
}
.settings-icon:hover {
    background: #2d6a4f;
    color: white;
    border-color: #2d6a4f;
}

.help-icon {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #f1f5f9;
    border: 1.5px solid #cbd5e1;
    color: #1b4d3e;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
}
.help-icon:hover {
    background: #2d6a4f;
    color: white;
    border-color: #2d6a4f;
}

.home-content {
    text-align: center;
}

.app-icon {
    width: 75px;
    height: 75px;
    background: linear-gradient(135deg, #2d6a4f 0%, #1b4d3e 100%);
    color: white;
    font-size: 36px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin: 0 auto 20px auto;
    box-shadow: 0 6px 15px rgba(45, 106, 79, 0.25);
}

.app-title {
    font-size: 40px;
    font-weight: bold;
    color: #1b4d3e;
    margin-bottom: 8px;
}

.app-slogan {
    font-size: 16px;
    color: #52796f;
    margin-bottom: 35px;
    font-weight: 700;
}

.btn-main {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 15px auto;
    background: linear-gradient(135deg, #2d6a4f 0%, #1b4d3e 100%);
    color: white;
    border: none;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
    text-align: center;
}
.btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(45, 106, 79, 0.4);
}

.btn-secondary {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    color: #334155;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 13px 20px;
    border-radius: 12px;
    transition: all 0.2s ease;
    box-sizing: border-box;
    text-align: center;
}
.btn-secondary:hover {
    background: #f1f5f9;
    border-color: #94a3b8;
}

/* القائمة الرئيسية: الزران بحجمهما الطبيعي، متمركزان عمودياً مع مسافة بينهما */
.home-content.menu-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.menu-head { flex-shrink: 0; }
.menu-buttons {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    gap: 36px;
    padding-top: 36px;     /* = gap: نفس المسافة بين الشعار والزر الأول وبين الزرين */
}
.menu-item { width: 100%; max-width: 420px; text-align: center; }
.menu-item .btn-main, .menu-item .btn-secondary { margin: 0; max-width: 100%; }
.menu-sub { font-size: 11px; color: #64748b; margin-top: 3px; font-weight: normal; }
body.dark-mode .menu-sub { color: #94a3b8; }

/* النافذة المنبثقة لاختيار آية البداية */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
    z-index: 100;
    animation: fadeIn 0.15s ease-in-out;
}
.modal-box {
    width: 100%;
    max-width: 380px;
    max-height: 94vh;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid rgba(45, 106, 79, 0.25);
    border-radius: 18px;
    padding: 16px 14px 14px 14px;
    box-sizing: border-box;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    text-align: center;
}
.modal-title { font-size: 19px; font-weight: bold; color: #1b4d3e; margin-bottom: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 12px; }
.modal-actions button {
    flex: 1;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    padding: 10px 6px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
}
.modal-actions .btn-start-review { background: linear-gradient(135deg, #2d6a4f 0%, #1b4d3e 100%); color: #ffffff; border: none; }
.modal-actions .btn-cancel { background: #f1f5f9; color: #334155; border: 1.5px solid #cbd5e1; }
body.dark-mode .modal-box { background: #1e293b !important; border-color: #334155 !important; }
body.dark-mode .modal-title { color: #34d399 !important; }
body.dark-mode .modal-actions .btn-cancel { background: #0f172a !important; color: #e2e8f0 !important; border-color: #475569 !important; }

/* خانة رقم الآية ولوحة الأرقام (بدل لوحة مفاتيح الهاتف) */
.numpad-display-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 0 10px 0;
}
.numpad-label { font-size: 14px; font-weight: bold; color: #1b4d3e; }
.numpad-display {
    width: 76px;
    height: 34px;
    padding: 0 4px;
    text-align: center;
    font-family: inherit;
    font-size: 19px;
    font-weight: bold;
    line-height: 1;
    color: #1b4d3e;
    background: #ffffff;
    border: 2px solid #2d6a4f;
    border-radius: 8px;
    box-sizing: border-box;
    caret-color: transparent;
    outline: none;
}
.numpad-display::placeholder { color: #94a3b8; opacity: 1; }
.numpad-max { font-size: 12px; color: #64748b; white-space: nowrap; }
.numpad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    width: 100%;
    margin: 0 auto;
    direction: rtl;
}
.numpad button {
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    padding: 8px 0;
    color: #1b4d3e;
    background: #f1f5f9;
    border: 1.5px solid #cbd5e1;
    border-radius: 9px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s ease;
}
.numpad button:active { background: #2d6a4f; color: #ffffff; border-color: #2d6a4f; }
.numpad .np-del, .numpad .np-clear { font-size: 14px; color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
.numpad .np-del:active, .numpad .np-clear:active { background: #dc2626; color: #ffffff; border-color: #dc2626; }
body.dark-mode .numpad-display { background: #0f172a !important; color: #34d399 !important; border-color: #34d399 !important; }
body.dark-mode .numpad-label { color: #34d399 !important; }
body.dark-mode .numpad button { background: #0f172a !important; color: #e2e8f0 !important; border-color: #475569 !important; }
body.dark-mode .numpad .np-del, body.dark-mode .numpad .np-clear { color: #fca5a5 !important; }


.settings-header {
    text-align: center;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 12px;
    margin-bottom: 20px;
}
.settings-title {
    font-size: 22px;
    font-weight: bold;
    color: #1b4d3e;
    margin: 0;
}

.setting-row-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f1f5f9;
    padding: 12px 15px;
    border-radius: 12px;
    border: 1.5px solid #cbd5e1;
    margin-bottom: 20px;
}
.setting-row-label {
    font-size: 15px;
    font-weight: bold;
    color: #1e293b;
}

.radio-options {
    display: flex;
    gap: 15px;
}
.radio-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
}
.radio-label input[type="radio"] {
    accent-color: #2d6a4f;
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.surah-list-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f8fafc;
    padding: 12px;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    max-height: 250px;
    overflow-y: auto;
    text-align: right;
}

.header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 10px;
    flex-shrink: 0;
}
.surah-title {
    font-size: 20px;
    font-weight: bold;
    color: #1b4d3e;
}

.exercise-box {
    flex: 1;
    min-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    position: relative;
    padding: 15px;
    box-sizing: border-box;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 15px;
}

.continuous-quran-text {
    text-align: right;
    font-size: 23px;
    line-height: 3.5;
    width: 100%;
}

.ayah-blue { color: #2563eb !important; font-weight: bold; }
.ayah-green { color: #16a34a !important; font-weight: bold; }
.blank-space { display: inline; visibility: hidden; font-weight: bold; font-family: 'Amiri', serif; margin: 0 4px; }
.blank-space-gray { display: inline; visibility: hidden; font-weight: bold; font-family: 'Amiri', serif; margin: 0 4px; color: #4b5563 !important; }

.circle-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: 1.5px solid #2d6a4f;
    border-radius: 50%;
    font-size: 13px;
    color: #2d6a4f;
    margin: 0 1px;
    vertical-align: middle;
}

#action-area, #rating-area {
    flex-shrink: 0;
    width: 100%;
}

.rating-buttons {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-top: 0;
    width: 100%;
}
.btn-rate {
    flex: 1;
    padding: 12px 5px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    text-align: center;
}
.btn-forgot { background-color: #dc2626; }
.btn-hard { background-color: #d97706; }
.btn-good { background-color: #2563eb; }
.btn-easy { background-color: #16a34a; }

.hidden { display: none !important; }

@media screen and (max-width: 768px) {
    .welcome-container { padding: 15px 10px; width: 96%; height: 94vh; }
    .app-title { font-size: 30px; }
    .exercise-box { font-size: 21px !important; line-height: 2.8; padding: 12px 8px !important; }
    .circle-num { width: 22px; height: 22px; font-size: 11px; }
    .btn-rate { padding: 10px 2px; font-size: 13px; }
    .surah-title { font-size: 16px; }
}

.btn-home {
    background-color: #64748b;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: all 0.2s ease;
}
.btn-home:hover {
    background-color: #475569;
}

.expand-arc-btn {
    position: absolute;
    top: 2px;
    left: 2px;
    background: #f1f5f9;
    border: 1.5px solid #cbd5e1;
    color: #1b4d3e;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 5;
}
.expand-arc-btn:hover {
    background: #2d6a4f;
    color: white;
    border-color: #2d6a4f;
}

.audio-btn {
    position: absolute;
    bottom: 2px;
    left: 2px;
    background: #f1f5f9;
    border: 1.5px solid #cbd5e1;
    color: #1b4d3e;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 5;
}
.audio-btn:hover {
    background: #2d6a4f;
    color: white;
    border-color: #2d6a4f;
}

.ayah-gray {
    color: #374151 !important;
    font-weight: bold;
}

.action-top-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 6px;
    width: 100%;
}

.btn-recording, .btn-audio-sheikh {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    color: #1b4d3e;
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
}

.btn-recording:hover, .btn-audio-sheikh:hover {
    background: #f1f5f9;
    border-color: #2d6a4f;
}

.recording-active {
    background-color: #fee2e2 !important;
    border-color: #dc2626 !important;
    color: #dc2626 !important;
    animation: pulse-red 1.5s infinite;
}

.playing-active {
    background-color: #dbeafe !important;
    border-color: #2563eb !important;
    color: #2563eb !important;
}

.btn-record-big {
    flex: 1;
    padding: 13px 10px;
    font-size: 18px;
    font-weight: 800;
    border-radius: 12px;
    border: 2px solid #dc2626;
    background: #fef2f2;
    color: #b91c1c;
}
.btn-show-half {
    flex: 1;
    width: auto;
    max-width: none;
    margin: 0;
    padding: 13px 10px;
    font-size: 18px;
}
.ayah-stumbled { border-bottom: 3px solid #d97706; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 60; max-width: 90%; font-size: 14px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.circle-num:empty { display: none; }
.ayah-actions-bar {
    display: flex;
    gap: 6px;
    width: 100%;
    margin-bottom: 6px;
}
.ayah-actions-bar .btn-rate { padding: 13px 4px; font-size: 14px; border-radius: 10px; }
.btn-record-big:hover { background: #fee2e2; border-color: #b91c1c; }
body.dark-mode .btn-recording.btn-record-big {
    background: #1f1315 !important;
    border: 2px solid #f87171 !important;
    color: #fca5a5 !important;
}
.rec-indicator {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 4px auto 8px;
    line-height: 1.4;
    padding: 6px 16px;
    width: fit-content;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 700;
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
}
.rec-indicator.on { display: flex; }
.rec-dot {
    position: relative;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #dc2626;
    flex-shrink: 0;
}
.rec-indicator.live .rec-dot { animation: rec-core 1.2s ease-in-out infinite; }
.rec-indicator.live .rec-dot::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: 50%;
    background: #dc2626;
    animation: rec-ring 1.2s ease-out infinite;
}
.rec-indicator.paused { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
.rec-indicator.paused .rec-dot { background: #94a3b8; }
body.dark-mode .rec-indicator { background: #3b1518; color: #fca5a5; border-color: #7f1d1d; }
body.dark-mode .rec-indicator.paused { background: #1e293b; color: #cbd5e1; border-color: #475569; }
@keyframes rec-ring { 0% { transform: scale(1); opacity: 0.6; } 100% { transform: scale(3); opacity: 0; } }
@keyframes rec-core { 0%,100% { transform: scale(0.85); } 50% { transform: scale(1.1); } }

@keyframes pulse-red {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
}

/* كانت داخل الكود مباشرة: دوران شاشة التحميل + ظهور القائمة المنبثقة */
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>

    <div id="main-container">
        <!-- يتم تعبئتها ديناميكياً بواسطة السكربت -->
    </div>

    <script>

// ==========================================================
// 2. طبقة التخزين (localStorage)
// ==========================================================

function lsGet(key, fallback) {
    try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
        return fallback;
    }
}

function lsSet(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
    } catch (e) {
        console.warn("تعذر الحفظ في localStorage:", key, e);
        return false;
    }
}

    if (s.riwaya === 0 || s.riwaya === 1) userRiwaya = s.riwaya;
    isDarkMode = s.darkMode === true;
}

function saveSettings() {

        darkMode: isDarkMode

// quranTexts[riwaya][surah][ayah] -> نص الآية
const quranTexts = [null, null];
let staticFetchPromises = {};

function fetchStaticFile(fileName) {
    if (!staticFetchPromises[fileName]) {
        const url = STATIC_FILES[fileName];
        if (!url) return Promise.reject(new Error("ملف غير معرّف: " + fileName));
        staticFetchPromises[fileName] = fetch(url)
            .then((res) => {
                if (!res.ok) throw new Error("تعذر جلب الملف: " + fileName + " (" + res.status + ")");
                return res.json();
            })
            .catch((err) => {
                delete staticFetchPromises[fileName];
                throw err;
            });
    }
    return staticFetchPromises[fileName];
}

function isValidRiwayaTexts(x) {
    return Array.isArray(x) && x.length === 114 && Array.isArray(x[0]) && x[0].length > 0;
}

// يضمن وجود نصوص الرواية في الذاكرة: من localStorage أولاً، وإلا من GitHub
async function ensureTextsForRiwaya(riwaya) {
    if (quranTexts[riwaya]) return;

    const cached = lsGet(LS_KEYS.texts(riwaya), null);
    if (isValidRiwayaTexts(cached)) {
        quranTexts[riwaya] = cached;
        return;
    }

    const json = await fetchStaticFile("ayah_texts.json");
    const all = json.ayah_texts || json;

    for (let r = 0; r < all.length; r++) {
        if (!quranTexts[r] && isValidRiwayaTexts(all[r])) quranTexts[r] = all[r];
    }
    delete staticFetchPromises["ayah_texts.json"];   // تحرير الذاكرة

    if (!quranTexts[riwaya]) throw new Error("ملف النصوص لا يحتوي على الرواية المطلوبة.");

    // نخزّن الرواية المطلوبة أولاً ثم الأخرى إن اتسعت المساحة
    lsSet(LS_KEYS.texts(riwaya), quranTexts[riwaya]);
    const other = 1 - riwaya;
    if (quranTexts[other]) lsSet(LS_KEYS.texts(other), quranTexts[other]);
}

// عدد آيات السورة مستنتج من نص الرواية نفسها (يعالج اختلاف عدّ ورش عن حفص)
function getAyatCount(surahIndex, riwaya) {
    const r = (riwaya === undefined) ? userRiwaya : riwaya;
    return quranTexts[r]?.[surahIndex]?.length || 0;
}

function getAyahText(riwaya, surah, ayah) {
    return quranTexts[riwaya]?.[surah]?.[ayah];
}

// 4. ترحيل الإعدادات القديمة (IndexedDB -> localStorage) مرة واحدة
// ==========================================================

function readOldIndexedDB() {
    return new Promise((resolve) => {
        let finished = false;
        const done = (v) => { if (!finished) { finished = true; resolve(v); } };
        if (!window.indexedDB) return done(null);
        setTimeout(() => done(null), 3000);   // حماية من التعليق

        let req;
        try { req = indexedDB.open("IbnBadisQuranDB"); } catch (e) { return done(null); }

        // إن لم تكن القاعدة موجودة نلغي الإنشاء حتى لا نخلق قاعدة فارغة
        req.onupgradeneeded = (e) => { try { e.target.transaction.abort(); } catch (_) {} done(null); };
        req.onerror = () => done(null);
        req.onsuccess = (e) => {
            const db = e.target.result;
            try {
                if (!db.objectStoreNames.contains("quranStore")) { db.close(); return done(null); }
                const tx = db.transaction("quranStore", "readonly");
                const store = tx.objectStore("quranStore");
                const out = { config: null };
                const r2 = store.get("user_app_config.json");
                r2.onsuccess = () => { out.config = r2.result || null; };
                tx.oncomplete = () => { db.close(); done(out); };
                tx.onerror = tx.onabort = () => { db.close(); done(null); };
            } catch (err) {
                try { db.close(); } catch (_) {}
                done(null);
            }
        };
    });
}

async function migrateFromOldIndexedDBOnce() {
    if (lsGet(LS_KEYS.migrated, false)) return;

    // أول تشغيل (لا إعدادات محفوظة بعد): نستورد الإعدادات القديمة إن وُجدت
    if (lsGet(LS_KEYS.settings, null) === null) {
        const old = await readOldIndexedDB();
        if (old && old.config) {
            if (old.config.riwaya === 0 || old.config.riwaya === 1) userRiwaya = old.config.riwaya;
            saveSettings();
        }
    }
    lsSet(LS_KEYS.migrated, true);
}

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    const installBtn = document.getElementById('install-app-btn');
    if (installBtn) installBtn.style.display = 'block';
});

async function installAppToDevice() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            const installBtn = document.getElementById('install-app-btn');
            if (installBtn) installBtn.style.display = 'none';
        }
        deferredPrompt = null;
    }
}

async function changeRiwayaSetting(riwayaIndex) {
    const previous = userRiwaya;
    userRiwaya = riwayaIndex;
    try {
        await ensureTextsForRiwaya(riwayaIndex);
        saveSettings();
    } catch (e) {
        userRiwaya = previous;
        alert("تعذر تحميل نصوص هذه الرواية (تحقق من الاتصال بالإنترنت). تم الرجوع للرواية السابقة.");
        const radio = document.querySelector(`input[name="riwaya"][value="${previous}"]`);
        if (radio) radio.checked = true;
    }
}

async function saveSettingsAndReturn() {
    // لا نغادر الإعدادات قبل أن تكون نصوص الرواية المختارة جاهزة
    try {
        await ensureTextsForRiwaya(userRiwaya);
    } catch (e) {
        userRiwaya = quranTexts[0] ? 0 : (quranTexts[1] ? 1 : userRiwaya);
        alert("تعذر تحميل نصوص الرواية المختارة (تحقق من الاتصال بالإنترنت). تم الرجوع للرواية المحمّلة.");
    }

    saveSettings();
    alert("تم حفظ الإعدادات بنجاح!");
    showMainButtons();
}

function ayahKey(surah, ayah) { return surah + ":" + ayah; }
function loadAyahStore(riwaya) {
    const o = lsGet(LS_KEYS.ayahs(riwaya), {});
    return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
}
function saveAyahStore(riwaya, store) { lsSet(LS_KEYS.ayahs(riwaya), store); }

// الزمن المرجعي بالأيام = Base ^ ((10 - الصعوبة) / 9)
function refTimeDays(d) { return Math.pow(BASE_DAYS, (10 - d) / 9); }
// الأولوية = الزمن المنقضي ÷ الزمن المرجعي
function priorityOf(rec, now) { return ((now - rec.t) / DAY_MS) / refTimeDays(rec.d); }

// تُستدعى من المراجعة اليومية عند الضغط على «تعثر»: تدخل الآية (أو تعود) بصعوبة 10
function addStumbledAyah(surah, ayah) {
    const store = loadAyahStore(userRiwaya);
    store[ayahKey(surah, ayah)] = { d: 10, t: Date.now() };
    saveAyahStore(userRiwaya, store);
}

// أعلى أولوية أولاً؛ نتجنب تكرار الآية التي راجعناها للتو إن وُجدت غيرها
function pickNextAyahForReview(excludeKey) {
    const riwaya = userRiwaya;
    const store = loadAyahStore(riwaya);
    const now = Date.now();
    let best = null, bestP = -Infinity, bestT = 0;
    let fallback = null;
    for (const k in store) {
        const rec = store[k];
        if (!rec || !Number.isFinite(rec.d) || !Number.isFinite(rec.t)) continue;
        const parts = k.split(":");
        const s = Number(parts[0]), a = Number(parts[1]);
        if (!Number.isInteger(s) || !Number.isInteger(a) || a < 0 || a >= getAyatCount(s, riwaya)) continue;
        const p = priorityOf(rec, now);
        const cand = { riwaya, surah: s, ayah: a, key: k };
        if (k === excludeKey) { fallback = cand; continue; }
        if (p > bestP || (p === bestP && rec.t < bestT)) { best = cand; bestP = p; bestT = rec.t; }
    }
    return best || fallback;
}

function loadNextAyahToReview() {
    resetRecordingStates();
    currentContextOffset = 0;

    const badgeEl = document.getElementById('daily-progress-badge');
    if (badgeEl) badgeEl.innerText = `راجعتَ: ${reviewedThisSession}`;

    const showBtn = document.getElementById('show-btn');
    const ratingArea = document.getElementById('rating-area');
    const sheikhBtn = document.getElementById('sheikh-audio-btn');
    const actionArea = document.getElementById('action-area');

    if (showBtn) showBtn.classList.remove('hidden');
    if (ratingArea) ratingArea.classList.add('hidden');
    if (sheikhBtn) sheikhBtn.classList.add('hidden');
    if (actionArea) actionArea.classList.remove('hidden');

    const promptAyahEl = document.getElementById('prompt-ayah');
    const promptNumEl = document.getElementById('prompt-num');
    const prevAyahsContainer = document.getElementById('prev-ayahs-container');
    const blank1 = document.getElementById('target-blank-1');
    const targetNum1El = document.getElementById('target-num-1');
    const targetBlank2 = document.getElementById('target-blank-2');
    const surahNameEl = document.getElementById('surah-name');
    const expandBtn = document.querySelector('.expand-arc-btn');
    const audioBtn = document.getElementById('play-ayah-audio-btn');
    if (expandBtn) expandBtn.style.display = '';
    if (audioBtn) audioBtn.style.display = '';

    if (prevAyahsContainer) prevAyahsContainer.innerHTML = "";
    if (targetBlank2) { targetBlank2.style.visibility = 'hidden'; targetBlank2.innerText = ""; }
    if (blank1) { blank1.style.visibility = 'hidden'; blank1.innerText = ""; blank1.classList.remove('ayah-green'); }
    if (targetNum1El) targetNum1El.innerText = "";
    if (promptNumEl) promptNumEl.innerText = "";

    const item = pickNextAyahForReview(lastReviewedKey);
    currentReviewItem = item;

    // القائمة فارغة: لا شيء يُراجَع بعد
    if (!item) {
        if (promptAyahEl) promptAyahEl.innerText = "لا توجد آيات في عقال الآيات بعد.\nابدأ بالمراجعة اليومية، وعندما تتعثر في آية اضغط عليها ثم «تعثر» لتُضاف إلى هنا.";
        if (surahNameEl) surahNameEl.innerText = "سورة: ---";
        if (actionArea) actionArea.classList.add('hidden');
        if (expandBtn) expandBtn.style.display = 'none';
        if (audioBtn) audioBtn.style.display = 'none';
        return;
    }

    const r = item.riwaya, sIdx = item.surah, t = item.ayah;   // t = الآية المطلوب استحضارها
    if (surahNameEl) surahNameEl.innerText = `سورة: ${surahsNames[sIdx]}`;

    // مطلع التمرين (الأزرق): الآية السابقة، أو عند أول آية: البسملة في ورش وعبارة «بداية السورة» في حفص
    if (t > 0) {
        if (promptAyahEl) promptAyahEl.innerText = getAyahText(r, sIdx, t - 1) || "";
        if (promptNumEl) promptNumEl.innerText = t;
    } else if (r === 0 && sIdx !== 8) {
        if (promptAyahEl) promptAyahEl.innerText = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
    } else {
        if (promptAyahEl) promptAyahEl.innerText = "— بداية السورة —";
    }

    const targetText = getAyahText(r, sIdx, t) || "تعذر جلب الآية المستهدفة.";
    targetAyahTextCache = targetText;
    if (blank1) blank1.innerText = targetText;
    if (targetNum1El) targetNum1El.innerText = t + 1;

    // تلميح رمادي: أول 3 كلمات من الآية التي بعدها
    const total = getAyatCount(sIdx, r);
    if (t + 1 < total) {
        const nextText = getAyahText(r, sIdx, t + 1);
        if (nextText && targetBlank2) targetBlank2.innerText = nextText.split(" ").slice(0, 3).join(" ") + " ...";
    } else if (targetBlank2) {
        targetBlank2.innerText = "نهاية السورة...";
    }
}

// ratingType: 'forgot' | 'hard' | 'good' | 'easy' و item = { riwaya, surah, ayah }
// الصعوبة الجديدة = (القديمة + نقطة الزر) ÷ 2 ، ويُحدَّث تاريخ آخر مراجعة
function onAyahRated(item, ratingType) {
    const pt = RATING_POINTS[ratingType];
    if (!item || !pt) return;
    const store = loadAyahStore(item.riwaya);
    const k = ayahKey(item.surah, item.ayah);
    const rec = store[k] || { d: 10, t: Date.now() };
    rec.d = (rec.d + pt) / 2;
    rec.t = Date.now();
    store[k] = rec;
    saveAyahStore(item.riwaya, store);
    lastReviewedKey = k;
}

function nextDailyQuestion(ratingType) {
    if (!currentReviewItem) return;
    onAyahRated(currentReviewItem, ratingType);
    reviewedThisSession++;
    loadNextAyahToReview();
}

function expandContext() {
    if (!currentReviewItem) return;
    currentContextOffset++;
    const targetAyahIndex = currentReviewItem.ayah - 1 - currentContextOffset;
    if (targetAyahIndex < 0) {
        alert("هذه هي الآية الأولى في السورة.");
        currentContextOffset--;
        return;
    }
    const prevAyahText = getAyahText(currentReviewItem.riwaya, currentReviewItem.surah, targetAyahIndex);
    const prevAyahNum = targetAyahIndex + 1;
    const prevAyahsContainer = document.getElementById('prev-ayahs-container');
    if (prevAyahsContainer && prevAyahText) {
        const ayahSpan = document.createElement('span');
        ayahSpan.className = "ayah-gray";
        ayahSpan.innerHTML = `${prevAyahText} <span class="circle-num">${prevAyahNum}</span> `;
        prevAyahsContainer.prepend(ayahSpan);
    }
}

let specialStartStr = "";

function selectSpecialSurah(surahIndex) {
    selectedSpecialSurah = surahIndex;
    const maxAyats = getAyatCount(surahIndex) || 7;
    specialStartStr = "";
    specialStartAyah = 1;
    specialEndAyah = maxAyats;

    const modal = document.getElementById('special-ayah-modal');
    if (!modal) return;

    // الحقل readonly + inputmode=none حتى لا تظهر لوحة مفاتيح الهاتف أبداً
    // الصف الأول: 1-6 | الصف الثاني (من اليمين): حذف، 7، 8، 9، 0، مسح (من اليسار)
    modal.innerHTML = `
        <div class="modal-box">
            <div class="modal-title">سورة ${surahsNames[surahIndex]}</div>
            <div class="numpad-display-row">
                <span class="numpad-label">آية البداية:</span>
                <input type="text" id="special-start-${surahIndex}" class="numpad-display" readonly inputmode="none" placeholder="1" value="">
                <span class="numpad-max">من ${maxAyats}</span>
            </div>
            <div class="numpad">
                <button type="button" onclick="numpadPress('1')">1</button>
                <button type="button" onclick="numpadPress('2')">2</button>
                <button type="button" onclick="numpadPress('3')">3</button>
                <button type="button" onclick="numpadPress('4')">4</button>
                <button type="button" onclick="numpadPress('5')">5</button>
                <button type="button" onclick="numpadPress('6')">6</button>
                <button type="button" class="np-del" onclick="numpadPress('back')" title="حذف">⌫</button>
                <button type="button" onclick="numpadPress('7')">7</button>
                <button type="button" onclick="numpadPress('8')">8</button>

                <button type="button" onclick="numpadPress('0')">0</button>
                <button type="button" class="np-clear" onclick="numpadPress('clear')" title="مسح الكل">مسح</button>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-start-review" onclick="initiateSpecialSessionExecution()">بدء المراجعة</button>
                <button type="button" class="btn-cancel" onclick="cancelSpecialModal()">إلغاء</button>
            </div>
        </div>
    `;

}

function closeSpecialModal() {
    const modal = document.getElementById('special-ayah-modal');
    if (modal) {
        modal.classList.add('hidden');
        modal.innerHTML = "";
    }
}

// الإلغاء: نغلق النافذة ونفكّ تحديد السورة (حتى يمكن اختيار نفس السورة من جديد)
function cancelSpecialModal() {
    closeSpecialModal();
    selectedSpecialSurah = null;
    specialStartStr = "";
    document.querySelectorAll('input[name="special-surah-radio"]').forEach((r) => { r.checked = false; });
}

function numpadPress(key) {
    if (selectedSpecialSurah === null) return;
    const maxAyats = getAyatCount(selectedSpecialSurah) || 7;
    const input = document.getElementById(`special-start-${selectedSpecialSurah}`);
    if (!input) return;

    if (key === 'back') {
        specialStartStr = specialStartStr.slice(0, -1);
    } else if (key === 'clear') {
        specialStartStr = "";
    } else {
        if (specialStartStr === "" && key === '0') return;      // لا توجد آية رقم 0
        let candidate = specialStartStr + key;
        if (parseInt(candidate, 10) > maxAyats) candidate = String(maxAyats);
        specialStartStr = candidate;
    }

    input.value = specialStartStr;
    specialStartAyah = parseInt(specialStartStr, 10) || 1;      // الفراغ = الآية 1
    specialEndAyah = maxAyats;
}

function validateSpecialInputs(surahIndex) {
    const maxAyats = getAyatCount(surahIndex) || 7;
    const startInput = document.getElementById(`special-start-${surahIndex}`);

    let valStart = startInput ? (parseInt(startInput.value, 10) || 1) : 1;
    if (valStart < 1) valStart = 1;
    if (valStart > maxAyats) valStart = maxAyats;
    if (startInput && startInput.value !== "") startInput.value = valStart;

    specialStartAyah = valStart;
    specialEndAyah = maxAyats;
}

function initiateSpecialSessionExecution() {
    if (selectedSpecialSurah === null) return;
    validateSpecialInputs(selectedSpecialSurah);
    closeSpecialModal();
    loadSpecialFullSectionExercise();
}

function loadSpecialFullSectionExercise() {
    resetRecordingStates();

    const currentRiwaya = userRiwaya;

    // الآن فقط (بعد تأكيد السورة والآية) تظهر منطقة التسجيل وعرض الإجابة

    const ratingArea = document.getElementById('rating-area');
    const sheikhBtn = document.getElementById('sheikh-audio-btn');

    specialRevealed = false;

    ayahBarIndex = null;
    stumbledSet = new Set();
    const barEl = document.getElementById('ayah-actions-bar');
    if (barEl) barEl.classList.add('hidden');
    if (showBtn) {
        showBtn.classList.add('hidden');   // لا معنى لإظهار الآيات قبل التسجيل
        showBtn.removeAttribute('disabled');
        showBtn.style.opacity = '1';
        showBtn.setAttribute('onclick', 'revealSpecialFullAnswer()');
    }
    if (ratingArea) ratingArea.classList.add('hidden');
    if (sheikhBtn) sheikhBtn.classList.add('hidden');
    if (recordBtn) {
        recordBtn.classList.remove('hidden');
        recordBtn.removeAttribute('disabled');
        recordBtn.innerText = "🎙️ بداية التسجيل";
        recordBtn.className = "btn-recording btn-record-big";
        recordBtn.setAttribute('onclick', 'handleSpecialRecordingToggle()');
    }

    const exerciseContainer = document.getElementById('exercise-container');

    let promptText = "";
    let promptNumDisplay = "";

    if (specialStartAyah === 1) {
        // في حفص البسملة جزء من نص الآية الأولى (وسورة التوبة بلا بسملة): لا نكتبها كمطلع.
        // في ورش تُكتب بالأزرق ثم تُمحى عند إظهار الآيات.
        const firstText = getAyahText(currentRiwaya, selectedSpecialSurah, 0) || "";
        const norm = firstText.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640\uFEFF]/g, "").replace(/[\u0671\u0622\u0623\u0625]/g, "ا").trim();
        const hasBasmalaInside = norm.startsWith("بسم الله الرحمن الرحيم");
        if (!hasBasmalaInside && selectedSpecialSurah !== 8) {
            promptText = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
        }
        promptNumDisplay = "";
    } else {
        const prevIdx = specialStartAyah - 2;
        promptText = getAyahText(currentRiwaya, selectedSpecialSurah, prevIdx) || "";
        promptNumDisplay = prevIdx + 1;
    }

    let fullTargetHTML = "";
    for (let a = specialStartAyah - 1; a < specialEndAyah; a++) {
        const text = getAyahText(currentRiwaya, selectedSpecialSurah, a) || "";
        const num = a + 1;
        fullTargetHTML += `
            <span id="special-ayah-item-${a}"
                  onclick="handleSpecialAyahClick(${a})"
                  style="cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: background 0.2s;">
                ${text} <span class="circle-num">${num}</span>
            </span> `;
    }

    const customLayoutHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px;">
            <span style="font-size: 14px; font-weight: bold; color: #2d6a4f;">البدء من الآية ${specialStartAyah}</span>
            <span class="surah-title" style="font-size: 16px;">سورة: ${surahsNames[selectedSpecialSurah]}</span>
        </div>
        <div class="continuous-quran-text" style="text-align: right; font-size: 21px; line-height: 3.5;">
            ${promptText ? `<span id="${specialStartAyah === 1 ? 'special-basmala-prompt' : 'special-prev-prompt'}" class="ayah-blue">${promptText}</span>` : ""}
            ${promptNumDisplay !== "" ? `<span class="circle-num">${promptNumDisplay}</span>` : ""}
            <div id="rec-indicator" class="rec-indicator"><span class="rec-dot"></span><span id="rec-indicator-text">جارٍ التسجيل...</span></div>

            <span id="special-full-target-blank" class="blank-space" style="visibility: hidden; color: #16a34a !important;">${fullTargetHTML}</span>
        </div>
    `;

    if (exerciseContainer) {
        exerciseContainer.innerHTML = customLayoutHTML;
    }
}

// «تعثر»: تُدرج الآية المحددة في عقال الآيات بصعوبة 10
function markStumbled() {
    if (ayahBarIndex === null || selectedSpecialSurah === null) return;
    addStumbledAyah(selectedSpecialSurah, ayahBarIndex);
    stumbledSet.add(ayahBarIndex);
    const el = document.getElementById(`special-ayah-item-${ayahBarIndex}`);
    if (el) el.classList.add('ayah-stumbled');
    refreshStumbleBtn();
}

    const t = document.createElement('div');
    t.id = 'app-toast';
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.remove(); }, 3500);
}

// قائمة روابط الملفات الصوتية للآية (قد تكون بسملة ثم الآية)
function ayahAudioUrls(riwaya, surah, ayah) {
    const base = SHEIKH_AUDIO_BASE[riwaya];
    if (!base) return null;
    const f = (s, a) => base + String(s + 1).padStart(3, "0") + String(a + 1).padStart(3, "0") + ".mp3";
    const urls = [];
    // في حفص نص الآية الأولى يتضمن البسملة، بينما ملف الآية الأولى في المصدر بدونها
    if (riwaya === 1 && ayah === 0 && surah !== 0 && surah !== 8) urls.push(f(0, 0));
    urls.push(f(surah, ayah));
    return urls;
}

function refreshSheikhBtn() {
    const b = document.getElementById('sheikh-bar-btn');
    if (b) b.innerText = sheikhPlaying ? "⏹ إيقاف" : "🔊 الشيخ";
}

function stopSheikh() {
    if (sheikhAudio) {
        sheikhAudio.onended = null;
        sheikhAudio.onerror = null;
        try { sheikhAudio.pause(); } catch (e) {}
        sheikhAudio = null;
    }
    sheikhPlaying = false;
    refreshSheikhBtn();
}

function playSheikhAyah(surah, ayah) {
    if (sheikhPlaying) { stopSheikh(); return; }
    if (surah === null || surah === undefined || ayah === null || ayah === undefined) return;
    const urls = ayahAudioUrls(userRiwaya, surah, ayah);
    if (!urls) { showToast("صوت الشيخ متاح حالياً لرواية حفص فقط."); return; }
    stopMyClip();
    if (playbackAudioElement && isPlayingRecording) {
        playbackAudioElement.pause();
        isPlayingRecording = false;
    }
    const fail = () => { stopSheikh(); showToast("تعذر تشغيل صوت الشيخ. تحقق من الاتصال بالإنترنت."); };
    let i = 0;
    const next = () => {
        if (i >= urls.length) { stopSheikh(); return; }
        const a = new Audio(urls[i++]);
        sheikhAudio = a;
        a.onended = next;
        a.onerror = fail;
        a.play().catch(fail);
    };
    sheikhPlaying = true;
    refreshSheikhBtn();
    next();
}

function stopMyClip() {
    if (playbackAudioElement && myClipHandler) {
        playbackAudioElement.removeEventListener('timeupdate', myClipHandler);
        try { playbackAudioElement.pause(); } catch (e) {}
    }
    myClipHandler = null;
}

// «صوتي»: يعيد آخر 5 ثوانٍ من تسجيلك قبل لحظة الضغط على الآية
function playMyLastFiveSeconds() {
    const a = playbackAudioElement;
    if (!a || !recordedAudioBlob) { showToast("لا يوجد تسجيل لك لسماعه."); return; }
    const end = ayahBarPausePos;
    if (end < 0.5) { showToast("شغّل التسجيل أولاً، ثم اضغط على الآية عند موضع التعثر."); return; }
    stopSheikh();
    stopMyClip();
    try { a.currentTime = Math.max(0, end - 5); } catch (e) {}
    myClipHandler = () => {
        if (a.currentTime >= end - 0.05) {
            stopMyClip();
            try { a.currentTime = end; } catch (e) {}
        }
    };
    a.addEventListener('timeupdate', myClipHandler);
    a.play().catch(() => {});
}

function handleSpecialAyahClick(ayahIndex) {
    if (!specialRevealed) return;
    const bar = document.getElementById('ayah-actions-bar');
    const recordBtn = document.getElementById('record-action-btn');
    const barAlreadyOpen = bar && !bar.classList.contains('hidden');

    for (let a = specialStartAyah - 1; a < specialEndAyah; a++) {
        const el = document.getElementById(`special-ayah-item-${a}`);
        if (el) el.style.backgroundColor = "transparent";
    }
    const clicked = document.getElementById(`special-ayah-item-${ayahIndex}`);
    if (clicked) clicked.style.backgroundColor = "rgba(254, 240, 138, 0.6)";
    ayahBarIndex = ayahIndex;
    refreshStumbleBtn();

    if (!barAlreadyOpen) {
        ayahBarWasPlaying = !!isPlayingRecording;
        if (isPlayingRecording && playbackAudioElement) {
            playbackAudioElement.pause();
            isPlayingRecording = false;
        }
        ayahBarPausePos = playbackAudioElement ? (playbackAudioElement.currentTime || 0) : 0;
        if (recordBtn) {
            recordBtn.classList.add('hidden');
            recordBtn.classList.remove('playing-active');
            if (ayahBarWasPlaying) recordBtn.innerText = "▶️ مواصلة العرض";
        }
        if (bar) bar.classList.remove('hidden');
    }
}

// زر المواصلة: تختفي الأزرار الأربعة ويعود العرض من حيث توقف
function resumeNormalReading() {
    for (let a = specialStartAyah - 1; a < specialEndAyah; a++) {
        const el = document.getElementById(`special-ayah-item-${a}`);
        if (el) el.style.backgroundColor = "transparent";
    }
    const bar = document.getElementById('ayah-actions-bar');
    const recordBtn = document.getElementById('record-action-btn');
    if (bar) bar.classList.add('hidden');
    if (recordBtn) recordBtn.classList.remove('hidden');
    stopMyClip();
    stopSheikh();
    if (playbackAudioElement) {
        try { playbackAudioElement.currentTime = ayahBarPausePos; } catch (e) {}
    }
    const atEnd = playbackAudioElement && isFinite(playbackAudioElement.duration) && ayahBarPausePos >= playbackAudioElement.duration - 0.05;
    if (ayahBarWasPlaying && playbackAudioElement && recordBtn && !atEnd) {
        playbackAudioElement.play().catch(() => {});
        isPlayingRecording = true;
        recordBtn.innerText = "⏸️ إيقاف العرض";
        recordBtn.classList.add('playing-active');
    } else if (ayahBarWasPlaying && recordBtn) {
        recordBtn.innerText = "▶️ عرض التسجيل";
    }
    ayahBarWasPlaying = false;
}

function revealSpecialFullAnswer() {
    // إيقاف التسجيل تلقائياً سواء كان جارياً أو متوقفاً مؤقتاً، وتحرير الميكروفون
    stopRecordingCompletely();

    const basmalaEl = document.getElementById('special-basmala-prompt');
    if (basmalaEl) basmalaEl.remove();

    const blankEl = document.getElementById('special-full-target-blank');
    if (blankEl) blankEl.style.visibility = 'visible';

    const showBtn = document.getElementById('show-btn');
    const ratingArea = document.getElementById('rating-area');
    const sheikhBtn = document.getElementById('sheikh-audio-btn');

    specialRevealed = true;
    if (showBtn) showBtn.classList.add('hidden');
    if (ratingArea) ratingArea.classList.add('hidden');
    if (sheikhBtn) sheikhBtn.classList.add('hidden');

    const recordBtn = document.getElementById('record-action-btn');
    if (recordBtn) {
        recordBtn.classList.remove('hidden');
        recordBtn.innerText = "▶️ عرض التسجيل";
        recordBtn.className = "btn-recording btn-record-big";
    }
}

function handleSpecialRecordingToggle() {
    const recordBtn = document.getElementById('record-action-btn');
    if (specialRevealed) {
        togglePlaybackRecordedAudio(recordBtn);
    } else {
        toggleRecordUserVoice(recordBtn);
    }
}

}


// ==========================================================
// 9. أدوات صوتية مشتركة
// ==========================================================

let recMediaStream = null;
let recToken = 0;

function updateRecIndicator(state) {
    const el = document.getElementById('rec-indicator');
    if (!el) return;
    const txt = document.getElementById('rec-indicator-text');
    const showB = document.getElementById('show-btn');
    // التسلسل: تسجيل جارٍ ← زر واحد (إيقاف)، متوقف ← إظهار الآيات + مواصلة
    if (showB && state === 'live') showB.classList.add('hidden');
    if (showB && state === 'paused') showB.classList.remove('hidden');
    el.classList.remove('on', 'live', 'paused');
    if (state === 'live') {
        el.classList.add('on', 'live');
        if (txt) txt.textContent = 'جارٍ التسجيل...';
    } else if (state === 'paused') {
        el.classList.add('on', 'paused');
        if (txt) txt.textContent = 'التسجيل متوقف';
    }
}

function releaseMicStream() {
    if (recMediaStream) {
        try { recMediaStream.getTracks().forEach(t => t.stop()); } catch (e) {}
        recMediaStream = null;
    }
}

function stopRecordingCompletely() {
    recToken++;
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        try { mediaRecorder.stop(); } catch (e) {}
    }
    isRecording = false;
    isRecordingPaused = false;
    releaseMicStream();
    updateRecIndicator(null);
}

function toggleRecordUserVoice(btnElement) {
    if (!isRecording && !isRecordingPaused) {
        const myToken = ++recToken;
        navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
            if (myToken !== recToken) {
                stream.getTracks().forEach(t => t.stop());
                return;
            }
            recMediaStream = stream;
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                recordedAudioBlob = new Blob(audioChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || 'audio/webm' });
                recordedAudioUrl = URL.createObjectURL(recordedAudioBlob);
                playbackAudioElement = new Audio(recordedAudioUrl);
                // تسجيلات المتصفح بلا مدة معلنة فلا يمكن القفز داخلها؛ نجبر المتصفح على حساب المدة
                const pa = playbackAudioElement;
                pa.addEventListener('loadedmetadata', () => {
                    if (pa.duration === Infinity) {
                        pa.currentTime = 1e101;
                        const fix = () => { pa.removeEventListener('timeupdate', fix); pa.currentTime = 0; };
                        pa.addEventListener('timeupdate', fix);
                    }
                });

                playbackAudioElement.onended = () => {
                    isPlayingRecording = false;
                    btnElement.innerText = "▶️ عرض التسجيل";
                    btnElement.classList.remove('playing-active');
                };
            };

            mediaRecorder.start();
            isRecording = true;
            isRecordingPaused = false;
            btnElement.innerText = "⏸️ إيقاف التسجيل";
            btnElement.classList.add('recording-active');
            updateRecIndicator('live');
        }).catch((err) => {
            alert("تعذر الوصول إلى الميكروفون.");
        });
    } else if (isRecording && !isRecordingPaused) {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.pause();
        }
        isRecording = false;
        isRecordingPaused = true;
        btnElement.innerText = "⏺️ مواصلة التسجيل";
        btnElement.classList.remove('recording-active');
        updateRecIndicator('paused');
    } else {
        if (mediaRecorder && mediaRecorder.state === "paused") {
            mediaRecorder.resume();
        }
        isRecording = true;
        isRecordingPaused = false;
        btnElement.innerText = "⏸️ إيقاف التسجيل";
        btnElement.classList.add('recording-active');
        updateRecIndicator('live');
    }
}

function togglePlaybackRecordedAudio(btnElement) {
    if (!recordedAudioBlob || !playbackAudioElement) {
        alert("لا يوجد تسجيل صوتي متاح للعرض بعد.");
        return;
    }

    if (!isPlayingRecording) {
        playbackAudioElement.play();
        isPlayingRecording = true;
        btnElement.innerText = "⏸️ إيقاف العرض";
        btnElement.classList.add('playing-active');
    } else {
        playbackAudioElement.pause();
        isPlayingRecording = false;
        btnElement.innerText = "▶️ مواصلة العرض";
        btnElement.classList.remove('playing-active');
    }
}

function resetRecordingStates() {
    stopSheikh();
    stopMyClip();
    stopRecordingCompletely();
    if (playbackAudioElement) {
        playbackAudioElement.pause();
        playbackAudioElement = null;
    }
    isRecording = false;
    isRecordingPaused = false;
    isPlayingRecording = false;
    recordedAudioBlob = null;
    recordedAudioUrl = null;
    audioChunks = [];
}
