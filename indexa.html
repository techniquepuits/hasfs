}

// عدّاد سرعة النزول: لا يظهر إلا أثناء «عرض التسجيل» (لا مع الشيخ ولا بلا صوت)
function rdSpeedVis() {
    const w = document.querySelector('.rd-speed-wrap');
    if (w) w.classList.toggle('hidden', !(rd && rd.kind !== 'aqal' && rdPlaying && rdAudioKind === 'rec'));
}
setInterval(rdSpeedVis, 200);

function rdRecElapsed() { return rdRecAcc + (rdRecState === 'recording' ? Date.now() - rdRecT0 : 0); }
function rdRecTickStart() {
    rdRecT0 = Date.now();
    if (rdTick) clearInterval(rdTick);
    rdTick = setInterval(() => {
        const t = document.getElementById('rd-timer');
        if (t) t.textContent = formatHMS(rdRecElapsed());
    }, 500);
}
function rdRecTickStop() { if (rdTick) { clearInterval(rdTick); rdTick = null; } }

// ---------- التحديد والتجزئة ----------

function rdSelectAyah(k) {
    if (!rd) return;
    if (rdGuardHidden()) return;
    if (rdRecState === 'paused') return;      // التسجيل موقوف بانتظار العرض أو المواصلة: لا نمحوه بضغطة على آية
    if (rdRecState === 'recorded') {   // بعد التسجيل: الضغط على آية يوقف العرض ويحدّدها (يظهر الشيخ والتعثر) ولا يمحو التسجيل
        rdHaltShow();
        const u = rd.sel !== null ? rdUnitOf(rd.sel) : null, v = rdUnitOf(k);
        rd.sel = (u && u.from === v.from && u.to === v.to) ? null : k;
        rdRefreshUI();
        return;
    }
    rdStopAudio();
    rdRecDiscard();            // التسجيل مرتبط بما كان محدَّداً
    if (rd.sel !== null) {
        const a = rdUnitOf(rd.sel), b = rdUnitOf(k);
        if (a.from === b.from && a.to === b.to) { rd.sel = null; rdRefreshUI(); return; }
    }
    rd.sel = k;
    rdRefreshUI();
}

// في الحفظ: الضغط على رقم آية يدمجها مع التي بعدها (يلغي القطع) وإعادة الضغط تعيد القطع
function rdCircleTap(k, ev) {
    if (ev && ev.stopPropagation) ev.stopPropagation();
    if (!rd) return;
    if (rd.kind !== 'prep') { rdSelectAyah(k); return; }
    if (rdGuardHidden()) return;
    if (k >= rd.items.length - 1) return;      // آخر آية في المقطع نهايته أصلاً
    rdStopAudio();
    rdRecDiscard();
    const i = rd.cuts.indexOf(k);
    if (i >= 0) rd.cuts.splice(i, 1);
    else { rd.cuts.push(k); rd.cuts.sort((a, b) => a - b); }
    rd.sel = null;
    if (prep) { prep.cuts = rd.cuts.map((x) => prep.start + x); savePrep(); }
    rdRefreshUI();
}

function rdStumbleToggle() {
    if (!rd || !stumbleAllowed() || rd.sel === null) return;
    const k = rd.sel, it = rd.items[k];
    if (!it) return;
    const key = ayahKey(it.s, it.a);
    if (!rd.stumbPrev) rd.stumbPrev = new Map();
    const store = loadAyahStore(userRiwaya);
    if (rd.stumbled.has(k)) {
        const prev = rd.stumbPrev.get(k);
        if (prev) store[key] = prev; else delete store[key];
        saveAyahStore(userRiwaya, store);
        rd.stumbled.delete(k);
    } else {
        rd.stumbPrev.set(k, store[key] ? Object.assign({}, store[key]) : null);
        addStumbledAyah(it.s, it.a);
        rd.stumbled.add(k);
    }
    rdRefreshUI();
}

// «الشيخ» في المراجعة بعد التسجيل: يقرأ الآية المحدَّدة (أو الجزء) مرة واحدة بالقارئ المختار، بمشغّل مستقل لا يمسّ التسجيل
// ---------- النزول التلقائي أثناء صوت الشيخ أو «العرض» ----------

// نزول الشيخ بسرعة شبه ثابتة: المسافة المتبقية إلى آخر المقطع ÷ الزمن المتبقي المقدَّر
// (الزمن يُقدَّر من عدد حروف الآيات المتبقية ومعدّل ثواني الحرف المقيس من الآيات التي قُرئت)؛
// السرعة تُنعَّم فلا اهتزاز، وتصحّح نفسها إن حرّك المستخدم الصفحة بإصبعه
let rdSy = null;
function rdSheikhPace(box, dt) {
    const L = rdSheikhLive;
    if (!L || !L.map || L.map.length !== L.n || !L.map.rounds) return null;
    if (!rdSy || rdSy.L !== L) rdSy = { L, lastI: -1, lastD: 0, sumD: 0, sumW: 0, v: -1 };
    const S = rdSy, g = L.get(), m = L.map[g.i];
    if (!m) return null;
    const boxTop = box.getBoundingClientRect().top, H = box.clientHeight, line = H * 0.3;
    const rect = (k) => { const el = document.getElementById('rd-a-' + k); const rs = el ? el.getClientRects() : []; return rs.length ? rs : null; };
    const rd0 = L.map.rounds[m.r];
    const eRects = rect(rd0.endK);
    if (!eRects) return null;
    const d = g.d > 0 && isFinite(g.d) ? g.d : 0;
    if (g.i !== S.lastI) {
        const prev = S.lastI >= 0 ? L.map[S.lastI] : null;
        if (prev && S.lastD > 0) { S.sumD += S.lastD / userRate; S.sumW += prev.w; }
        const newRound = !prev || prev.r !== m.r;
        const fr = rect(rd0.firstK);
        if (newRound && fr) {
            const top = fr[0].top - boxTop;
            if (prev || top < 0 || top > H) {   // بداية جولة جديدة (تكرار المقطع) أو آية البداية خارج الشاشة
                const y = Math.max(0, box.scrollTop + top - line);
                box.scrollTop = y; rdScrollPos = y;
            }
        }
        S.lastI = g.i; S.lastD = 0;
    }
    if (d) S.lastD = d;
    const c = S.sumW > 0 ? S.sumD / S.sumW : 0.1 / userRate;
    const wRem = rd0.endIdx >= g.i ? L.map[rd0.endIdx].cum - (m.cum - m.w) : m.w;
    const T = Math.max(1, c * wRem - (g.t || 0) / userRate);
    const endY = Math.min(box.scrollTop + (eRects[eRects.length - 1].bottom - boxTop) - line, Math.max(0, box.scrollHeight - H));
    const vt = Math.max(0, Math.min(400, (endY - rdScrollPos) / T));
    S.v = S.v < 0 ? vt : S.v + (vt - S.v) * Math.min(1, dt * 0.8);
    return rdScrollPos + S.v * dt;
}
let rdScrollOn = false, rdHoldUntil = 0, rdScrollPos = 0, rdScrollLast = 0;
function rdScrollFrame(ts) {
    if (!rdScrollOn) return;
    const box = document.getElementById('exercise-container');
    if (!box || !document.getElementById('rd-text') || !rdPlaying) { rdScrollOn = false; return; }
    const dt = rdScrollLast ? Math.min(0.1, (ts - rdScrollLast) / 1000) : 0;
    rdScrollLast = ts;
    if (Date.now() >= rdHoldUntil) {
        if (Math.abs(box.scrollTop - rdScrollPos) > 2) rdScrollPos = box.scrollTop;
        const tgt = rdAudioKind === 'sheikh' ? rdSheikhPace(box, dt) : null;
        if (tgt !== null) rdScrollPos = tgt;   // الشيخ: سرعة ثابتة تقريباً محسوبة من المقطع كله
        else rdScrollPos += scrollLevel * SCROLL_PX_PER_LEVEL * dt;
        box.scrollTop = rdScrollPos;
    } else rdScrollPos = box.scrollTop;
    requestAnimationFrame(rdScrollFrame);
}
function rdScrollSync() {
    const box = document.getElementById('exercise-container');
    const want = !!(rdPlaying && rd && rd.kind !== 'aqal' && box && document.getElementById('rd-text'));
    if (want && !rdScrollOn) {
        rdScrollOn = true; rdScrollLast = 0; rdScrollPos = box.scrollTop;
        if (!box._rdHold) {
            box._rdHold = true;
            ['touchmove', 'wheel'].forEach((ev) => box.addEventListener(ev, () => { rdHoldUntil = Date.now() + 3000; }, { passive: true }));
        }
        rdHoldUntil = Date.now() + 1500;
        requestAnimationFrame(rdScrollFrame);
    } else if (!want) rdScrollOn = false;
}

// ---------- صوت الشيخ ----------

function rdStopAudio(silent) {
    rdBackClear();
    rdAudioToken++;
    if (rdAudio) {
        rdAudio.onended = null;
        rdAudio.onerror = null;
        try { rdAudio.pause(); } catch (e) {}
        if (rdAudio._urls) rdAudio._urls.forEach((u) => { try { URL.revokeObjectURL(u); } catch (e) {} });
        rdAudio = null;
    }
    if (rdPlaying) releaseWakeLock();
    rdPlaying = false;
    rdAudioKind = null;
    if (!silent) rdRenderBars();
    rdScrollSync();
}

// روابط القراءة: بلا تحديد يُقرأ المقطع كله وحدةً وحدة (الوحدة = الجزء الملوَّن، أو الآية)، وكل وحدة بعدد التكرارات ثم التي بعدها؛
// ومع تحديد وحدة تُقرأ هي وحدها بعدد التكرارات. عدد التكرارات 1 = بلا تكرار
function rdSheikhUrls() {
    const n = rd.items.length;
    const sel = rd.sel !== null ? rdUnitOf(rd.sel) : null;
    const units = [];
    if (sel) units.push(sel);
    else for (let k = 0; k < n;) { const q = rdUnitOf(k); units.push(q); k = q.to + 1; }
    rdSheikhMapNext = null;
    const out = [], map = [], rounds = [];
    const W = (k) => { const it = rd.items[k]; return Math.max(1, String(rdAyahText(it.s, it.a) || '').length); };
    let cum = 0;
    const put = (g, k, r) => {
        out.push(...g);
        g.forEach((_, jj) => {
            const w = W(k) / g.length;
            cum += w;
            map.push({ k, n: g.length, j: jj, r, w, cum });
        });
        if (!rounds[r]) rounds[r] = { firstK: k };
        rounds[r].endK = k; rounds[r].endIdx = map.length - 1;
    };
    units.forEach((q) => {
        const ks = [], groups = [];
        let prevKey = '';
        for (let k = q.from; k <= q.to; k++) {
            const it = rd.items[k];
            const x = it ? ayahAudioUrls(userRiwaya, it.s, it.a) : null;
            if (!x) continue;
            const key = x.join('|');
            if (key === prevKey) continue;   // آيتا ورش داخل آية حفص واحدة: يُقرأ الملف مرة واحدة
            prevKey = key;
            groups.push(x); ks.push(k);
        }
        for (let r = 0; r < userRep; r++) groups.forEach((g, gi) => put(g, ks[gi], sel ? r : 0));
    });
    if (!out.length) return [];
    map.rounds = rounds;
    rdSheikhMapNext = map;
    return out;
}

// الضغط الأول يدخل وضعية الشيخ ويبدأ القراءة؛ وفي الوضعية يوقف القراءة أو يستأنفها
function rdToggleSheikh() {
    if (!rd || !rd.items.length) return;
    if (rdPlaying && rdAudioKind === 'sheikh') {
        try { if (rdSheikhLive) { const p = rdSheikhLive.get(); rdSheikhPos = { key: rdSheikhLive.key, i: p.i, t: p.t }; } } catch (e) {}
        rdStopAudio();
        return;
    }
    if (rd.kind !== 'aqal' && rdGuardHidden()) return;
    if (rdRecState === 'recording') { showToast("أوقف التسجيل أولاً (اضغط «إيقاف التسجيل»)."); return; }
    if (rdRecState !== 'idle') rdRecDiscard();   // التسجيل محفوظ في الهاتف ويمكن استرجاعه
    if (userRiwaya !== 1 && !(quranTexts[0] && quranTexts[1])) {   // ورش: نحتاج نصّي الروايتين لمطابقة الترقيم
        showToast('جارٍ تجهيز صوت ورش…');
        ensureTextsForRiwaya(1).then(() => ensureTextsForRiwaya(0)).then(() => rdToggleSheikh()).catch(() => showToast('تعذّر تجهيز صوت ورش (تحقق من الاتصال).'));
        return;
    }

    play: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M17 4.5v15L4 12z" fill="currentColor"/></svg>',
    pause: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>',
    back: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></svg>',
    restore: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3.6 12a8.4 8.4 0 1 0 2.5-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M3.5 3.8v4.9h4.9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7.6V12l3 1.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    cancel: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',
    home: '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3 2 12h3v8h5v-5h4v5h5v-8h3z" fill="currentColor"/></svg>'
};
// «الرئيسية»: خروج مباشر من القارئ إلى القائمة الرئيسية (بلا تأكيد مراجعة)
function goHomeNow() {
    if (rd) { try { rdStopAudio(true); rdRecDiscard(); } catch (e) {} }
    showMainButtons();
}
function rdStripTimerStop() { if (rdStripTimer) { clearInterval(rdStripTimer); rdStripTimer = null; } }
function rdStripTick() {
    if (!document.getElementById('rs-real')) { rdStripTimerStop(); return; }
    if (rdBackOrigin !== null && rdPlaying && rdAudioKind === 'rec' && rdCurT() >= rdBackOrigin - 0.05) rdBackClear();
    rdStripUpdate();
}
function rdStripRender(show) {
    const el = document.getElementById('rd-strip');
    if (!el) return;
    el.classList.toggle('hidden', !show);
    if (!show) { el.innerHTML = ''; rdStripTimerStop(); return; }
    const on = rdPlaying && rdAudioKind === 'rec';
    const pz = rdRecState === 'paused';
    el.innerHTML = `<button type="button" id="rd-play" class="rs-step rs-play${pz ? ' rs-wide' : ''}" onclick="rdShowBtn()" aria-label="${on ? 'إيقاف العرض' : (pz ? 'عرض التسجيل' : 'تشغيل العرض')}">${on ? RD_ICONS.pause : RD_ICONS.play}${pz ? '<span>العرض</span>' : ''}</button>`
        + `<div class="rs-bars" dir="ltr" title="شريط تقدم العرض"><div class="rs-lab-row"><span id="rd-rp-n" class="rs-lab"></span></div>`
        + `<div class="rs-box"><i id="rs-real"></i><i id="rs-up"></i></div></div>`
        + (pz
            ? `<button type="button" id="rd-resume" class="rs-step rs-resume" onclick="rdRecResume()" aria-label="مواصلة التسجيل"><span class="rec-dot"></span><span>مواصلة</span></button>`
            : `<button type="button" id="rd-back" class="rs-step" onclick="rdBackStep()" aria-label="رجوع ثانية">${RD_ICONS.back}</button>`)
        + `<button type="button" id="rd-cancel" class="rs-step rs-cancel${pz ? ' rs-wide' : ''}" onclick="rdCancelTake()" aria-label="إلغاء التسجيل" title="إلغاء التسجيل">${RD_ICONS.cancel}${pz ? '<span>إلغاء</span>' : ''}</button>`;
    rdStripUpdate();
    if (!rdStripTimer) rdStripTimer = setInterval(rdStripTick, 100);
}
function rdStripUpdate() {
    const up = document.getElementById('rs-up');
    if (!up) return;
    const g = rdStripGeom();
    // الشريط يتقدم من اليمين كاتجاه القراءة؛ والمقطع الملوّن هو ما رجعنا عنه
    document.getElementById('rs-real').style.width = g.cur + '%';
    const lab = document.getElementById('rd-rp-n');
    if (g.up) {
        up.style.display = 'block'; up.style.right = g.up.from + '%'; up.style.width = g.up.w + '%';
        lab.style.display = 'block'; lab.innerHTML = `<b>${rdBackN}</b> s`;
        lab.style.right = Math.max(6, Math.min(94, g.up.from + g.up.w / 2)) + '%';
    } else { up.style.display = 'none'; lab.style.display = 'none'; }
}

function rdPlayRec() {
    if (!rdSegs.length) return;
    rdStopAudio(true);
    const token = ++rdAudioToken;
    rdPlaying = true;
    rdAudioKind = 'rec';
    acquireWakeLock();
    const a = rdSegAudio(rdSegs);
    rdAudio = a;
    const fail = () => {
        if (token !== rdAudioToken) return;
        rdStopAudio();
        showToast("تعذر تشغيل التسجيل.");
    };
    a.onended = () => {   // ينتهي العرض: يبقى المشغّل عند النهاية (يمكن الرجوع منه أو إعادة التشغيل)
        if (token !== rdAudioToken) return;
        rdRecEnd = a.duration || a.currentTime || 0;
        releaseWakeLock();
        rdPlaying = false;
        rdBackClear();
        rdScrollSync();
        rdRenderBars();
    };
    a.onerror = fail;
    const p = a.play();
    if (p && p.catch) p.catch(fail);
    rdRenderBars();
    rdScrollSync();
}

// ---------- التفسير ----------

// زر التفسير: يفتح مباشرة تفسير الآية المحدَّدة؛ وبلا تحديد الآية الأولى؛ ومع جزء ملوَّن محدَّد أولُ آية فيه (ثم التنقل بالسابقة/اللاحقة)
function rdToggleTafsir() {
    if (!rd || !rd.items.length || rdGuardHidden()) return;
    if (rdRecState === 'recording') { showToast("أوقف التسجيل أولاً (اضغط «إيقاف التسجيل»)."); return; }
    rdOpenAyahTafsir(rd.sel !== null ? rdUnitOf(rd.sel).from : 0);
}

function rdOpenAyahTafsir(k) {
    rdStopAudio(true);
    const box = document.getElementById('exercise-container');
    rdScrollSaved = box ? box.scrollTop : 0;
    rd.tafIdx = k;
    showRdTafsir();
}

function rdTafStep(d) {
    const k = rd.tafIdx + d;
    if (k < 0 || k >= rd.items.length) return;
    rd.tafIdx = k;
    showRdTafsir();
}

function showRdTafsir() {
    const it = rd.items[rd.tafIdx];
    const k = rd.tafIdx;
    const html = `
        <div class="taf-tabs">
            <button type="button" id="taf-tab-muyassar" class="btn-secondary hf-btn tb-btn taf-tab" onclick="rdTafSwitch('muyassar')">${TAFSIR_EDITIONS.muyassar.name}</button>
            <button type="button" id="taf-tab-saadi" class="btn-secondary hf-btn tb-btn taf-tab" onclick="rdTafSwitch('saadi')">${TAFSIR_EDITIONS.saadi.name}</button>
        </div>
        <div class="exercise-box taf-box" id="exercise-container" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="surah-title" style="font-size: 16px;">سورة ${surahsNames[it.s]} — الآية ${it.a + 1}</div>
            <div id="tafsir-body" class="taf-body"></div>
        </div>
        <div class="rd-bar taf-nav3">
            <div class="rd-cell"><button type="button" id="taf-prev-btn" class="btn-secondary hf-btn tb-btn" onclick="rdTafStep(-1)" aria-label="الآية السابقة" title="الآية السابقة" ${k <= 0 ? 'disabled' : ''}>الآية السابقة</button></div>
            <div class="rd-cell"><button type="button" id="taf-next-btn" class="btn-secondary hf-btn tb-btn" onclick="rdTafStep(1)" aria-label="الآية اللاحقة" title="الآية اللاحقة" ${k >= rd.items.length - 1 ? 'disabled' : ''}>الآية اللاحقة</button></div>
            <div class="rd-cell"><button type="button" id="taf-back-btn" class="btn-secondary hf-btn tb-btn" onclick="rdBackFromTafsir()" aria-label="العودة" title="العودة">${tbIcon('arrL')}</button></div>
        </div>
    `;
    renderInContainer(html);
    applyTheme();
    rdTafRender();
}

function rdTafSwitch(edKey) {
    if (edKey === rd.tafEd) return;
    rd.tafEd = edKey;
    rdTafRender();
}

async function rdTafRender() {
    const myToken = ++rdTafToken;
    const edKey = rd.tafEd;
    ['muyassar', 'saadi'].forEach((k) => {
        const b = document.getElementById('taf-tab-' + k);
        if (b) b.classList.toggle('on', k === edKey);
    });
    const body = document.getElementById('tafsir-body');
    if (!body || !rd) return;
    const it = rd.items[rd.tafIdx];
    const n = it.a + 1;
    body.textContent = '';
    const sec = document.createElement('div');
    sec.className = 'taf-sec';
    const ay = document.createElement('div');
    ay.className = 'taf-ayah';
    ay.innerHTML = `${rdAyahText(it.s, it.a)} <span class="circle-num">${n}</span>`;
    sec.appendChild(ay);
    const tx = document.createElement('div');
    tx.className = 'taf-text';
    tx.textContent = 'جارٍ تحميل التفسير…';
    sec.appendChild(tx);
    body.appendChild(sec);

    const addMsg = (parent, msg) => {
        const d = document.createElement('div');
        d.textContent = msg;
        parent.appendChild(d);
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn-secondary hf-btn taf-retry';
        b.textContent = 'إعادة المحاولة';
        b.onclick = () => rdTafRender();
        parent.appendChild(b);
    };
    let targets = null;
    try { targets = await tafsirTargets(it.s, n); } catch (e) { targets = null; }
    if (myToken !== rdTafToken) return;
    tx.textContent = '';
    if (!targets) { addMsg(tx, 'تعذر ضبط ترقيم هذه الآية على رواية حفص. تحقق من الاتصال بالإنترنت.'); return; }
    const showNo = userRiwaya !== 1 && !(targets.length === 1 && targets[0] === n);
    const seen = new Set();
    for (const h of targets) {
        const blk = document.createElement('div');
        blk.className = 'taf-blk';
        if (showNo) {
            const t = document.createElement('div');
            t.className = 'taf-sec-title';
            t.textContent = 'تفسير الآية ' + h + ' (ترقيم حفص)';
            blk.appendChild(t);
        }
        tx.appendChild(blk);
        if (seen.has(h)) {
            const d = document.createElement('div');
            d.textContent = 'سبق عرض تفسير هذه الآية.';
            blk.appendChild(d);
            continue;
        }
        seen.add(h);
        try {
            const r = await loadTafsirText(edKey, it.s + 1, h);
            if (myToken !== rdTafToken) return;
            if (!r.text) {
                const d = document.createElement('div');
                d.textContent = 'لا يوجد تفسير لهذه الآية في هذا الكتاب.';
                blk.appendChild(d);
            } else {
                if (r.from !== h) {
                    const note = document.createElement('div');
                    note.className = 'taf-note';
                    note.textContent = 'هذا التفسير مذكور عند الآية ' + r.from + ' لأنه يشمل عدة آيات.';
                    blk.appendChild(note);
                }
                const d = document.createElement('div');
                d.textContent = r.text;
                blk.appendChild(d);
            }
        } catch (e) {
            if (myToken !== rdTafToken) return;
            seen.delete(h);
            addMsg(blk, 'تعذر تحميل التفسير. تحقق من الاتصال بالإنترنت.');
        }
    }
}

// الرجوع من صفحة التفسير: نعود إلى الآيات المتلوّنة وزر التفسير ما زال مفعَّلاً
function rdBackFromTafsir() {
    rdTafToken++;
    rd.tafIdx = null;
    rdRenderPage(true);
}

// ---------- إنهاء الجلسة (يغني عن زر الرجوع) ----------

function rdEnd() {
    if (!rd) { showMainButtons(); return; }
    if (rd.sig && !document.getElementById('rc-box')) { rdConfOpen(); return; }
    rdEndNow();
}

// «تأكيد المراجعة»: الزائر قد يكتفي بالاطلاع، فلا يُحدَّث العدّاد إلا بتأكيده
let rcVal = 0;
function rdConfOpen() {
    closeRdPop();
    rcVal = schedGet(rd.sig).n;
    const d = document.createElement('div');
    d.id = 'rd-pop';
    d.className = 'modal-overlay';      // بلا إغلاق بالنقر خارجها: لا بد من اختيار
    d.innerHTML = `<div class="modal-box sd-box" id="rc-box">
        <button type="button" id="rc-x" class="rc-x" onclick="closeRdPop()" aria-label="إغلاق والرجوع للمراجعة">&times;</button>
        <div class="modal-title">تأكيد المراجعة</div>
        <div id="rc-body"><div class="rc-two"><button type="button" id="rc-done" class="btn-main" onclick="rcDone()">تمت المراجعة</button><button type="button" id="rc-skip" class="btn-secondary" onclick="rdEndNow()">تخطي</button></div></div>
    </div>`;
    document.body.appendChild(d);
}
// بعد «تمت المراجعة»: مدة المراجعة بالأيام ثم التأكيد
function rcDone() {
    const b = document.getElementById('rc-body');
    if (!b) return;
    b.innerHTML = `<div class="rd-set-lbl">مدة المراجعة بالأيام</div>
        <div class="sd-step"><span class="stepper"><button type="button" id="rc-minus" onclick="rcStep(-1)" aria-label="إنقاص">−</button><span class="st-val"><span>يوم</span><span id="rc-n">${rcVal}</span></span><button type="button" id="rc-plus" onclick="rcStep(1)" aria-label="زيادة">+</button></span></div>
        <button type="button" id="rc-ok" class="btn-main sd-ok" onclick="rcConfirm()">تأكيد</button>`;
}
function rcStep(d) {
    rcVal = Math.max(0, Math.min(365, rcVal + d));
    const el = document.getElementById('rc-n');
    if (el) el.textContent = rcVal;
}
function rcConfirm() {
    if (rd && rd.sig) {
        const m = lsGet(LS_KEYS.sched, {}) || {}, t = schedToday();
        m[rd.sig] = { n: rcVal, d: t + rcVal, l: t };
        lsSet(LS_KEYS.sched, m);
    }
    rdEndNow();
}

function rdEndNow() {
    if (!rd) { showMainButtons(); return; }
    rdStopAudio(true);
    rdRecDiscard();
    const k = rd.kind;
    if (k === 'prep') { rdTeardown(); rd = null; showProgList(); return; }
    if (k === 'rasikh') { leaveNewReview(); return; }
    leaveReviewScreen();
}

function leaveReviewScreen() {
    const fromGrid = reviewScope === 'single';
    reviewOnlyKeys = null;
    reviewScope = 'all';
    rdTeardown();
    rd = null;
    if (fromGrid) { showReviewSelect(); return; }
    showReviewSelect();
}

// ---------- عقال الآيات: آية واحدة وتقييمها ----------

function rdRate(ratingType) {
    if (!rd || rd.kind !== 'aqal' || !currentReviewItem) return;
    onAyahRated(currentReviewItem, ratingType);
    reviewedThisSession++;
    if (reviewScope === 'single') { leaveReviewScreen(); return; }
    rdLoadAqal();
}

// «حذف الآية من قائمة التعثر»
function rdDelStumble() {
    closeRdPop();
    if (!rd || rd.kind !== 'aqal' || !currentReviewItem) return;
    const store = loadAyahStore(currentReviewItem.riwaya);
    delete store[ayahKey(currentReviewItem.surah, currentReviewItem.ayah)];
    saveAyahStore(currentReviewItem.riwaya, store);
    showToast("حُذفت الآية من قائمة التعثر.");
    if (reviewScope === 'single') { leaveReviewScreen(); return; }
    lastReviewedKey = null;
    rdLoadAqal();
}

// مطلع الآية (الأزرق): الآية السابقة، أو عند أول آية البسملة (ورش) أو «بداية السورة»
function rdLeadForAqal(s, a) {
    if (a > 0) return { type: 'ayah', s, a: a - 1 };
    if (userRiwaya === 0 && s !== 8) return { type: 'basmala', s };
    return { type: 'text', s, text: '— بداية السورة —' };
}

function rdLoadAqal() {
    let item;
    if (reviewScope === 'single') {      // آية اختارها المستعمل بنفسه من «قائمة آيات التعثر»
        const p = String(reviewSingle).split(':'), s = Number(p[0]), a = Number(p[1]);
        item = loadAyahStore(userRiwaya)[reviewSingle] ? { riwaya: userRiwaya, surah: s, ayah: a, key: reviewSingle } : null;
        if (!item) { reviewScope = 'all'; rd = null; showReviewSelect(); return; }
    } else item = pickNextAyahForReview(lastReviewedKey);
    currentReviewItem = item;
    if (!item) {
        const hasAny = Object.keys(loadAyahStore(userRiwaya)).length > 0;
        let msg;
        if (reviewScope === 'surah') msg = `أنهيتَ مراجعة آيات التعثر في سورة ${surahsNames[reviewSurahIdx]}.\nيمكنك العودة إلى القائمة الرئيسية.`;
        else if (reviewOnlyKeys) msg = "أنهيتَ مراجعة الآيات التي تعثرت فيها في هذه الجلسة.\nيمكنك العودة إلى القائمة الرئيسية.";
        else msg = hasAny
            ? "لا توجد آيات مستحقة للمراجعة الآن.\nارجع لاحقاً؛ تظهر الآية هنا عندما يحين وقت مراجعتها."
            : "لا توجد آيات في عقال الآيات بعد.\nابدأ بمراجعة المحفوظ، وعندما تتعثر في آية اضغط عليها ثم «تعثر» لتُضاف إلى هنا.";
        rdOpen({ kind: 'aqal', items: [], title: 'سورة: ---', msg });
        updateDueCounts();
        return;
    }
    const total = getAyatCount(item.surah, item.riwaya);
    rdOpen({
        kind: 'aqal', items: [{ s: item.surah, a: item.ayah }], near: rdLeadForAqal(item.surah, item.ayah),
        lead: item.ayah > 0 ? rdLeadForAqal(item.surah, item.ayah - 1) : null,
        title: `سورة: ${surahsNames[item.surah]}`, tail: rdCtxTail({ s: item.surah, a: item.ayah })
    });
    updateDueCounts();
}

function showReviewScreen(onlyKeys, scope) {
    reviewOnlyKeys = (Array.isArray(onlyKeys) && onlyKeys.length) ? new Set(onlyKeys) : null;
    reviewScope = scope || (reviewOnlyKeys ? 'session' : 'all');
    reviewedThisSession = 0;
    lastReviewedKey = null;
    rdLoadAqal();
}

// ---------- مراجعة وحدة (الجديد والراسخ) ----------

// الآية اللاحقة للمقطع (تظهر بزر «الآية التالية» بالأزرق)؛ ولا شيء إن كان المقطع آخر السورة
function rdCtxTail(it) {
    if (it.a + 1 >= (getAyatCount(it.s) || 0)) return '';
    const t = getAyahText(userRiwaya, it.s, it.a + 1);
    return t ? `${t} <span class="circle-num">${it.a + 2}</span>` : '';
}
function rdLeadFor(s, a) {
    if (a > 0) return { type: 'ayah', s, a: a - 1 };
    const firstText = getAyahText(userRiwaya, s, 0) || "";
    const norm = firstText.replace(/[ً-ٰٟۖ-ۭـ﻿]/g, "").replace(/[ٱآأإ]/g, "ا").trim();
    // في حفص البسملة جزء من نص الآية الأولى (وسورة التوبة بلا بسملة): لا نكتبها مطلعاً؛ وفي ورش تُكتب بالأزرق
    if (!norm.startsWith("بسم الله الرحمن الرحيم") && s !== 8) return { type: 'basmala', s };
    return null;
}

// الآية الأولى من الوحدة تبقى ظاهرة عند التسجيل (وتُكتب كأخواتها)، ثم تُتلى بقية الآيات
function startUnitReview(origin, segs) {
    const all = [];
    segs.forEach((g) => { for (let n = g.start; n <= g.end; n++) all.push({ s: g.surah, a: n - 1 }); });
    if (!all.length) return;
    newReviewMode = true;
    reviewOrigin = origin;
    rdOpen({
        kind: origin, items: all,
        lead: rdLeadFor(all[0].s, all[0].a), sig: passSig(3, segs),
        tail: rdCtxTail(all[all.length - 1]),
        title: unitLabelOf(segs)
    });
}

// ---------- الحفظ مع الشيخ ----------

function showPrepPage() {
    if (!prep) { showPrepSelect(); return; }
    const items = [];
    for (let n = prep.start; n <= prep.end; n++) items.push({ s: prep.surah, a: n - 1 });
    newReviewMode = false;
    reviewOrigin = 'prep';
    rdOpen({
        kind: 'prep', items, cuts: prep.cuts.map((n) => n - prep.start),
        lead: rdLeadFor(items[0].s, items[0].a), tail: rdCtxTail(items[items.length - 1]),
        title: `سورة ${surahsNames[prep.surah]} — الآيات ${prep.start} إلى ${prep.end}`
    });
}

function sessionStumbleKeys() {
    if (!rd) return [];
    return [...rd.stumbled].filter((k) => rd.items[k]).map((k) => ayahKey(rd.items[k].s, rd.items[k].a));
}

// الخروج من الجديد والراسخ إلى قائمتها (وفي الراسخ يُسأل عن مراجعة آيات التعثر)
function leaveNewReview() {
    const keys = reviewOrigin === 'rasikh' ? sessionStumbleKeys() : [];
    rdTeardown();
    rd = null;
    showRasikhList();
    if (keys.length) showStumbleReviewPrompt(keys);
}

async function initApp() {
    loadSettings();
    await migrateFromOldIndexedDBOnce();
    applyTheme();
    showWelcomeScreen();
    // تحميل مسبق صامت للنصوص حتى يكون زر "ابدأ الان" فورياً
    ensureTextsForRiwaya(userRiwaya).catch(() => {});
}

initApp();
    </script>
