<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق ابن باديس - تثبيت حفظ القرآن الكريم</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2d6a4f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">
    <style>
/* ==========================================================
   تطبيق ابن باديس - الأنماط (style.css سابقاً)
   ========================================================== */
body {
    font-family: 'Amiri', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f0f4f1 0%, #d8e4dc 100%);
    color: #2c3e50;
    text-align: center;
    margin: 0;
    padding: 10px 0;
    min-height: 95vh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    transition: background 0.3s ease, color 0.3s ease;
}

/* الوضع الليلي الكامل المحدث */
body.dark-mode {
    background: linear-gradient(135deg, #111827 0%, #0f172a 100%) !important;
    color: #f1f5f9 !important;
}

body.dark-mode .welcome-container,
body.dark-mode .exercise-box {
    background: #1e293b !important;
    border-color: #334155 !important;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4) !important;
    color: #f1f5f9 !important;
}

body.dark-mode .app-title,
body.dark-mode .surah-title,
body.dark-mode .settings-title {
    color: #34d399 !important;
}

body.dark-mode .app-slogan {
    color: #94a3b8 !important;
}

body.dark-mode .btn-secondary,
body.dark-mode .setting-row-box,
body.dark-mode .surah-list-container {
    background: #0f172a !important;
    border-color: #334155 !important;
    color: #f1f5f9 !important;
}

body.dark-mode .setting-row-label,
body.dark-mode .radio-label {
    color: #e2e8f0 !important;
}

body.dark-mode .header-box {
    border-bottom-color: #334155 !important;
}

body.dark-mode .btn-home {
    background: #0f172a !important;
    border-color: #475569 !important;
    color: #34d399 !important;
}

body.dark-mode .btn-home:hover {
    background: #34d399 !important;
    color: #0f172a !important;
    border-color: #34d399 !important;
}

body.dark-mode .circle-num {
    border-color: #34d399 !important;
    color: #34d399 !important;
}

body.dark-mode .ayah-blue {
    color: #60a5fa !important;
}

#main-container {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
}

.welcome-container {
    position: relative;
    max-width: 850px;
    width: 92%;
    height: 90vh;
    max-height: 750px;
    margin: 0 auto;
    background: #ffffff;
    padding: 25px 20px;
    border-radius: 24px;
    box-shadow: 0 12px 35px rgba(27, 77, 62, 0.08);
    border: 1px solid rgba(45, 106, 79, 0.15);
    box-sizing: border-box;
    text-align: right;
    display: flex;
    flex-direction: column;
}

.settings-icon {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    color: #1b4d3e;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 10;
}
.settings-icon:hover {
    background: #2d6a4f;
    color: white;
    border-color: #2d6a4f;
}

.help-icon {
    position: absolute;
    top: 20px;
    right: 20px;
    background: #f1f5f9;
    border: 1.5px solid #cbd5e1;
    color: #1b4d3e;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
}
.help-icon:hover {
    background: #2d6a4f;
    color: white;
    border-color: #2d6a4f;
}

.home-content {
    text-align: center;
}

.app-icon {
    width: 75px;
    height: 75px;
    background: linear-gradient(135deg, #2d6a4f 0%, #1b4d3e 100%);
    color: white;
    font-size: 36px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin: 0 auto 20px auto;
    box-shadow: 0 6px 15px rgba(45, 106, 79, 0.25);
}

.app-title {
    font-size: 40px;
    font-weight: bold;
    color: #1b4d3e;
    margin-bottom: 8px;
}

.app-slogan {
    font-size: 16px;
    color: #52796f;
    margin-bottom: 35px;
    font-weight: 700;
}

.btn-main {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 15px auto;
    background: linear-gradient(135deg, #2d6a4f 0%, #1b4d3e 100%);
    color: white;
    border: none;
    padding: 15px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    box-sizing: border-box;
    box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
    text-align: center;
}
.btn-main:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(45, 106, 79, 0.4);
}

.btn-secondary {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    color: #334155;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    padding: 13px 20px;
    border-radius: 12px;
    transition: all 0.2s ease;
    box-sizing: border-box;
    text-align: center;
}
.btn-secondary:hover {
    background: #f1f5f9;
    border-color: #94a3b8;
}

/* القائمة الرئيسية: الزران بحجمهما الطبيعي، متمركزان عمودياً مع مسافة بينهما */
.home-content.menu-screen { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.menu-head { flex-shrink: 0; }
.menu-buttons {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    gap: clamp(6px, 1.7vh, 18px);
    padding-top: clamp(6px, 1.7vh, 18px);     /* = gap: نفس المسافة بين الشعار والزر الأول وبين الأزرار */
    overflow-y: auto;
}
.menu-item { width: 100%; max-width: 420px; text-align: center; }
.menu-item .btn-main, .menu-item .btn-secondary { margin: 0; max-width: 100%; padding-top: 11px; padding-bottom: 11px; font-size: 16px; }
.menu-row3 { display: flex; gap: 8px; }
.menu-item.menu-row3 #menu-prog-btn { flex: 1 1 0; }
.menu-item.menu-row3 #menu-rev-btn { flex: 3 1 0; }
.menu-item.menu-row3 .btn-main {  min-width: 0; width: auto; padding-left: 4px; padding-right: 4px; }

/* النافذة المنبثقة لاختيار آية البداية */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
    z-index: 100;
    animation: fadeIn 0.15s ease-in-out;
}
.modal-box {
    position: relative;
    width: 100%;
    max-width: 380px;
    max-height: 94vh;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid rgba(45, 106, 79, 0.25);
    border-radius: 18px;
    padding: 16px 14px 14px 14px;
    box-sizing: border-box;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    text-align: center;
}
.modal-title { font-size: 19px; font-weight: bold; color: #1b4d3e; margin-bottom: 10px; }
.modal-actions { display: flex; gap: 8px; margin-top: 12px; }
.modal-actions button {
    flex: 1;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    padding: 10px 6px;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
}
.modal-actions .btn-start-review { background: linear-gradient(135deg, #2d6a4f 0%, #1b4d3e 100%); color: #ffffff; border: none; }
.modal-actions .btn-cancel { background: #f1f5f9; color: #334155; border: 1.5px solid #cbd5e1; }
.modal-actions.stack { flex-direction: column; gap: 10px; margin-top: 16px; }
.modal-actions.stack button { flex: none; width: 100%; padding: 14px 10px; font-size: 17px; border-radius: 12px; }
.resume-info { text-align: center; background: #f0f7f3; border: 1.5px solid #cfe3d8; border-radius: 12px; padding: 12px 10px; margin-top: 6px; }
.resume-surah { font-size: 22px; font-weight: bold; color: #1b4d3e; }
.resume-ayah { font-size: 16px; color: #475569; margin-top: 4px; }
body.dark-mode .resume-info { background: #0f172a !important; border-color: #334155 !important; }
body.dark-mode .resume-surah { color: #34d399 !important; }
body.dark-mode .resume-ayah{ color: #cbd5e1 !important; }
body.dark-mode .modal-box { background: #1e293b !important; border-color: #334155 !important; }
body.dark-mode .modal-title { color: #34d399 !important; }
body.dark-mode .modal-actions .btn-cancel { background: #0f172a !important; color: #e2e8f0 !important; border-color: #475569 !important; }

/* خانة رقم الآية ولوحة الأرقام (بدل لوحة مفاتيح الهاتف) */
.numpad-display-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 0 0 10px 0;
}
.numpad-label { font-size: 14px; font-weight: bold; color: #1b4d3e; }
.numpad-display {
    width: 76px;
    height: 34px;
    padding: 0 4px;
    text-align: center;
    font-family: inherit;
    font-size: 19px;
    font-weight: bold;
    line-height: 1;
    color: #1b4d3e;
    background: #ffffff;
    border: 2px solid #2d6a4f;
    border-radius: 8px;
    box-sizing: border-box;
    caret-color: transparent;
    outline: none;
}
.numpad-display::placeholder { color: #94a3b8; opacity: 1; }
.numpad-max { font-size: 12px; color: #64748b; white-space: nowrap; }
.numpad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    width: 100%;
    margin: 0 auto;
    direction: rtl;
}
.numpad button {
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    padding: 8px 0;
    color: #1b4d3e;
    background: #f1f5f9;
    border: 1.5px solid #cbd5e1;
    border-radius: 9px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.1s ease;
}
.numpad button:active { background: #2d6a4f; color: #ffffff; border-color: #2d6a4f; }
.numpad .np-del, .numpad .np-clear { font-size: 14px; color: #b91c1c; background: #fef2f2; border-color: #fecaca; }
.numpad .np-del:active, .numpad .np-clear:active { background: #dc2626; color: #ffffff; border-color: #dc2626; }
body.dark-mode .numpad-display { background: #0f172a !important; color: #34d399 !important; border-color: #34d399 !important; }
body.dark-mode .numpad-label { color: #34d399 !important; }
body.dark-mode .numpad button { background: #0f172a !important; color: #e2e8f0 !important; border-color: #475569 !important; }
body.dark-mode .numpad .np-del, body.dark-mode .numpad .np-clear { color: #fca5a5 !important; }

.settings-header {
    text-align: center;
    border-bottom: 2px solid #e2e8f0;
    padding-bottom: 12px;
    margin-bottom: 20px;
}
.settings-title {
    font-size: 22px;
    font-weight: bold;
    color: #1b4d3e;
    margin: 0;
}

.setting-row-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f1f5f9;
    padding: 12px 15px;
    border-radius: 12px;
    border: 1.5px solid #cbd5e1;
    margin-bottom: 20px;
}
.sheikh-select { width: 100%; margin-top: 4px; font-family: inherit; font-size: 16px; padding: 10px; border-radius: 10px; border: 1.5px solid #cbd5e1; background: #fff; color: #1b4d3e; }
body.dark-mode .sheikh-select { background: #0f172a !important; color: #e2e8f0 !important; border-color: #475569 !important; }
.setting-row-label {
    font-size: 15px;
    font-weight: bold;
    color: #1e293b;
}

.radio-options {
    display: flex;
    gap: 15px;
}
.radio-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
}
.radio-label input[type="radio"] {
    accent-color: #2d6a4f;
    width: 16px;
    height: 16px;
    cursor: pointer;
}

.surah-list-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f8fafc;
    padding: 12px;
    border-radius: 12px;
    border: 1.5px solid #e2e8f0;
    max-height: 250px;
    overflow-y: auto;
    text-align: right;
}

.header-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    border-bottom: 1px solid #e2e8f0;
    padding-bottom: 10px;
    flex-shrink: 0;
}
.surah-title {
    font-size: 20px;
    font-weight: bold;
    color: #1b4d3e;
}

.exercise-box {
    flex: 1;
    min-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    position: relative;
    padding: 15px;
    box-sizing: border-box;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 15px;
}

.continuous-quran-text {
    text-align: right;
    font-size: 23px;
    line-height: 3.5;
    width: 100%;
}

.ayah-blue { color: #2563eb !important; font-weight: bold; }

.circle-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border: 1.5px solid #2d6a4f;
    border-radius: 50%;
    font-size: 13px;
    color: #2d6a4f;
    margin: 0 1px;
    vertical-align: middle;
}

.rating-buttons {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    margin-top: 0;
    width: 100%;
}
.btn-rate {
    flex: 1;
    padding: 12px 5px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
    font-weight: bold;
    text-align: center;
}
.btn-forgot { background-color: #dc2626; }
.btn-hard { background-color: #d97706; }
.btn-good { background-color: #2563eb; }
.btn-easy { background-color: #16a34a; }

.hidden { display: none !important; }

@media screen and (max-width: 768px) {
    .welcome-container { padding: 15px 10px; width: 96%; height: calc(100dvh - 22px); }
    .app-title { font-size: 30px; }
    .exercise-box { font-size: 21px !important; line-height: 2.8; padding: 12px 8px !important; }
    .circle-num { width: 22px; height: 22px; font-size: 11px; }
    .btn-rate { padding: 10px 2px; font-size: 13px; }
    .surah-title { font-size: 16px; }
}

.btn-home {
    background-color: #64748b;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
    transition: all 0.2s ease;
}
.btn-home:hover {
    background-color: #475569;
}

.ayah-stumbled { border-bottom: 3px solid #d97706; }
.ayah-stumbled .at { color: #dc2626 !important; }
body.dark-mode .ayah-stumbled .at { color: #f87171 !important; }
.rd-act { display: flex; gap: 8px; width: 100%; }
.rd-act .hf-btn { min-height: 42px; padding: 8px 4px !important; }
.rd-act .rd-stm { background: #fee2e2 !important; border-color: #dc2626 !important; color: #b91c1c !important; }
body.dark-mode .rd-act .rd-stm { background: #450a0a !important; border-color: #f87171 !important; color: #fecaca !important; }
.stats-line { display: inline-flex; align-items: center; margin-inline-start: 4px; }
.due-num { font-weight: bold; font-size: 17px; }
.due-total { color: #1b4d3e; font-size: 20px; }
body.dark-mode .due-total { color: #6ee7b7; }
.stats-line { gap: 5px; }
.header-box .btn-home { padding: 8px 11px; }
.header-box .btn-end-session { padding: 8px 9px; font-size: 12.5px; }
.header-box .btn-theme { white-space: nowrap; }
.header-box .btn-theme.icon-only { padding: 8px 11px; font-size: 14px; }
.rv-row { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #f1f5f9; border: 1.5px solid #cbd5e1; padding: 13px 15px; margin-bottom: 6px; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: bold; color: #1b4d3e; cursor: pointer; flex: none; }
.rv-all { width: 100%; padding: 15px 12px; margin-bottom: 6px; font-family: inherit; border-radius: 12px; flex: none; background: #f1f5f9; border: 1.5px solid #cbd5e1; color: #1b4d3e; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.rv-all .rb-main { font-size: 16px; font-weight: bold; }
.rv-nums { display: inline-flex; gap: 12px; align-items: center; }
.rv-nums-big .due-num { font-size: 20px; }
.rv-nums .due-num.zero { opacity: 0.3; }
.rv-empty { text-align: center; color: #64748b; font-size: 14px; padding: 10px 6px; }
body.dark-mode .rv-row, body.dark-mode .rv-all { background: #0f172a !important; border-color: #334155 !important; color: #f1f5f9 !important; }
body.dark-mode .rv-empty { color: #cbd5e1; }
.resume-btn { width: 100%; padding: 15px 12px; margin-bottom: 6px; font-family: inherit; border-radius: 12px; flex: none; background: #f1f5f9; border: 1.5px solid #cbd5e1; color: #1b4d3e; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.resume-btn .rb-main { font-size: 16px; font-weight: bold; }
.resume-btn.ps-btn { padding: 9px 12px; margin-bottom: 5px; flex-direction: row; justify-content: space-between; align-items: center; gap: 8px; }
.cm-name { cursor: pointer; display: flex; align-items: center; justify-content: space-between; border-radius: 8px; background: #f1f5f9; }
.cm-surah { flex: none; }
.cm-name { flex: none; }
.cm-name::after { content: '▾'; font-size: 12px; }
.cm-surah.open .cm-name::after { content: '▴'; }
.cm-surah:not(.open) .cm-ayahs { display: none; }
body.dark-mode .cm-name { background: #1e293b; }
.rd-bot#pg-bottom { display: flex; }
#pg-bottom .rd-cell { flex: 1 1 0; }
#pg-bottom .rd-cell.rd-sq { flex: 0 0 54px; }
#pg-bottom .rd-cell.rd-mk { flex: 1 1 0; }
#pg-bottom .hf-btn.cm-mkb { padding: 0 2px; font-size: clamp(12px, 3.4vw, 14px); font-weight: bold; }
#pg-bottom .hf-btn.cm-mkb.on { background: #283593 !important; color: #fff !important; }
body.dark-mode #pg-bottom .hf-btn.cm-mkb.on { background: #1a237e !important; }
#ps-torev svg { width: 24px; height: 24px; flex: none; }
#pg-bottom { align-items: center; }
#pg-bottom .rd-cell .hf-btn { height: 42px; min-height: 42px; padding-top: 0; padding-bottom: 0; box-sizing: border-box; }
#pg-bottom .rd-cell.rd-sq .hf-btn { height: 42px; min-height: 42px; padding: 0; }
#taf-back-btn { height: 42px; min-height: 42px; }
.taf-nav3 .hf-btn, #rd-row1 .hf-btn { box-sizing: border-box; }
#pg-bottom .rd-cell.hidden { display: none; }
.rd-bot .hf-btn.rd-bkico:not(.rd-recdark) { color: #ea580c !important; }
body.dark-mode .rd-bot .hf-btn.rd-bkico:not(.rd-recdark) { color: #fb923c !important; }
.pg-head-title { display: flex; align-items: center; justify-content: center; gap: 8px; }
.ps-due-btn { border: 0; background: transparent; padding: 0; cursor: pointer; display: inline-flex; font-family: inherit; touch-action: manipulation; }
.rd-page > .exercise-box.ps-box { margin-left: 6px !important; margin-right: 6px !important; padding: 4px !important; }
#ps-list { padding: 8px 6px; }
#ps-due .ps-due-n { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 6px; box-sizing: border-box; border-radius: 14px; background: #dc2626; color: #fff; font-size: 15px; font-weight: bold; line-height: 1; font-variant-numeric: tabular-nums; opacity: 0.6; }
#ps-due .ps-due-n.on { opacity: 1; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #dc2626; }
#ps-due .ps-due-n.z { background: #94a3b8; opacity: 1; box-shadow: none; }
.ps-row { position: relative; margin-bottom: 5px; }

        <!-- يتم تعبئتها ديناميكياً بواسطة السكربت -->

    <script>
// ==========================================================
// تطبيق ابن باديس - ملف واحد موحد
// التخزين: localStorage (تقدم المستخدم + الإعدادات + نسخة من نصوص المصحف)
// البيانات الثابتة: تُجلب من GitHub عبر روابطها ولا تُضمَّن في هذا الملف
// ==========================================================

// ==========================================================
// 0. الإعدادات والروابط
// ==========================================================

// مجلد البيانات الثابتة على GitHub (غيّره هنا فقط إذا انتقل المستودع)
const GITHUB_BASE = "https://raw.githubusercontent.com/techniquepuits/quran/main/IbnBadisQuranDB/";

// الملفات الثابتة المرتبطة بروابطها. لإضافة ملف ثابت جديد (مثل ayah_difficulties.json)
// أضف سطراً هنا ثم استدعِ fetchStaticFile("اسم الملف").
const STATIC_FILES = {
    "ayah_texts.json": GITHUB_BASE + "ayah_texts.json"
};

// التفسير آية بآية (مستودع spa5k/tafsir_api عبر CDN، وإن تعذّر فمن GitHub مباشرة)
const TAFSIR_BASES = [
    "https://cdn.jsdelivr.net/gh/spa5k/tafsir_api@main/tafsir/",
    "https://raw.githubusercontent.com/spa5k/tafsir_api/main/tafsir/"
];
const TAFSIR_EDITIONS = {
    muyassar: { slug: "ar-tafsir-muyassar", name: "التفسير الميسّر" },
    saadi: { slug: "ar-tafseer-al-saddi", name: "تفسير السعدي" }
};
const TAFSIR_CACHE_PREFIX = "ibnbadis.taf.";
const TAFSIR_IDX_KEY = "ibnbadis.taf.idx";

// مفاتيح localStorage
const LS_KEYS = {
    settings: "ibnbadis.settings",
    aqalmode: "ibnbadis.aqalmode.v1",   // طريقة مراجعة عقال الآيات: all | due | random
    migrated: "ibnbadis.migrated",
    ayahs: (riwaya) => "ibnbadis.ayahs.v1." + riwaya,   // قائمة عقال الآيات: {"سورة:آية": {d: صعوبة, t: آخر مراجعة}}
    midrev: "ibnbadis.midrev.v1",     // «المراجعة المتوسطة»: [{riwaya, segs:[{surah,start,end}]}]
    active: (riwaya) => "ibnbadis.active.v1." + riwaya,   // الآيات المفعَّلة في المراجعة اليومية: {"سورة": [[بداية,نهاية],...]}
    newrev: "ibnbadis.newrev.v1",     // قديم («الجديد» أُلغي): يُنقل إلى prog عند التحميل
    cuts: (riwaya) => "ibnbadis.cuts.v1." + riwaya,   // فواصل الأجزاء داخل المقطع الواحد: {"سورة": [آخر آية في الجزء,...]}
    prog: "ibnbadis.prog.v1",         // مقاطع «قيد الحفظ» (يحفظها الآن): [{riwaya, surah, start, end}]
    sched: "ibnbadis.sched.v1",       // جدولة المراجعة اليدوية لكل مقطع: {"رواية:درجة:...": {n: المدة التي اختارها بالأيام, d: رقم يوم الاستحقاق, l: رقم يوم آخر تأكيد}}
    lastpass: "ibnbadis.lastpass.v1", // آخر مقطع فُتح في كل قائمة: {"رواية:درجة": {s, a}} (أول آية فيه)
    prep: "ibnbadis.prep.v2",        // المقطع الأخير في «الحفظ مع الشيخ»: {riwaya, surah, start, end, cuts[]}
    prepOld: "ibnbadis.prep.v1",     // إصدار سابق: نأخذ منه السورة والآيتين فقط
    texts: (riwaya) => "ibnbadis.texts.v1." + riwaya   // v1: ارفع الرقم لإجبار إعادة التنزيل
};

// ==========================================================
// 1. المتغيرات العامة
// ==========================================================

let userRiwaya = 0;                           // الرواية الحالية
let isDarkMode = false;

// أسماء السور مرتبة حسب المصحف (0 إلى 113)
const surahsNames = [
    "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
    "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
    "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
    "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
    "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
    "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
    "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
    "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
    "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
    "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
    "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
    "المسد", "الإخلاص", "الفلق", "الناس"
];

// متغيرات شاشات المراجعة
let currentReviewItem = null;

// متغيرات التسجيل الصوتي

// ==========================================================
// 2. طبقة التخزين (localStorage)
// ==========================================================

function lsGet(key, fallback) {
    try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
        return fallback;
    }
}

function lsSet(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
    } catch (e) {
        console.warn("تعذر الحفظ في localStorage:", key, e);
        return false;
    }
}

// --- الإعدادات ---
// القرّاء المتاحون لزر «الشيخ» (حفص فقط): المفتاح = اسم المجلد في everyayah.com
const SHEIKH_RECITERS = [
    { id: "Minshawy_Murattal_128kbps", name: "محمد صديق المنشاوي (مرتّل)", short: "المنشاوي" },
    { id: "Husary_128kbps", name: "محمود خليل الحصري", short: "الحصري" },
    { id: "Abdul_Basit_Murattal_192kbps", name: "عبد الباسط عبد الصمد (مرتّل)", short: "عبد الباسط" },
    { id: "Abdurrahmaan_As-Sudais_192kbps", name: "عبد الرحمن السديس", short: "السديس" },
    { id: "Hudhaify_128kbps", name: "علي الحذيفي", short: "الحذيفي" },
    { id: "Muhammad_Ayyoub_128kbps", name: "محمد أيوب", short: "محمد أيوب" },
    { id: "Alafasy_128kbps", name: "مشاري العفاسي", short: "العفاسي" }
];
// قرّاء ورش (آية بآية، ترقيم ملفاتهم بترقيم حفص): المجلد داخل warsh/ في everyayah.com
const WARSH_RECITERS = [
    { id: "warsh/warsh_ibrahim_aldosary_128kbps", name: "إبراهيم الدوسري (ورش)", short: "الدوسري" },
    { id: "warsh/warsh_yassin_al_jazaery_64kbps", name: "ياسين الجزائري (ورش)", short: "الجزائري" },
    { id: "warsh/warsh_Abdul_Basit_128kbps", name: "عبد الباسط عبد الصمد (ورش)", short: "عبد الباسط", own: true }   // own: ملفاته بترقيم ورش نفسه (ملف n = آية ورش n) لا بترقيم حفص
];
let userSheikh = SHEIKH_RECITERS[0].id;
let userSheikhW = WARSH_RECITERS[0].id;
function sheikhList() { return userRiwaya === 1 ? SHEIKH_RECITERS : WARSH_RECITERS; }
function curSheikh() { return userRiwaya === 1 ? userSheikh : userSheikhW; }
function setSheikh(id) { if (userRiwaya === 1) userSheikh = id; else userSheikhW = id; }
const SHEIKH_RATES = [1, 1.15, 1.3, 1.5, 1.75];
let userRate = 1;
let userRep = 1;          // عدد تكرارات قراءة الشيخ

// «المتوسط» و«الجديد» أُلغيا: ما صُنِّف فيهما سابقاً ينتقل إلى «قيد الحفظ»
function migrateMidToNew() {
    const out = [];
    const ml = lsGet(LS_KEYS.midrev, []);
    if (Array.isArray(ml)) ml.forEach((u) => (u.segs || []).forEach((g) => out.push({ riwaya: u.riwaya, surah: g.surah, start: g.start, end: g.end })));
    const nl = lsGet(LS_KEYS.newrev, []);
    if (Array.isArray(nl)) nl.forEach((e) => out.push({ riwaya: e.riwaya, surah: e.surah, start: e.start, end: e.end }));
    if (!out.length) return;
    lsSet(LS_KEYS.prog, progLoad().concat(out));
    lsSet(LS_KEYS.midrev, []);
    lsSet(LS_KEYS.newrev, []);
}

function loadSettings() {
    migrateMidToNew();
    const s = lsGet(LS_KEYS.settings, {}) || {};
    if (s.riwaya === 0 || s.riwaya === 1) userRiwaya = s.riwaya;
    isDarkMode = false;   // يبدأ التطبيق دائماً بوضع النهار
    if (Number.isInteger(s.rep) && s.rep >= 1 && s.rep <= 30) userRep = s.rep;
    if (SHEIKH_RECITERS.some((r) => r.id === s.sheikh)) userSheikh = s.sheikh;
    if (WARSH_RECITERS.some((r) => r.id === s.sheikhW)) userSheikhW = s.sheikhW;
    if (SHEIKH_RATES.includes(s.rate)) userRate = s.rate;
}

function saveSettings() {
    lsSet(LS_KEYS.settings, {
        riwaya: userRiwaya,
        darkMode: isDarkMode,
        sheikh: userSheikh,
        sheikhW: userSheikhW,
        rate: userRate,
        rep: userRep
    });
}

// ==========================================================
// 3. البيانات الثابتة (نصوص المصحف) - من GitHub مع نسخة محلية
// ==========================================================

// quranTexts[riwaya][surah][ayah] -> نص الآية
const quranTexts = [null, null];
let staticFetchPromises = {};

function fetchStaticFile(fileName) {
    if (!staticFetchPromises[fileName]) {
        const url = STATIC_FILES[fileName];
        if (!url) return Promise.reject(new Error("ملف غير معرّف: " + fileName));
        staticFetchPromises[fileName] = fetch(url)
            .then((res) => {
                if (!res.ok) throw new Error("تعذر جلب الملف: " + fileName + " (" + res.status + ")");
                return res.json();
            })
            .catch((err) => {
                delete staticFetchPromises[fileName];
                throw err;
            });
    }
    return staticFetchPromises[fileName];
}

// الياء الصغيرة المتوسطة (إبراهيم، النبيين، الأميين…) تأتي في بيانات حفص بلا مدّة فتظهر منفصلة؛ نكتبها بالشكل المعتاد «ـۧ»
// (لا نمسّ ياء بِهِۦ الطرفية ولا ما بعد حرف غير الياء/الهاء مثل يُحْۦِىَ)
const MID_SMALL_YA = /([\u064A\u0647][\u064B-\u0652\u0670]*)\u06E6(?=[\u064B-\u065F\u0670]*[\u0621-\u064A])/g;
// نصوص خُزِّنت سابقاً في الهاتف بالصيغة القديمة (تطويلة + ۧ العالية، تشبه الهمزة) تُحوَّل إلى الصيغة الحالية
const OLD_MID_YA = /([\u064A\u0647][\u064B-\u0652\u0670]*)\u0640\u06E7/g;
function fixSmallYa(t) {
    return t.map((sura) => sura.map((a) => (typeof a === 'string' ? a.replace(OLD_MID_YA, '$1\u0640\u06E6').replace(MID_SMALL_YA, '$1\u0640\u06E6') : a)));
}

function isValidRiwayaTexts(x) {
    return Array.isArray(x) && x.length === 114 && Array.isArray(x[0]) && x[0].length > 0;
}

// يضمن وجود نصوص الرواية في الذاكرة: من localStorage أولاً، وإلا من GitHub
async function ensureTextsForRiwaya(riwaya) {
    if (quranTexts[riwaya]) return;

    const cached = lsGet(LS_KEYS.texts(riwaya), null);
    if (isValidRiwayaTexts(cached)) {
        quranTexts[riwaya] = fixSmallYa(cached);
        return;
    }

    const json = await fetchStaticFile("ayah_texts.json");
    const all = json.ayah_texts || json;

    for (let r = 0; r < all.length; r++) {
        if (!quranTexts[r] && isValidRiwayaTexts(all[r])) quranTexts[r] = fixSmallYa(all[r]);
    }
    delete staticFetchPromises["ayah_texts.json"];   // تحرير الذاكرة

    if (!quranTexts[riwaya]) throw new Error("ملف النصوص لا يحتوي على الرواية المطلوبة.");

    // نخزّن الرواية المطلوبة أولاً ثم الأخرى إن اتسعت المساحة
    lsSet(LS_KEYS.texts(riwaya), quranTexts[riwaya]);
    const other = 1 - riwaya;
    if (quranTexts[other]) lsSet(LS_KEYS.texts(other), quranTexts[other]);
}

    const r = (riwaya === undefined) ? userRiwaya : riwaya;
    return quranTexts[r]?.[surahIndex]?.length || 0;
}

function getAyahText(riwaya, surah, ayah) {

}

// 4. ترحيل الإعدادات القديمة (IndexedDB -> localStorage) مرة واحدة
// ==========================================================

function readOldIndexedDB() {
    return new Promise((resolve) => {
        let finished = false;
        const done = (v) => { if (!finished) { finished = true; resolve(v); } };
        if (!window.indexedDB) return done(null);
        setTimeout(() => done(null), 3000);   // حماية من التعليق

        let req;
        try { req = indexedDB.open("IbnBadisQuranDB"); } catch (e) { return done(null); }

        // إن لم تكن القاعدة موجودة نلغي الإنشاء حتى لا نخلق قاعدة فارغة
        req.onupgradeneeded = (e) => { try { e.target.transaction.abort(); } catch (_) {} done(null); };
        req.onerror = () => done(null);
        req.onsuccess = (e) => {
            const db = e.target.result;
            try {
                if (!db.objectStoreNames.contains("quranStore")) { db.close(); return done(null); }
                const tx = db.transaction("quranStore", "readonly");
                const store = tx.objectStore("quranStore");
                const out = { config: null };
                const r2 = store.get("user_app_config.json");
                r2.onsuccess = () => { out.config = r2.result || null; };
                tx.oncomplete = () => { db.close(); done(out); };
                tx.onerror = tx.onabort = () => { db.close(); done(null); };
            } catch (err) {
                try { db.close(); } catch (_) {}
                done(null);
            }
        };
    });
}

async function migrateFromOldIndexedDBOnce() {
    if (lsGet(LS_KEYS.migrated, false)) return;

    // أول تشغيل (لا إعدادات محفوظة بعد): نستورد الإعدادات القديمة إن وُجدت
    if (lsGet(LS_KEYS.settings, null) === null) {
        const old = await readOldIndexedDB();
        if (old && old.config) {
            if (old.config.riwaya === 0 || old.config.riwaya === 1) userRiwaya = old.config.riwaya;
            saveSettings();
        }
    }
    lsSet(LS_KEYS.migrated, true);
}

// عند القدوم من نهاية الجلسة: نعرض فقط آيات التعثر في تلك الجلسة (مجموعة مفاتيح «سورة:آية»)؛ null = كل الآيات
let reviewOnlyKeys = null;

// إحصاء الآيات المستحقة الآن: لكل القرآن ولكل سورة، مصنفةً حسب آخر تقييم
function computeDueStats() {
    const riwaya = userRiwaya;
    const store = loadAyahStore(riwaya);
    const now = Date.now();
    const blank = () => ({ forgot: 0, hard: 0, good: 0, easy: 0, total: 0, keys: [] });
    const all = blank(), per = {};
    for (const k in store) {
        const rec = store[k];
        if (!rec || !Number.isFinite(rec.d) || !Number.isFinite(rec.t)) continue;
        const parts = k.split(":");
        const sIdx = Number(parts[0]), a = Number(parts[1]);
        if (!Number.isInteger(sIdx) || !Number.isInteger(a) || a < 0 || a >= getAyatCount(sIdx, riwaya)) continue;
        if (!isDue(rec, now)) continue;
        const lr = lastRatingOf(rec);
        all[lr]++; all.total++;
        const ps = per[sIdx] || (per[sIdx] = blank());
        ps[lr]++; ps.total++; ps.keys.push(k);
    }
    return { all, per };
}

    const store = loadAyahStore(userRiwaya), now = Date.now(), list = [];
    for (const k in store) {
        const rec = store[k];
        if (!rec || !Number.isFinite(rec.d) || !Number.isFinite(rec.t)) continue;
        const p = k.split(':'), s = Number(p[0]), a = Number(p[1]);
        if (!Number.isInteger(s) || !Number.isInteger(a) || a < 0 || a >= getAyatCount(s, userRiwaya)) continue;
        const due = isDue(rec, now);
        if (dueOnly && !due) continue;
        list.push({ k, s, a, due });
    }
    list.sort((x, y) => x.s - y.s || x.a - y.a);
    const cells = list.map((o) => `<button type="button" class="ag-btn${o.due ? ' ag-due' : ''}" data-k="${o.k}" onclick="startReviewOne('${o.k}')"><span class="ag-s">${surahsNames[o.s]}</span> <span class="ag-n">${o.a + 1}</span></button>`).join('');
    hfPage('aqalSettingsOpen()', 'showMainButtons()', `
        <div class="exercise-box" id="exercise-container" style="display: flex; flex-direction: column; gap: 8px;">
            <div class="surah-list-container" style="flex: 1; min-height: 0; max-height: none;">
                ${list.length ? `<div class="ag-grid" style="grid-template-columns: repeat(${AG_COLS}, 1fr);">${cells}</div>` : `<div class="rv-empty">${dueOnly ? 'لا توجد آيات مستحقة الآن.' : 'لا توجد آيات في قائمة التعثر بعد.'}</div>`}
            </div>
        </div>`, '', `<span id="ag-title">${dueOnly ? 'الآيات المستحقة' : 'قائمة آيات التعثر'}</span>`);
}

// ----------------------------------------------------------
// خوارزمية عقال الآيات
// قائمة الآيات تبدأ فارغة؛ تُضاف إليها الآية عند التعثر فيها في المراجعة اليومية بصعوبة 10.
// ----------------------------------------------------------
const RATING_POINTS = { easy: 1, good: 4, hard: 7, forgot: 10 };
const BASE_DAYS = 180;
const DAY_MS = 86400000;
let reviewedThisSession = 0;
let lastReviewedKey = null;

function ayahKey(surah, ayah) { return surah + ":" + ayah; }
function loadAyahStore(riwaya) {
    const o = lsGet(LS_KEYS.ayahs(riwaya), {});
    return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
}
function saveAyahStore(riwaya, store) { lsSet(LS_KEYS.ayahs(riwaya), store); }

// الزمن المرجعي بالأيام = Base ^ ((10 - الصعوبة) / 9)
function refTimeDays(d) { return Math.pow(BASE_DAYS, (10 - d) / 9); }
// الأولوية = الزمن المنقضي ÷ الزمن المرجعي
function priorityOf(rec, now) { return ((now - rec.t) / DAY_MS) / refTimeDays(rec.d); }

// تُستدعى من المراجعة اليومية عند الضغط على «تعثر»: تدخل الآية (أو تعود) بصعوبة 10
function addStumbledAyah(surah, ayah) {
    const store = loadAyahStore(userRiwaya);
    store[ayahKey(surah, ayah)] = { d: 10, t: Date.now(), last: 'forgot' };
    saveAyahStore(userRiwaya, store);
}

// لا تُعرض في عقال الآيات إلا الآيات التي بلغت أولويتها هذا الحد
const DUE_THRESHOLD = 0.5;

// آخر تقييم للآية؛ للسجلات القديمة بلا تقييم نستنتجه من الصعوبة
function lastRatingOf(rec) {
    if (rec.last === 'forgot' || rec.last === 'hard' || rec.last === 'good' || rec.last === 'easy') return rec.last;
    if (rec.d >= 8.5) return 'forgot';
    if (rec.d >= 5.5) return 'hard';
    if (rec.d >= 2.5) return 'good';
    return 'easy';
}

// مستحقة الآن: بلغت أولويتها الحد، أو كان آخر تقييم لها «نسيت/تعثر» فتعود اليوم مباشرة
function isDue(rec, now) {
    return priorityOf(rec, now) >= DUE_THRESHOLD || lastRatingOf(rec) === 'forgot';
}

// عدد الآيات المستحقة الآن (أولويتها ≥ الحد) مصنفةً حسب آخر تقييم
function countDueByLast() {
    const store = loadAyahStore(userRiwaya);
    const now = Date.now();
    const c = { forgot: 0, hard: 0, good: 0, easy: 0 };
    for (const k in store) {
        const rec = store[k];
        if (!rec || !Number.isFinite(rec.d) || !Number.isFinite(rec.t)) continue;
        if (reviewOnlyKeys && !reviewOnlyKeys.has(k)) continue;
        if (isDue(rec, now)) c[lastRatingOf(rec)]++;
    }
    return c;
}

function updateDueCounts() {
    const c = countDueByLast();
    const el = document.getElementById('due-total');
    if (el) el.textContent = c.forgot + c.hard + c.good + c.easy;
}

// أعلى أولوية أولاً؛ نتجنب تكرار الآية التي راجعناها للتو إن وُجدت غيرها
function pickNextAyahForReview(excludeKey) {
    const riwaya = userRiwaya;
    const store = loadAyahStore(riwaya);
    const now = Date.now();
    let best = null, bestP = -Infinity, bestT = 0;
    let fallback = null;
    for (const k in store) {
        const rec = store[k];
        if (!rec || !Number.isFinite(rec.d) || !Number.isFinite(rec.t)) continue;
        const parts = k.split(":");
        const s = Number(parts[0]), a = Number(parts[1]);
        if (!Number.isInteger(s) || !Number.isInteger(a) || a < 0 || a >= getAyatCount(s, riwaya)) continue;
        const p = priorityOf(rec, now);
        if (reviewOnlyKeys && !reviewOnlyKeys.has(k)) continue;
        if (!isDue(rec, now)) continue;
        const cand = { riwaya, surah: s, ayah: a, key: k };
        if (k === excludeKey) { fallback = cand; continue; }
        if (p > bestP || (p === bestP && rec.t < bestT)) { best = cand; bestP = p; bestT = rec.t; }
    }
    return best || fallback;
}

// ratingType: 'forgot' | 'hard' | 'good' | 'easy' و item = { riwaya, surah, ayah }
// الصعوبة الجديدة = (القديمة + نقطة الزر) ÷ 2 ، ويُحدَّث تاريخ آخر مراجعة
function onAyahRated(item, ratingType) {
    const pt = RATING_POINTS[ratingType];
    if (!item || !pt) return;
    const store = loadAyahStore(item.riwaya);
    const k = ayahKey(item.surah, item.ayah);
    const rec = store[k] || { d: 10, t: Date.now() };
    rec.d = (rec.d + pt) / 2;
    rec.t = Date.now();
    rec.last = ratingType;
    store[k] = rec;
    saveAyahStore(item.riwaya, store);
    lastReviewedKey = k;
}

        if (!quranTexts[0]?.[surah] || !quranTexts[1]?.[surah]) return null;

// 9. إبقاء الشاشة مضاءة أثناء التسجيل والتلاوة

// إبقاء الشاشة مضاءة أثناء التسجيل حتى لا يقطعه المتصفح عند انطفائها
let wakeLockSentinel = null;
let wantWakeLock = false;
async function acquireWakeLock() {
    wantWakeLock = true;
    try {
        if ('wakeLock' in navigator && !wakeLockSentinel && document.visibilityState === 'visible') {
            const sentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel = sentinel;
            sentinel.addEventListener('release', () => { if (wakeLockSentinel === sentinel) wakeLockSentinel = null; });
        }
    } catch (e) { /* غير مدعوم أو مرفوض: نكمل بدونه */ }
}
function releaseWakeLock() {
    wantWakeLock = false;
    const sentinel = wakeLockSentinel;
    wakeLockSentinel = null;
    if (sentinel) { try { sentinel.release().catch(() => {}); } catch (e) {} }
}
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && wantWakeLock) acquireWakeLock();
});

// ==========================================================
// 9ج. الآيات المفعَّلة للمراجعة اليومية (تُخزَّن مدمجةً لكل سورة)
// ==========================================================
function mergeRanges(r) {
    const a = r.filter((x) => Array.isArray(x) && x[0] >= 1 && x[1] >= x[0]).sort((p, q) => p[0] - q[0]);
    const out = [];
    a.forEach((x) => {
        const last = out[out.length - 1];
        if (last && x[0] <= last[1] + 1) last[1] = Math.max(last[1], x[1]);
        else out.push([x[0], x[1]]);
    });
    return out;
}

function activeLoad(riwaya) {
    const o = lsGet(LS_KEYS.active(riwaya), {});
    return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {};
}

function activeAdd(riwaya, segs) {
    const o = activeLoad(riwaya);
    segs.forEach((g) => { const k = String(g.surah); o[k] = (o[k] || []).concat([[g.start, g.end]]); });
    Object.keys(o).forEach((k) => { o[k] = mergeRanges(o[k]); });
    lsSet(LS_KEYS.active(riwaya), o);
}

// ==========================================================
// 9د. تصنيف القرآن حسب درجة الحفظ (من الإعدادات)
// لكل آية حالة واحدة: الراسخ (المفعَّل في «مراجعة الراسخ»)،
// الجديد (مقاطع «مراجعة الجديد»)، وإلا غير مصنف. التصنيف الجديد يقتطع الآيات من درجتها السابقة.
// ==========================================================
const CLS_CATS = {
    rasikh: { name: 'المحفوظ', rank: 3 },
    prog: { name: 'قيد الحفظ', rank: 4 },
    none: { name: 'غير مصنف', rank: 0 }
};
function progLoad() { const l = lsGet(LS_KEYS.prog, []); return Array.isArray(l) ? l : []; }
let clsA = null, clsB = null, clsScroll = 0;   // clsA/clsB: بداية ونهاية التحديد الحالي {s, a}

// [a,b] ناقص [s,e]
function subRange(a, b, s, e) {
    if (e < a || s > b) return [[a, b]];
    const out = [];
    if (s > a) out.push([a, s - 1]);
    if (e < b) out.push([e + 1, b]);
    return out;
}

// إزالة مدى من الراسخ والمتوسط والجديد (للرواية الحالية)
function clsRemove(surah, start, end) {
    const rw = userRiwaya;
    const act = activeLoad(rw), k = String(surah);
    if (act[k]) {
        let r = [];
        act[k].forEach(([a, b]) => { r = r.concat(subRange(a, b, start, end)); });
        if (r.length) act[k] = mergeRanges(r); else delete act[k];
        lsSet(LS_KEYS.active(rw), act);
    }
    const pl = [];
    progLoad().forEach((e) => {
        if (e.riwaya !== rw || e.surah !== surah) { pl.push(e); return; }
        subRange(e.start, e.end, start, end).forEach(([a, b]) => pl.push(Object.assign({}, e, { start: a, end: b })));
    });
    lsSet(LS_KEYS.prog, pl);
    const ct = lsGet(LS_KEYS.cuts(rw), {});
    if (ct && ct[String(surah)]) {
        const keep = ct[String(surah)].filter((a) => a < start || a > end);
        if (keep.length) ct[String(surah)] = keep; else delete ct[String(surah)];
        lsSet(LS_KEYS.cuts(rw), ct);
    }
}

// رتبة كل آية (0 غير مصنف، 3 محفوظ، 4 قيد الحفظ) لكل السور
function clsRanks() {
    const rw = userRiwaya, arr = {};
    const get = (s) => arr[s] || (arr[s] = new Uint8Array((getAyatCount(s) || 0) + 2));
    const mark = (s, a, b, v) => { const x = get(s); for (let n = Math.max(1, a); n <= Math.min(b, x.length - 2); n++) if (x[n] < v) x[n] = v; };
    const act = activeLoad(rw);
    Object.keys(act).forEach((k) => (act[k] || []).forEach(([a, b]) => mark(Number(k), a, b, 3)));
    // «قيد الحفظ» أضعف الدرجات عند التداخل: لا يظهر إلا حيث لا درجة أخرى
    progLoad().forEach((e) => {
        if (e.riwaya !== rw) return;
        const x = get(e.surah);
        for (let n = Math.max(1, e.start); n <= Math.min(e.end, x.length - 2); n++) if (x[n] === 0) x[n] = 4;
    });
    return { get, n: (s) => getAyatCount(s) || 0 };
}

// ---------- شاشة التصنيف: القرآن كله في نافذة واحدة، أرقام الآيات تحت اسم كل سورة ----------
const clsCmp = (s1, a1, s2, a2) => (s1 - s2) || (a1 - a2);
function clsInSel(s, a) {
    return !!(clsA && clsB && clsCmp(s, a, clsA.s, clsA.a) >= 0 && clsCmp(s, a, clsB.s, clsB.a) <= 0);
}

// تصنيف مدى قد يمتد عبر سور: من (s1,a1) إلى (s2,b2)
function clsAssignRange(cat, s1, a1, s2, b2) {
    const rw = userRiwaya, segs = [];
    // نهايات المقاطع قبل التصنيف: تبقى فواصل إن صار بعدها مقطع من الدرجة نفسها
    const R0 = clsRanks(), prevEnds = [];
    for (let q = 0; q < surahsNames.length; q++) for (let n = 1; n <= R0.n(q); n++) if (clsIsEnd(R0, q, n)) prevEnds.push([q, n, R0.get(q)[n]]);
    for (let s = s1; s <= s2; s++) {
        const N = getAyatCount(s) || 0;
        const start = s === s1 ? a1 : 1, end = s === s2 ? b2 : N;
        if (N && end >= start) segs.push({ surah: s, start, end });
    }
    segs.forEach((g) => clsRemove(g.surah, g.start, g.end));
    if (cat === 'rasikh') activeAdd(rw, segs);
    else if (cat === 'prog') { const l = progLoad(); segs.forEach((g) => l.push({ riwaya: rw, surah: g.surah, start: g.start, end: g.end })); lsSet(LS_KEYS.prog, l); }
    const R1 = clsRanks();
    prevEnds.forEach(([q, n, x]) => { if (R1.get(q)[n] === x && clsNextRank(R1, q, n) === x) clsAddCut(q, n); });
    passChanged();
    if (cat !== 'none') { const last = segs[segs.length - 1]; if (last && clsNextRank(R1, last.surah, last.end) === R1.get(last.surah)[last.end]) clsAddCut(last.surah, last.end); }
}

// رتبة الآية التالية بترتيب المصحف (-1 بعد آخر آية)
function clsNextRank(R, s, a) {
    if (a < R.n(s)) return R.get(s)[a + 1];
    return s + 1 < surahsNames.length ? R.get(s + 1)[1] : -1;
}
// فاصل يدوي: سُجّل عند الآية وكانت التالية من الدرجة نفسها (وإلا لا معنى له فلا يظهر)
function clsIsManualCut(R, cuts, s, a) {
    const x = R.get(s)[a];
    return !!x && (cuts[String(s)] || []).includes(a) && clsNextRank(R, s, a) === x;
}
// آخر آية في كل مقطع ملوّن (غير الأبيض): تلقائياً بعدها آية من درجة أخرى أو نهاية المصحف
function clsIsEnd(R, s, a) {
    const x = R.get(s)[a];
    return !!x && clsNextRank(R, s, a) !== x;
}
// داكنة = نهاية مقطع (تلقائية) أو فاصل يدوي
function clsIsCut(R, cuts, s, a) {
    return clsIsEnd(R, s, a) || clsIsManualCut(R, cuts, s, a);
}
function clsAddCut(s, a) {
    const rw = userRiwaya, ct = lsGet(LS_KEYS.cuts(rw), {}) || {}, k = String(s);
    const list = ct[k] || [];
    if (list.includes(a)) return;
    ct[k] = list.concat([a]).sort((p, q) => p - q);
    lsSet(LS_KEYS.cuts(rw), ct);
}
function clsToggleCut(s, a) {
    const rw = userRiwaya, ct = lsGet(LS_KEYS.cuts(rw), {}) || {}, k = String(s);
    const list = ct[k] || [];
    if (list.includes(a)) ct[k] = list.filter((v) => v !== a);
    else ct[k] = list.concat([a]).sort((p, q) => p - q);
    if (!ct[k].length) delete ct[k];
    lsSet(LS_KEYS.cuts(rw), ct);
    passChanged();
}

// نهايات الصفحات والأثمان والأرباع والأنصاف والأحزاب: أرقام تسلسلية للآية (1 = أول آية في المصحف) لكل رواية

            <div class="cm-legend"><button type="button" class="cm-pick cm-r0" onclick="clsApply('none')">غير مصنف</button><button type="button" class="cm-pick cm-r4" onclick="clsApply('prog')">قيد الحفظ</button><button type="button" class="cm-pick cm-r3" onclick="clsApply('rasikh')">المحفوظ</button></div>
            <div id="cm-status" class="cm-status"></div>
            <div class="surah-list-container cm-map" id="cm-map" style="flex: 1; min-height: 0; max-height: none;">${clsMapHtml()}</div>
        </div>`, clsMarkBtns(), 'تصنيف الآيات حسب درجة الحفظ', '', HOME_BTN());
}
// الحدّ (صفحة/ثمن/ربع/نصف/حزب): أربعة أزرار ظاهرة أسفل الصفحة (حفص: بلا ثمن، ورش: بلا ربع)، والحزب مفعَّل افتراضياً؛ يُوضع إطار أحمر على آخر آية في كل وحدة
function clsMarkBtns() {
    return (userRiwaya === 1 ? ['page', 'rub', 'half', 'hizb'] : ['page', 'thumn', 'half', 'hizb']).map((k) => `<div class="rd-cell rd-mk"><button type="button" id="cm-mk-${k}" class="btn-secondary hf-btn cm-mkb${clsMark === k ? ' on' : ''}" onclick="clsSetMark('${k}')">${CLS_MARK_NAMES[k]}</button></div>`).join('');
}
function clsPaint() {
    document.querySelectorAll('#cm-map .cm-a').forEach((e) => {
        e.classList.toggle('sel', clsInSel(+e.dataset.s, +e.dataset.a) || (!clsB && !!clsA && +e.dataset.s === clsA.s && +e.dataset.a === clsA.a));
    });
    clsStatus();
}
// السطر فوق القائمة: نص آخر آية ضُغط عليها (بلا رجوع إلى السطر؛ يُمرَّر بالإصبع لبقية الآية)، وبعد تحديد المقطع كاملاً: وصفه
function clsStatus() {
    const st = document.getElementById('cm-status');
    if (!st) return;
    const range = !!(clsA && clsB);
    st.classList.toggle('txt', !range);
    st.textContent = range ? clsRangeLabel() + ' · اختر الدرجة أو اضغط للإلغاء' : (clsLast ? (getAyahText(userRiwaya, clsLast.s, clsLast.a - 1) || '') : '');
    if (!range) st.scrollLeft = 0;
}

function clsRangeLabel() {
    const f = (p) => surahsNames[p.s] + ' ' + p.a;
    return clsA.s === clsB.s && clsA.a === clsB.a ? f(clsA) : f(clsA) + ' ← ' + f(clsB);
}

// إطار أحمر على نهايات الحد المختار؛ الضغط على الزر نفسه ثانية يخفي الإطار
function clsSetMark(k) {
    if (!(CLS_MARKS[userRiwaya] && CLS_MARKS[userRiwaya][k])) {
        showToast('لا توجد أثمان في مصحف حفص (المدني)؛ الأثمان لرواية ورش فقط.');
        return;
    }
    clsMark = clsMark === k ? null : k;
    document.querySelectorAll('.cm-mkb').forEach((b) => b.classList.toggle('on', b.id === 'cm-mk-' + clsMark));
    const mk = clsMarkSet(), off = clsOffsets();
    document.querySelectorAll('#cm-map .cm-a').forEach((e) => e.classList.toggle('mk', !!mk && mk.has(off[+e.dataset.s] + +e.dataset.a)));
}

// ضغطة في أي مكان من الشاشة: تلغي التحديد الكامل (الأصفر)، وأزرار الدرجات في الأعلى تصنّفه
function clsGlobalTap(ev) {
    const t = ev.target;
    if (t.closest && (t.closest('.cm-pick') || t.closest('.cm-name'))) return;
    if (clsA && clsB) { clsA = null; clsB = null; clsPaint(); return; }
    clsTap(ev);
}

function clsTap(ev) {
    const el = ev.target.closest && ev.target.closest('.cm-a');
    if (!el) return;
    const s = +el.dataset.s, a = +el.dataset.a;
    clsLast = { s, a };
    clsStatus();
    if (clsA && clsB) {
        clsA = null; clsB = null; clsPaint(); return;
    } else if (clsA && !clsB) {
        if (clsA.s === s && clsA.a === a) {                 // الضغط على آية البداية نفسها: فاصل أجزاء (التصنيف لا يكون بآية واحدة)
            clsA = null;
            const R = clsRanks();
            if (!R.get(s)[a]) { clsPaint(); return; }       // آية بيضاء: نلغي التحديد فقط
            if (clsNextRank(R, s, a) !== R.get(s)[a]) { showToast("آخر آية في المقطع داكنة تلقائياً."); clsPaint(); return; }
            clsToggleCut(s, a);
            clsRefreshCut(s, a);
            clsPaint();
            return;
        }
        if (clsCmp(s, a, clsA.s, clsA.a) < 0) clsA = { s, a };   // قبل البداية: تصير هي البداية وننتظر النهاية
        else clsB = { s, a };
    } else {
        const R = clsRanks();
        if (clsIsManualCut(R, lsGet(LS_KEYS.cuts(userRiwaya), {}) || {}, s, a)) {   // ضغطة على فاصل يدوي: يُلغى الفاصل ويصير المقطعان مقطعاً واحداً
            clsToggleCut(s, a);
            clsRefreshCut(s, a);
            return;
        }
        clsA = { s, a };
    }
    clsPaint();
}

function clsRefreshCut(s, a) {
    const el = document.getElementById(`cm-${s}-${a}`);
    if (el) el.classList.toggle('cut', clsIsCut(clsRanks(), lsGet(LS_KEYS.cuts(userRiwaya), {}) || {}, s, a));
}

function clsApply(cat) {
    if (!clsA || !clsB) { showToast('حدّد المقطع أولاً: اضغط آية البداية ثم آية النهاية.'); return; }
    const label = clsRangeLabel();
    clsAssignRange(cat, clsA.s, clsA.a, clsB.s, clsB.a);
    clsA = null; clsB = null;
    const box = document.getElementById('cm-map');
    const top = box ? box.scrollTop : 0;
    if (box) { box.innerHTML = clsMapHtml(); box.scrollTop = top; }
    clsPaint();
    showToast(label + (cat === 'none' ? ': غير مصنف.' : ': ' + CLS_CATS[cat].name + '.'));
}

// ==========================================================
// 9ب. «مراجعة الحفظ الجديد»
// المقطع الذي يُترك في «الحفظ مع الشيخ» لمقطع آخر ينتقل تلقائياً إلى هذه القائمة (الأحدث في الأسفل)،
// والمراجعة تعيد استعمال شاشة المراجعة اليومية: الآية الأولى مطلعاً أزرق ثم يتلو الباقي إلى آخر المقطع.
// لا تعثّر ولا عقال آيات هنا، ولا يتغير موضع التوقف الخاص بالمراجعة اليومية.
// ==========================================================
let newReviewMode = false;
let reviewOrigin = 'rasikh';     // قائمة الرجوع

function unitLabelOf(segs) {
    const f = segs[0], l = segs[segs.length - 1];
    return f.surah === l.surah ? `${surahsNames[f.surah]} — من ${f.start} إلى ${l.end}` : `من ${surahsNames[f.surah]} ${f.start} إلى ${surahsNames[l.surah]} ${l.end}`;
}

// ---------- قائمتا «الحفظ مع الشيخ» و«مراجعة الراسخ»: المقاطع المصنَّفة ----------
// أي تغيير في التصنيف أو الفواصل = تقسيم جديد: تُلغى علامة «آخر مقطع»، ويُصفَّر عدّاد كل مقطع تغيّر (المقطع الذي بقي كما هو يحتفظ بعدّاده)
function passSig(rank, segs) {
    const f = segs[0], l = segs[segs.length - 1];
    return userRiwaya + ':' + rank + ':' + f.surah + ':' + f.start + '-' + l.surah + ':' + l.end;
}
function passChanged() {
    const pre = userRiwaya + ':';
    const lp = lsGet(LS_KEYS.lastpass, {}) || {};
    Object.keys(lp).forEach((k) => { if (k.startsWith(pre)) delete lp[k]; });
    lsSet(LS_KEYS.lastpass, lp);
    const ok = new Set();
    [3, 4].forEach((r) => rankPassages(r).forEach((p) => (r === 4 ? p.segs.map((g) => [g]) : [p.segs]).forEach((sg) => ok.add(passSig(r, sg)))));
    const sc = lsGet(LS_KEYS.sched, {}) || {};
    Object.keys(sc).forEach((k) => { if (k.startsWith(pre) && !ok.has(k)) delete sc[k]; });
    lsSet(LS_KEYS.sched, sc);
}

// ---------- جدولة المراجعة (يدوية): التطبيق يحسب الأيام فقط ----------
// المقطع الجديد (إنشاء/دمج/فصل) بلا سجل: مدته 0 والمتبقي 0 = يُراجَع اليوم (أحمر)
function schedToday() { const d = new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); }
function schedGet(sig) {
    const m = lsGet(LS_KEYS.sched, {}) || {}, r = sig ? m[sig] : null;
    return r ? { n: Math.max(0, +r.n || 0), d: +r.d, l: (r.l === undefined || r.l === null) ? null : +r.l } : { n: 0, d: NaN, l: null };
}
function schedRemain(sig) { const r = schedGet(sig); return isNaN(r.d) ? 0 : r.d - schedToday(); }
function schedCls(sig) {
    const r = schedGet(sig), rem = schedRemain(sig);
    return rem <= 0 ? 'sd-r' : 'sd-g';   // أخضر: بقي وقت · أحمر: حان الوقت
}
// الرقم = الأيام منذ آخر مراجعة (أخضر قبل الاستحقاق، برتقالي بعده)؛ الضغط عليه يبيّن المتبقي أو التأخر؛ «؟» تعرض أول آية في المقطع
function schedElapsed(sig) {
    const r = schedGet(sig), t = schedToday();
    if (r.l !== null && !isNaN(r.l)) return Math.max(0, t - r.l);
    return isNaN(r.d) ? 0 : Math.max(0, t - (r.d - r.n));
}
function schedBtnHtml(k, sig) {
    return `<button type="button" id="sd-${k}" class="sd-btn ${schedCls(sig)}" onclick="schedInfo(${k})" aria-label="الأيام منذ آخر مراجعة" title="الأيام منذ آخر مراجعة"><span dir="ltr">${schedElapsed(sig)}</span></button>`;
}
function schedInfo(k) {
    const sig = psSched[k];
    if (!sig) return;
    const rem = schedRemain(sig), e = schedElapsed(sig);
    const msg = rem > 0 ? `بقي <b>${rem}</b> ${rem === 1 ? 'يوم' : 'أيام'} حتى موعد المراجعة.` : (rem === 0 ? 'موعد المراجعة اليوم.' : `تأخرتَ عن المراجعة <b>${-rem}</b> ${-rem === 1 ? 'يوماً' : 'أياماً'}.`);
    const f = psFirst[k], words = f ? String(rdAyahText(f.surah, f.start - 1)).split(/\s+/).filter(Boolean) : [];
    const beg = words.length ? words.slice(0, 5).join(' ') + (words.length > 5 ? ' …' : '') : '';
    pgPopOpen(`<div class="modal-title">موعد المراجعة</div><p id="sd-info" class="sd-info">مضى ${e} ${e === 1 ? 'يوم' : 'أيام'} على آخر مراجعة.<br>${msg}</p>` + (f ? `<div class="sd-ftitle">الآية الأولى من المقطع</div><p id="sd-first" class="sd-first"><span class="sd-first-lbl">${surahsNames[f.surah]} — الآية ${f.start}</span><br>${beg}</p>` : ''));
}
let psSched = [];
let psFirst = [];
function lastPassSet(rank, s, a) {
    const m = lsGet(LS_KEYS.lastpass, {}) || {};
    m[userRiwaya + ':' + rank] = { s, a };
    lsSet(LS_KEYS.lastpass, m);
}

// فهرس المقطع الذي يحوي آخر آية بدأنا منها (يصمد أمام إعادة التقسيم)؛ passages: مصفوفة مقاطع، لكل منها segs
function lastPassIndex(rank, segsOf) {
    const m = lsGet(LS_KEYS.lastpass, {}) || {}, l = m[userRiwaya + ':' + rank];
    if (!l) return -1;
    return segsOf.findIndex((segs) => segs.some((g) => g.surah === l.s && l.a >= g.start && l.a <= g.end));
}

let psFilter = 'all';          // الكل ← المستحق (الأحمر)
function renderPassageList(o) {
    try { rdTeardown(); } catch (e) {}
    rd = null;
    newReviewMode = false;
    psSched = o.items.map((it) => it.sched || null);
    psFirst = o.items.map((it) => it.first || null);
    const rows = o.items.map((it, k) => {
        const btn = `<button type="button" id="ps-${k}" class="resume-btn ps-btn ${it.cls || ''}${it.last ? ' last' : ''}" onclick="${it.on || (o.startFn + '(' + k + ')')}"><span class="rb-main">${it.label}</span></button>`;
        return `<div class="ps-row" id="psr-${k}">${btn}${it.sched ? schedBtnHtml(k, it.sched) : ''}</div>`;
    }).join('');
    psKind = o.kind || psKind;
    const html = `
        <div class="exercise-box ps-box" id="exercise-container" style="display: flex; flex-direction: column; gap: 8px;">
                        <div class="surah-list-container" id="ps-list" style="flex: 1; min-height: 0; max-height: none;">${rows || `<div class="nr-empty">${o.empty}</div>`}<div id="ps-none" class="nr-empty hidden">لا توجد مقاطع بهذا التصنيف.</div></div>
        </div>
    `;
    const other = psKind === 'prog' ? 'showRasikhList()' : 'showProgList()', otherName = psKind === 'prog' ? 'المراجعة' : 'الحفظ';
    const ttl = `<span>${o.title || ''}</span>` + (psKind === 'prog' ? '' : `<button type="button" id="ps-due" class="ps-due-btn" onclick="psToggleDue()" aria-label="المقاطع المستحقة" title="المقاطع المستحقة"><span id="ps-due-n" class="ps-due-n"></span></button>`);
    const clsBtn = `<div class="rd-cell rd-sq"><button type="button" id="ps-torev" class="btn-secondary hf-btn" onclick="${other}" aria-label="الانتقال إلى ${otherName}" title="الانتقال إلى ${otherName}">${tbIcon('review')}</button></div>`
        + `<div class="rd-cell"><button type="button" id="ps-cls" class="btn-secondary hf-btn" onclick="showClassifyPage('${psKind}')">إعادة تصنيف الآيات</button></div>`;
    hfPage('', 'showMainButtons()', html, clsBtn, ttl, '', HOME_BTN());
    psFilterApply();
    try { const l = document.querySelector('.ps-btn.last'); if (l) l.scrollIntoView({ block: 'center' }); } catch (e) {}
}
function psFilterApply() {
    const rows = document.querySelectorAll('#ps-list .ps-row');
    let shown = 0;
    rows.forEach((r) => {
        const b = r.querySelector('.sd-btn');
        const red = !!b && b.classList.contains('sd-r');
        const ok = psKind === 'prog' || psFilter === 'all' || red;
        r.classList.toggle('hidden', !ok);
        if (ok) shown++;
    });
    const none = document.getElementById('ps-none');
    if (none) none.classList.toggle('hidden', shown > 0 || !rows.length);
    const dn = document.getElementById('ps-due-n');
    if (dn) {
        const n = document.querySelectorAll('#ps-list .sd-btn.sd-r').length;
        dn.textContent = n;
        dn.className = 'ps-due-n' + (n === 0 ? ' z' : (psFilter === 'red' ? ' on' : ''));
    }
}
let psKind = 'prog';
function psToggleDue() {
    psFilter = psFilter === 'red' ? 'all' : 'red';
    psFilterApply();
}

// مقاطع «قيد الحفظ»: كل مقطع مصنَّف في سورة واحدة (يُقصّ مما صار في درجة أخرى)
let progList = [];
function progPassages() {
    const out = [];
    rankPassages(4).forEach((p) => p.segs.forEach((g) => out.push({ surah: g.surah, start: g.start, end: g.end })));
    return out;
}

function showProgList() {
    progList = progPassages();
    const li = lastPassIndex(4, progList.map((g) => [g]));
    renderPassageList({
        items: progList.map((g, i) => ({ label: `${surahsNames[g.surah]} — من ${g.start} إلى ${g.end}`, cls: 'cm-r4', last: i === li })),
        startFn: 'startProgPassage', kind: 'prog',
        title: 'اختر المقطع الذي تحفظه',
        empty: 'لا توجد مقاطع «قيد الحفظ» بعد.<br>صنّف ما تحفظه الآن من «تصنيف القرآن» باختيار «قيد الحفظ».'
    });
}

function startProgPassage(k) {
    const g = progList[k];
    if (!g) return;
    lastPassSet(4, g.surah, g.start);
    const old = lsGet(LS_KEYS.prep, null);
    const same = old && old.riwaya === userRiwaya && old.surah === g.surah && old.start === g.start && old.end === g.end;
    if (same) { prep = loadPrep(); }
    if (!same || !prep) {
        prep = prepNormalize({ riwaya: userRiwaya, surah: g.surah, start: g.start, end: g.end, cuts: [], t: Date.now() });
        savePrep();
    }
    showPrepPage();
}

// مقاطع الراسخ: آيات متصلة بترتيب المصحف (قد تمتد عبر سور) وتنقسم عند فواصل الأجزاء
let rasikhList = [];
// مقاطع درجة معيّنة: آيات متصلة بترتيب المصحف تنقسم عند كل آية داكنة (نهاية مقطع أو فاصل يدوي)
function rankPassages(rank) {
    const R = clsRanks(), cuts = lsGet(LS_KEYS.cuts(userRiwaya), {}) || {}, out = [];
    let cur = null;
    for (let s = 0; s < surahsNames.length; s++) {
        const x = R.get(s), N = R.n(s);
        for (let n = 1; n <= N; n++) {
            if (x[n] === rank) {
                if (!cur) cur = { segs: [], count: 0 };
                const last = cur.segs[cur.segs.length - 1];
                if (last && last.surah === s && last.end === n - 1) last.end = n; else cur.segs.push({ surah: s, start: n, end: n });
                cur.count++;
                if (clsIsCut(R, cuts, s, n)) { out.push(cur); cur = null; }
            } else if (cur) { out.push(cur); cur = null; }
        }
    }
    if (cur) out.push(cur);
    return out;
}
function rasikhPassages() { return rankPassages(3); }

function showRasikhList() {
    rasikhList = rasikhPassages();
    const li = lastPassIndex(3, rasikhList.map((p) => p.segs));
    renderPassageList({
        items: rasikhList.map((p, i) => ({ label: unitLabelOf(p.segs), cls: 'cm-r3', last: i === li, sched: passSig(3, p.segs), first: p.segs[0] })),
        startFn: 'startRasikhPassage', kind: 'rasikh',
        title: 'اختر المقطع الذي تريد مراجعته',
        empty: 'لا توجد مقاطع في «المحفوظ» بعد.<br>صنّف ما حفظتَه من «تصنيف القرآن» باختيار «المحفوظ».'
    });
}

function startRasikhPassage(k) {
    const p = rasikhList[k];
    if (p) { lastPassSet(3, p.segs[0].surah, p.segs[0].start); startUnitReview('rasikh', p.segs); }
}

// ==========================================================
// 9. «الحفظ مع الشيخ»
//    اختيار المقطع ← صفحة واحدة: نص المقطع + التفسير + الشيخ + التجزئة
//    النظام يعمل بالآيات (بلا تجزئة) أو بالأجزاء (بعد التجزئة)، لا بهما معاً.
// ==========================================================

let prep = null;              // {riwaya, surah (من 0), start, end, cuts[]}: cuts = آخر آية في كل جزء عدا الأخير
let prepSurahSel = null;
let prepField = 'start';
let prepStartStr = "";
let prepEndStr = "";

// ---------- أدوات مشتركة ----------

// الشريط العلوي الموحّد للصفحات: [☾] العنوان [⚙] أيقونتان صغيرتان على جانبي العنوان؛ و«العودة» دائماً في الأسفل

}

// نافذة إعدادات الصفحات (× لإغلاقها)
function tbSetOn(v) { document.querySelectorAll('#pg-settings').forEach((b) => b.classList.toggle('on', v)); }
function pgPopClose() { const d = document.getElementById('pg-pop'); if (d) d.remove(); tbSetOn(false); }
function pgPopOpen(inner) {

function prepNormalize(p) {
    if (!p) return null;
    const total = getAyatCount(p.surah, p.riwaya);
    if (p.riwaya !== userRiwaya || !surahsNames[p.surah] || !(p.start >= 1) || !(p.end >= p.start) || p.end > total) return null;
    // الافتراضي: كل آية جزء مستقل (قطع بعد كل آية عدا الأخيرة)؛ ما بعد ذلك يعدّله المستخدم بنفسه (cv=1 يعني أنه عُدِّل/حُفظ بهذا النظام)
    let cuts = [];
    if (!p.cv) { for (let n = p.start; n < p.end; n++) cuts.push(n); }
    else (Array.isArray(p.cuts) ? p.cuts : []).forEach((n) => {
        if (Number.isInteger(n) && n >= p.start && n < p.end && (!cuts.length || n > cuts[cuts.length - 1])) cuts.push(n);
    });
    return { riwaya: p.riwaya, surah: p.surah, start: p.start, end: p.end, cuts, cv: 1, t: Number.isFinite(p.t) ? p.t : undefined };
}

function loadPrep() {
    const cur = prepNormalize(lsGet(LS_KEYS.prep, null));
    if (cur) return cur;
    // الإصدار السابق كان يحفظ تجزئة تلقائية: نأخذ منه السورة والآيتين فقط
    const old = lsGet(LS_KEYS.prepOld, null);
    return old ? prepNormalize({ riwaya: old.riwaya, surah: old.surah, start: old.start, end: old.end, cuts: [] }) : null;
}

// ---------- صفحة المقطع ----------

// ---------- التجزئة: كل آية جزء، والضغط على رقم آية يدمجها مع التي بعدها (يلغي القطع) وإعادة الضغط تعيد القطع ----------

// ---------- صوت الشيخ: الآية أو الجزء أو المقطع كله ----------

// ---------- التسجيل والعرض: يُخفى النص (المحدَّد أو كله) ويتلوه المستخدم من حفظه ثم يقارن ----------

// ---------- التفسير ----------

// كتب التفسير مرقّمة بعدّ حفص. في ورش يختلف عدّ الآيات في نحو نصف السور، فنطابق الآيتين بالكلمات:
// نقارن كلمات السورة في الروايتين (بلا تشكيل) ونعرف أي آيات حفص تقابل كل آية في ورش.
const tafsirAlignCache = {};

function tafsirNormWord(w) {
    return w.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640\uFEFF\u200C\u200D\u08D3-\u08FF]/g, '')
            .replace(/[\u0671\u0622\u0623\u0625]/g, '\u0627').replace(/\u0649/g, '\u064A').replace(/\u0629/g, '\u0647');
}

function tafsirWordsOf(ayahs) {
    const words = [], owner = [];
    ayahs.forEach((t, i) => {
        String(t || '').split(/\s+/).filter(Boolean).forEach((w) => {
            const n = tafsirNormWord(w);
            if (n) { words.push(n); owner.push(i + 1); }
        });
    });
    return { words, owner };
}

// يعيد {رقم آية ورش: [أرقام آيات حفص المقابلة]} للسورة
function warshToHafsMap(surah) {
    if (tafsirAlignCache[surah]) return tafsirAlignCache[surah];
    const W = tafsirWordsOf(quranTexts[0][surah]);
    const H = tafsirWordsOf(quranTexts[1][surah]);
    const m = new Array(W.words.length).fill(-1);
    let i = 0, j = 0;
    while (i < W.words.length && j < H.words.length) {
        if (W.words[i] === H.words[j]) { m[i] = j; i++; j++; continue; }
        let found = false;
        for (let d = 1; d <= 8 && !found; d++) {
            for (let a = 0; a <= d && !found; a++) {
                const b = d - a;
                if (i + a < W.words.length && j + b < H.words.length && W.words[i + a] === H.words[j + b] &&
                    (i + a + 1 >= W.words.length || j + b + 1 >= H.words.length || W.words[i + a + 1] === H.words[j + b + 1])) {
                    for (let k = 0; k < a; k++) m[i + k] = Math.min(j + Math.min(k, b), H.words.length - 1);
                    i += a; j += b; found = true;
                }
            }
        }
        if (!found) { m[i] = j; i++; j++; }
    }
    for (; i < W.words.length; i++) m[i] = H.words.length - 1;
    const res = {};
    W.owner.forEach((wa, idx) => {
        const ha = H.owner[m[idx]];
        if (!res[wa]) res[wa] = [];
        if (!res[wa].includes(ha)) res[wa].push(ha);
    });
    tafsirAlignCache[surah] = res;
    return res;
}

// أرقام آيات حفص التي نعرض تفسيرها للآية المحددة (آية واحدة في حفص، وقد تكون أكثر في ورش)
async function tafsirTargets(surah, ayah1) {
    if (userRiwaya === 1) return [ayah1];
    await ensureTextsForRiwaya(1);
    if (!quranTexts[0]?.[surah] || !quranTexts[1]?.[surah]) return null;
    const r = warshToHafsMap(surah)[ayah1];
    return (r && r.length) ? r.slice().sort((a, b) => a - b) : null;
}

// يستخرج نص التفسير من استجابة JSON بصرف النظر عن شكلها الدقيق
function extractTafsirText(j, ayah) {
    if (j === null || j === undefined) return '';
    if (typeof j === 'string') return j;
    if (Array.isArray(j)) return extractTafsirText(j.find((x) => x && Number(x.ayah) === ayah) || j[0], ayah);
    if (typeof j !== 'object') return '';
    if (typeof j.text === 'string') return j.text;
    for (const k of ['tafsir', 'tafseer', 'content', 'body']) {
        if (typeof j[k] === 'string') return j[k];
        if (j[k] && typeof j[k] === 'object') { const r = extractTafsirText(j[k], ayah); if (r) return r; }
    }
    if (Array.isArray(j.ayahs)) return extractTafsirText(j.ayahs, ayah);
    return '';
}

// ذاكرة محلية صغيرة للتفاسير التي جلبها المستخدم (لا تتجاوز 300 آية)
function tafsirCacheGet(key) {
    const v = lsGet(key, null);
    return (v && typeof v.t === 'string') ? v.t : null;
}

function tafsirCachePut(key, text) {
    const idx = lsGet(TAFSIR_IDX_KEY, []) || [];
    if (!idx.includes(key)) idx.push(key);
    while (idx.length > 300) { try { localStorage.removeItem(idx.shift()); } catch (e) {} }
    lsSet(key, { t: text });
    lsSet(TAFSIR_IDX_KEY, idx);
}

async function fetchTafsirOne(ed, surah1, ayah1) {
    const ck = TAFSIR_CACHE_PREFIX + ed.slug + '.' + surah1 + '.' + ayah1;
    const cached = tafsirCacheGet(ck);
    if (cached !== null) return cached;
    let lastErr = null;
    for (const base of TAFSIR_BASES) {
        try {
            const res = await fetch(base + ed.slug + '/' + surah1 + '/' + ayah1 + '.json');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const j = await res.json();
            const t = String(extractTafsirText(j, ayah1) || '').trim();
            tafsirCachePut(ck, t);
            return t;
        } catch (e) { lastErr = e; }
    }
    throw lastErr || new Error('تعذر جلب التفسير');
}

// بعض الكتب (كالسعدي) تجمع تفسير عدة آيات عند أولاها: إن كانت الآية بلا نص نرجع للآيات السابقة
async function loadTafsirText(edKey, surah1, ayah1) {
    const ed = TAFSIR_EDITIONS[edKey];
    for (let k = ayah1; k >= Math.max(1, ayah1 - 15); k--) {
        const t = await fetchTafsirOne(ed, surah1, k);
        if (t) return { text: t, from: k };
    }
    return { text: '', from: ayah1 };
}

// ---------- وحدات المقطع ----------

// في الحفظ: وحدة = جزء بين قطعين (التجزئة بأرقام الدوائر)؛ وفي بقية الصفحات الوحدة آية واحدة
function rdUnitOf(k) {
    if (rd.kind !== 'prep') return { from: k, to: k, idx: k + 1 };
    let from = 0;
    for (let i = 0; i < rd.cuts.length; i++) {
        if (k <= rd.cuts[i]) return { from, to: rd.cuts[i], idx: i + 1 };
        from = rd.cuts[i] + 1;
    }
    return { from, to: rd.items.length - 1, idx: rd.cuts.length + 1 };
}

// ما تعمل عليه الأزرار الآن: الوحدة المحدَّدة، وإن لم يوجد تحديد فالمقطع كله
function rdScope() {
    if (rd.sel === null) return { from: 0, to: rd.items.length - 1, kind: 'all' };
    const u = rdUnitOf(rd.sel);
    return { from: u.from, to: u.to, kind: u.from === u.to ? 'ayah' : 'part' };
}

// قبل «العرض» يبقى النص مخفياً ولا تعمل بقية الأزرار
function rdGuardHidden() {
    if (!rd || !rd.hidden) return false;
    showToast("اضغط «العرض» لإظهار الآيات أولاً.");
    return true;
}

function rdAyahText(s, a) { return getAyahText(userRiwaya, s, a) || ''; }

function rdLeadPart(L, id) {
    if (L.type === 'ayah') return `<span id="${id}" class="ayah-blue">${rdAyahText(L.s, L.a)}</span> <span class="circle-num">${L.a + 1}</span> `;
    if (L.type === 'basmala') return `<span id="${id}" class="ayah-blue">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span> `;
    return `<span id="${id}" class="ayah-blue">${L.text}</span> `;
}
// عقال الآيات: الآية السابقة مباشرةً (near) تظهر دائماً، والتي قبلها (lead) بزر «الآية السابقة»
function rdLeadHtml() {
    let h = '';
    if (rd.lead && rd.showLead) h += rdLeadPart(rd.lead, rd.near ? 'rd-lead2' : 'rd-lead');
    if (rd.near) h += rdLeadPart(rd.near, 'rd-lead');
    return h;
}

// زرّا «الآية السابقة» و«الآية التالية»: خافتان، يُظهر الضغط الآية بالأزرق وإعادته تُخفيها
function rdCtxBtns() {
    if (!rd) return;
    const set = (id, has, on, lab) => {
        const b = document.getElementById(id);
        if (!b) return;
        b.classList.toggle('hidden', !has);
        b.textContent = (on ? 'إخفاء ' : '') + lab;
    };
    const any = rd.items.length > 0;
    set('rd-lead-btn', any && !!rd.lead, rd.showLead, 'الآية السابقة');
    set('rd-tail-btn', any && !!rd.tail, rd.showTail, 'الآية التالية');
}
function rdToggleCtx(w) {
    if (!rd) return;
    if (w === 'lead') rd.showLead = !rd.showLead; else rd.showTail = !rd.showTail;
    rdRenderText();
}

function rdRenderText() {
    const el = document.getElementById('rd-text');
    if (!el || !rd) return;
    const T = document.getElementById('rd-title');
    if (T) T.textContent = rd.title;
    // النص مضبوط بين الحدّين دائماً: الخلفيات الملوَّنة وسطور الآيات بعرض الإطار كله منذ البداية
    el.style.textAlign = 'justify';
    if (!rd.items.length) { el.innerHTML = `<div class="rd-msg">${rd.msg}</div>`; rdCtxBtns(); return; }
    const sel = rd.sel !== null ? rdUnitOf(rd.sel) : null;
    const hid = (rd.hidden && rd.recScope) ? rd.recScope : null;
    let prevS = rd.lead && rd.showLead && rd.lead.s !== undefined ? rd.lead.s : rd.items[0].s;
    const one = (k) => {
        const it = rd.items[k];
        const on = sel && k >= sel.from && k <= sel.to;
        const hidd = hid && k >= hid.from && k <= hid.to;
        let sep = '';
        if (it.s !== prevS) { sep = `<span class="rv-surah-sep">سورة ${surahsNames[it.s]}</span>`; prevS = it.s; }
        return `${sep}<span class="prep-ayah${on ? ' prep-sel' : ''}${rd.stumbled.has(k) ? ' ayah-stumbled' : ''}" id="rd-a-${k}" onclick="rdSelectAyah(${k})"><span class="at${hidd ? ' prep-hide' : ''}">${rdAyahText(it.s, it.a)}</span> <span class="circle-num prep-cn" onclick="rdCircleTap(${k}, event)">${it.a + 1}</span> </span>`;
    };
    // التلوين المتناوب في الحفظ (الأجزاء) فقط
    const n = rd.items.length;
    let html = rdLeadHtml();
    if (rd.kind === 'prep') {
        let from = 0, idx = 0;
        const ends = rd.cuts.concat([n - 1]);
        ends.forEach((to) => {
            let inner = '';
            for (let k = from; k <= to; k++) inner += one(k);
            const isSel = sel && sel.from === from;
            html += `<span class="chunk ${idx % 2 === 0 ? 'chunk-a' : 'chunk-b'}${isSel ? ' chunk-sel' : ''}">${inner}</span> `;
            from = to + 1; idx++;
        });
    } else {
        for (let k = 0; k < n; k++) html += one(k);
    }
    if (rd.tail && rd.showTail) html += `<span class="ayah-blue">${rd.tail}</span>`;
    el.innerHTML = html;
    rdCtxBtns();
}

// ---------- صفّا الأزرار ----------

function rdRenderBars() {
    if (!rd) return;

                + `<div class="rd-cell"><button type="button" id="rd-sset" class="btn-secondary hf-btn tb-btn rd-shk" onclick="rdOpenSettings()" aria-label="إعدادات الشيخ (التكرار)" title="إعدادات الشيخ (التكرار)">${tbIcon('gear')}</button></div>`   // كل الشيوخ + الإعدادات (٨ أزرار)
            : recOn
                ? B('rd-rec', 'rd-recdark', 'rdRecBtn()', `<span class="rec-pulse"></span><span id="rd-timer" class="rd-timer" dir="ltr">${formatHMS(rdRecElapsed())}</span><span>إيقاف التسجيل</span>`)   // أثناء التسجيل: زر داكن بعرض كامل
                : `<div class="rd-cell"><button type="button" id="rd-restore" class="btn-secondary hf-btn tb-btn" onclick="rdRestoreRec()" aria-label="استرجاع آخر تسجيل" title="استرجاع آخر تسجيل"${recMem ? '' : ' disabled'}>${RD_ICONS.restore}</button></div>`
                + B('rd-rec', '', 'rdRecBtn()', 'تسجيل')
                + `<div class="rd-cell"><button type="button" id="rd-end" class="btn-secondary hf-btn rd-back rd-bkico" onclick="rdEnd()" aria-label="العودة" title="العودة">${tbIcon('arrL')}</button></div>`;

        } else if (recDone && !showOn && rd.sel !== null && !none && rd.kind !== 'aqal') {

            h = stumbleAllowed() ? `<div class="rd-act"><button type="button" id="rd-stumble" class="btn-secondary hf-btn rd-stm${on ? ' on' : ''}" onclick="rdStumbleToggle()">${on ? 'إلغاء التعثر' : 'تعثر'}</button></div>` : '';
