<head>

    <style>
/* ==========================================================
   تطبيق ابن باديس - الأنماط (style.css سابقاً)
   ========================================================== */
body {
    font-family: 'Amiri', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f0f4f1 0%, #d8e4dc 100%);
    color: #2c3e50;
    text-align: center;
    margin: 0;
    padding: 10px 0;
    min-height: 95vh;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    transition: background 0.3s ease, color 0.3s ease;
}

/* الوضع الليلي الكامل المحدث */
body.dark-mode {
    background: linear-gradient(135deg, #111827 0%, #0f172a 100%) !important;
    color: #f1f5f9 !important;
}

body.dark-mode .welcome-container,
body.dark-mode .exercise-box {
    background: #1e293b !important;
    border-color: #334155 !important;
    box-shadow: 0 12px 35px rgba(0, 0, 0, 0.4) !important;
    color: #f1f5f9 !important;
}

body.dark-mode .app-title,
body.dark-mode .surah-title,
body.dark-mode .settings-title {
    color: #34d399 !important;
}

body.dark-mode .app-slogan {
    color: #94a3b8 !important;
}

body.dark-mode .btn-secondary,
body.dark-mode .setting-row-box,
body.dark-mode .surah-list-container {
    background: #0f172a !important;
    border-color: #334155 !important;
    color: #f1f5f9 !important;
}

body.dark-mode .setting-row-label,
body.dark-mode .radio-label {

body.dark-mode .header-box {

}

.welcome-container {
    position: relative;

    width: 92%;
    height: 90vh;
    max-height: 750px;
    margin: 0 auto;
    background: #ffffff;
    padding: 25px 20px;
    border-radius: 24px;
    box-shadow: 0 12px 35px rgba(27, 77, 62, 0.08);
    border: 1px solid rgba(45, 106, 79, 0.15);

    flex-direction: column;
}

.settings-icon {

}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    <div id="main-container">
        <!-- يتم تعبئتها ديناميكياً بواسطة السكربت -->
    </div>

    <script>
// ==========================================================
// تطبيق ابن باديس - ملف واحد موحد
// التخزين: localStorage (تقدم المستخدم + الإعدادات + نسخة من نصوص المصحف)
// البيانات الثابتة: تُجلب من GitHub عبر روابطها ولا تُضمَّن في هذا الملف
// ==========================================================


// ==========================================================
// 0. الإعدادات والروابط
// ==========================================================

// مجلد البيانات الثابتة على GitHub (غيّره هنا فقط إذا انتقل المستودع)
const GITHUB_BASE = "https://raw.githubusercontent.com/techniquepuits/quran/main/IbnBadisQuranDB/";

// الملفات الثابتة المرتبطة بروابطها. لإضافة ملف ثابت جديد (مثل ayah_difficulties.json)
// أضف سطراً هنا ثم استدعِ fetchStaticFile("اسم الملف").
const STATIC_FILES = {
    "ayah_texts.json": GITHUB_BASE + "ayah_texts.json"
};

// مفاتيح localStorage
const LS_KEYS = {
    settings: "ibnbadis.settings",
    migrated: "ibnbadis.migrated",
    texts: (riwaya) => "ibnbadis.texts.v1." + riwaya   // v1: ارفع الرقم لإجبار إعادة التنزيل
};


// ==========================================================
// 1. المتغيرات العامة
// ==========================================================

let Riwaya = ['ورش عن نافع', 'حفص عن عاصم'];  // [0] ورش | [1] حفص
let userRiwaya = 0;                           // الرواية الحالية
let userCountLearningPlannedToday = 10;       // عدد آيات المراجعة اليومية
let isDarkMode = false;

// أسماء السور مرتبة حسب المصحف (0 إلى 113)
const surahsNames = [
    "الفاتحة", "البقرة", "آل عمران", "النساء", "المائدة", "الأنعام", "الأعراف", "الأنفال", "التوبة", "يونس",
    "هود", "يوسف", "الرعد", "إبراهيم", "الحجر", "النحل", "الإسراء", "الكهف", "مريم", "طه",
    "الأنبياء", "الحج", "المؤمنون", "النور", "الفرقان", "الشعراء", "النمل", "القصص", "العنكبوت", "الروم",
    "لقمان", "السجدة", "الأحزاب", "سبأ", "فاطر", "يس", "الصافات", "ص", "الزمر", "غافر",
    "فصلت", "الشورى", "الزخرف", "الدخان", "الجاثية", "الأحقاف", "محمد", "الفتح", "الحجرات", "ق",
    "الذاريات", "الطور", "النجم", "القمر", "الرحمن", "الواقعة", "الحديد", "المجادلة", "الحشر", "الممتحنة",
    "الصف", "الجمعة", "المنافقون", "التغابن", "الطلاق", "التحريم", "الملك", "القلم", "الحاقة", "المعارج",
    "نوح", "الجن", "المزمل", "المدثر", "القيامة", "الإنسان", "المرسلات", "النبأ", "النازعات", "عبس",
    "التكوير", "الانفطار", "المطففين", "الانشقاق", "البروج", "الطارق", "الأعلى", "الغاشية", "الفجر", "البلد",
    "الشمس", "الليل", "الضحى", "الشرح", "التين", "العلق", "القدر", "البينة", "الزلزلة", "العاديات",
    "القارعة", "التكاثر", "العصر", "الهمزة", "الفيل", "قريش", "الماعون", "الكوثر", "الكافرون", "النصر",
    "المسد", "الإخلاص", "الفلق", "الناس"
];

// متغيرات جاهزة لخوارزمية التكرار المتباعد (لم تُستخدم بعد)
let referenceTime = 1;    // الزمن المرجعي (tRef)
let urgencyScore = 1;     // مؤشر الإلحاح (u)

// متغيرات شاشات المراجعة
let currentReviewItem = null;
let targetAyahTextCache = "";
let currentContextOffset = 0;
let currentProgressIndex = 1;
let totalDailyTargetCount = 8;

// متغيرات الجلسة الخاصة (المقطع الكامل)
let selectedSpecialSurah = null;
let specialStartAyah = 1;
let specialEndAyah = 1;

// متغيرات التسجيل الصوتي
let mediaRecorder = null;
let audioChunks = [];
let recordedAudioBlob = null;
let recordedAudioUrl = null;
let playbackAudioElement = null;
let isRecording = false;
let isRecordingPaused = false;
let isPlayingRecording = false;


// ==========================================================
// 2. طبقة التخزين (localStorage)
// ==========================================================

function lsGet(key, fallback) {
    try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
    } catch (e) {
        return fallback;
    }
}

function lsSet(key, value) {
    try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
    } catch (e) {
        console.warn("تعذر الحفظ في localStorage:", key, e);
        return false;
    }
}

// --- الإعدادات ---
function loadSettings() {
    const s = lsGet(LS_KEYS.settings, {}) || {};
    if (s.riwaya === 0 || s.riwaya === 1) userRiwaya = s.riwaya;
    if (Number.isFinite(s.dailyLearningTarget) && s.dailyLearningTarget >= 1) {
        userCountLearningPlannedToday = s.dailyLearningTarget;
    }
    isDarkMode = s.darkMode === true;
}

function saveSettings() {
    lsSet(LS_KEYS.settings, {
        riwaya: userRiwaya,
        dailyLearningTarget: userCountLearningPlannedToday,
        darkMode: isDarkMode
    });
}

// ==========================================================
// 3. البيانات الثابتة (نصوص المصحف) - من GitHub مع نسخة محلية
// ==========================================================

// quranTexts[riwaya][surah][ayah] -> نص الآية
const quranTexts = [null, null];
let staticFetchPromises = {};

function fetchStaticFile(fileName) {
    if (!staticFetchPromises[fileName]) {
        const url = STATIC_FILES[fileName];
        if (!url) return Promise.reject(new Error("ملف غير معرّف: " + fileName));
        staticFetchPromises[fileName] = fetch(url)
            .then((res) => {
                if (!res.ok) throw new Error("تعذر جلب الملف: " + fileName + " (" + res.status + ")");
                return res.json();
            })
            .catch((err) => {
                delete staticFetchPromises[fileName];
                throw err;
            });
    }
    return staticFetchPromises[fileName];
}

function isValidRiwayaTexts(x) {
    return Array.isArray(x) && x.length === 114 && Array.isArray(x[0]) && x[0].length > 0;
}

// يضمن وجود نصوص الرواية في الذاكرة: من localStorage أولاً، وإلا من GitHub
async function ensureTextsForRiwaya(riwaya) {
    if (quranTexts[riwaya]) return;

    const cached = lsGet(LS_KEYS.texts(riwaya), null);
    if (isValidRiwayaTexts(cached)) {
        quranTexts[riwaya] = cached;
        return;
    }

    const json = await fetchStaticFile("ayah_texts.json");
    const all = json.ayah_texts || json;

    for (let r = 0; r < all.length; r++) {
        if (!quranTexts[r] && isValidRiwayaTexts(all[r])) quranTexts[r] = all[r];
    }
    delete staticFetchPromises["ayah_texts.json"];   // تحرير الذاكرة

    if (!quranTexts[riwaya]) throw new Error("ملف النصوص لا يحتوي على الرواية المطلوبة.");

    // نخزّن الرواية المطلوبة أولاً ثم الأخرى إن اتسعت المساحة
    lsSet(LS_KEYS.texts(riwaya), quranTexts[riwaya]);
    const other = 1 - riwaya;
    if (quranTexts[other]) lsSet(LS_KEYS.texts(other), quranTexts[other]);
}

// عدد آيات السورة مستنتج من نص الرواية نفسها (يعالج اختلاف عدّ ورش عن حفص)
function getAyatCount(surahIndex, riwaya) {
    const r = (riwaya === undefined) ? userRiwaya : riwaya;
    return quranTexts[r]?.[surahIndex]?.length || 0;
}

function getAyahText(riwaya, surah, ayah) {
    return quranTexts[riwaya]?.[surah]?.[ayah];
}

// ==========================================================

function readOldIndexedDB() {
    return new Promise((resolve) => {
        let finished = false;
        const done = (v) => { if (!finished) { finished = true; resolve(v); } };
        if (!window.indexedDB) return done(null);
        setTimeout(() => done(null), 3000);   // حماية من التعليق

        let req;
        try { req = indexedDB.open("IbnBadisQuranDB"); } catch (e) { return done(null); }

        // إن لم تكن القاعدة موجودة نلغي الإنشاء حتى لا نخلق قاعدة فارغة
        req.onupgradeneeded = (e) => { try { e.target.transaction.abort(); } catch (_) {} done(null); };
        req.onerror = () => done(null);
        req.onsuccess = (e) => {
            const db = e.target.result;
            try {
                if (!db.objectStoreNames.contains("quranStore")) { db.close(); return done(null); }
                const tx = db.transaction("quranStore", "readonly");
                const store = tx.objectStore("quranStore");
                const out = { config: null };
                const r2 = store.get("user_app_config.json");
                r2.onsuccess = () => { out.config = r2.result || null; };
                tx.oncomplete = () => { db.close(); done(out); };
                tx.onerror = tx.onabort = () => { db.close(); done(null); };
            } catch (err) {
                try { db.close(); } catch (_) {}
                done(null);
            }
        };
    });
}

async function migrateFromOldIndexedDBOnce() {
    if (lsGet(LS_KEYS.migrated, false)) return;

    // أول تشغيل (لا إعدادات محفوظة بعد): نستورد الإعدادات القديمة إن وُجدت
    if (lsGet(LS_KEYS.settings, null) === null) {
        const old = await readOldIndexedDB();
        if (old && old.config) {
            if (old.config.riwaya === 0 || old.config.riwaya === 1) userRiwaya = old.config.riwaya;
            const n = Number(old.config.dailyLearningTarget);
            if (Number.isFinite(n) && n >= 1) userCountLearningPlannedToday = n;
            saveSettings();
        }
    }
    lsSet(LS_KEYS.migrated, true);
}

        saveSettings();
    } catch (e) {

async function saveSettingsAndReturn() {
    const dailyCountEl = document.getElementById('daily-count-input');
    const parsed = dailyCountEl ? parseInt(dailyCountEl.value, 10) : NaN;
    userCountLearningPlannedToday = Math.max(1, parsed || 10);

    // لا نغادر الإعدادات قبل أن تكون نصوص الرواية المختارة جاهزة
    try {
        await ensureTextsForRiwaya(userRiwaya);

        userRiwaya = quranTexts[0] ? 0 : (quranTexts[1] ? 1 : userRiwaya);

function loadRandomActiveAyahToReview() {
    resetRecordingStates();
    currentContextOffset = 0;

    totalDailyTargetCount = userCountLearningPlannedToday;

    const badgeEl = document.getElementById('daily-progress-badge');
    if (badgeEl) {
        badgeEl.innerText = `${currentProgressIndex} / ${totalDailyTargetCount}`;
    }

    const showBtn = document.getElementById('show-btn');
    const ratingArea = document.getElementById('rating-area');
    const sheikhBtn = document.getElementById('sheikh-audio-btn');

    if (showBtn) showBtn.classList.remove('hidden');
    if (ratingArea) ratingArea.classList.add('hidden');
    if (sheikhBtn) sheikhBtn.classList.add('hidden');

    const currentRiwaya = userRiwaya;
    const promptAyahEl = document.getElementById('prompt-ayah');

    if (promptAyahEl) promptAyahEl.innerText = "جاري اختيار الآية...";

    const prevAyahsContainer = document.getElementById('prev-ayahs-container');
    if (prevAyahsContainer) prevAyahsContainer.innerHTML = "";

    const blank1 = document.getElementById('target-blank-1');
    const targetNum1El = document.getElementById('target-num-1');
    const targetBlank2 = document.getElementById('target-blank-2');
    const promptNumEl = document.getElementById('prompt-num');

    if (targetBlank2) {
        targetBlank2.style.visibility = 'hidden';
        targetBlank2.innerText = "";
    }
    if (blank1) {
        blank1.style.visibility = 'hidden';
        blank1.innerText = "";
        blank1.classList.remove('ayah-green');
    }
    if (targetNum1El) targetNum1El.innerText = "";
    if (promptNumEl) promptNumEl.innerText = "";

    // كل آيات المصحف متاحة؛ نستثني فقط الآية الأخيرة من كل سورة لأن التمرين يطلب الآية التالية
    let totalEligible = 0;
    for (let s = 0; s < surahsNames.length; s++) {
        totalEligible += Math.max(0, getAyatCount(s, currentRiwaya) - 1);
    }

    if (totalEligible === 0) {
        if (promptAyahEl) promptAyahEl.innerText = "تعذر تحميل المصحف. تحقق من الاتصال بالإنترنت ثم أعد المحاولة.";
        return;
    }

    let pick = Math.floor(Math.random() * totalEligible);
    let targetCoord = null;
    for (let s = 0; s < surahsNames.length; s++) {
        const n = Math.max(0, getAyatCount(s, currentRiwaya) - 1);
        if (pick < n) {
            targetCoord = { riwaya: currentRiwaya, surah: s, ayah: pick };
            break;
        }
        pick -= n;
    }
    currentReviewItem = targetCoord;

    const ayahText = getAyahText(targetCoord.riwaya, targetCoord.surah, targetCoord.ayah);
    if (promptAyahEl) promptAyahEl.innerText = ayahText || "تعذر جلب نص الآية.";

    if (promptNumEl) promptNumEl.innerText = targetCoord.ayah + 1;

    const surahNameEl = document.getElementById('surah-name');
    if (surahNameEl) {
        surahNameEl.innerText = `سورة: ${surahsNames[targetCoord.surah]}`;
    }

    const maxCurrentSurahAyats = getAyatCount(targetCoord.surah, currentRiwaya);

    if (targetCoord.ayah + 1 < maxCurrentSurahAyats) {
        const nextFullAyahText = getAyahText(targetCoord.riwaya, targetCoord.surah, targetCoord.ayah + 1);
        targetAyahTextCache = nextFullAyahText || "تعذر جلب الآية المستهدفة.";
        if (blank1) blank1.innerText = targetAyahTextCache;
        if (targetNum1El) targetNum1El.innerText = targetCoord.ayah + 2;
    }

    if (targetCoord.ayah + 2 < maxCurrentSurahAyats) {
        const thirdAyahText = getAyahText(targetCoord.riwaya, targetCoord.surah, targetCoord.ayah + 2);
        if (thirdAyahText) {
            const nextThreeWords = thirdAyahText.split(" ").slice(0, 3).join(" ");
            if (targetBlank2) targetBlank2.innerText = nextThreeWords + " ...";
        }
    } else {
        if (targetBlank2) targetBlank2.innerText = "نهاية السورة...";
    }
}

    surahsNames.forEach((name, index) => {
        surahsHtml += `
            <div class="setting-row-box" style="margin-bottom: 6px; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between;">
                <label class="radio-label" style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="radio" name="special-surah-radio" value="${index}" onchange="selectSpecialSurah(${index})">
                    <span>سورة ${name}</span>
                </label>
                <div id="range-box-${index}" class="hidden" style="display: flex; gap: 8px; align-items: center;">
                    <span style="font-size: 13px; font-weight: bold;">من الآية:</span>
                    <input type="number" id="special-start-${index}" min="1" value="1" style="width: 56px; padding: 2px; text-align: center; border-radius: 4px; border: 1px solid #cbd5e1;" onchange="validateSpecialInputs(${index})">
                </div>
            </div>
        `;
    });

    const specialScreenHTML = `
        <div class="header-box">
            <div style="display: flex; gap: 6px; align-items: center;">
                <button class="btn-home" onclick="showMainButtons()" title="العودة للقائمة الرئيسية">🏠 القائمة</button>
                <button id="dark-mode-btn" class="btn-home" onclick="toggleDarkMode()" title="${isDarkMode ? 'الوضع العادي' : 'الوضع الليلي'}">${isDarkMode ? '☀️' : '🌙'}</button>
            </div>
            <div class="surah-title" style="font-size: 16px;">المراجعة اليومية</div>
        </div>

        <div class="exercise-box" id="exercise-container" style="display: flex; flex-direction: column; gap: 8px;">
            <div style="font-weight: bold; font-size: 15px; color: #1b4d3e; text-align: right;">اختر السورة وآية البداية:</div>
            <div style="font-size: 12px; color: #64748b; text-align: right;">تبدأ التلاوة من آية البداية وتتوقف حيث تشاء.</div>
            <div class="surah-list-container" style="max-height: 220px;">
                ${surahsHtml}
            </div>

            <button id="start-special-btn" class="btn-main hidden" style="margin-top: 8px; max-width: 100%; padding: 10px;" onclick="initiateSpecialSessionExecution()">ابدأ الجلسة</button>
        </div>

        <div id="action-area">
            <div class="action-top-row">
                <button id="record-action-btn" class="btn-recording" disabled>🎙️ تسجيل</button>

            <button class="btn-rate btn-forgot" onclick="nextSpecialQuestion('forgot')">نسيت</button>
            <button class="btn-rate btn-hard" onclick="nextSpecialQuestion('hard')">صعب</button>
            <button class="btn-rate btn-good" onclick="nextSpecialQuestion('good')">جيد</button>
            <button class="btn-rate btn-easy" onclick="nextSpecialQuestion('easy')">سهل</button>
        </div>
    `;

    renderInContainer(specialScreenHTML);
    applyTheme();
}

// سورة واحدة فقط (أزرار راديو) مع تحديد آية البداية؛ النهاية دائماً آخر السورة
// والمستخدم يتوقف عن التلاوة حيث يشاء.
function selectSpecialSurah(surahIndex) {
    surahsNames.forEach((_, idx) => {
        const box = document.getElementById(`range-box-${idx}`);
        if (box) {
            if (idx === surahIndex) box.classList.remove('hidden');
            else box.classList.add('hidden');
        }
    });

    selectedSpecialSurah = surahIndex;
    const maxAyats = getAyatCount(surahIndex) || 7;

    const startInput = document.getElementById(`special-start-${surahIndex}`);
    const startBtn = document.getElementById('start-special-btn');

    if (startBtn) startBtn.classList.remove('hidden');

    if (startInput) {
        startInput.value = 1;
        startInput.max = maxAyats;
    }

    specialStartAyah = 1;
    specialEndAyah = maxAyats;
}

function validateSpecialInputs(surahIndex) {
    const maxAyats = getAyatCount(surahIndex) || 7;
    const startInput = document.getElementById(`special-start-${surahIndex}`);

    let valStart = parseInt(startInput.value) || 1;
    if (valStart < 1) valStart = 1;
    if (valStart > maxAyats) valStart = maxAyats;
    startInput.value = valStart;

    specialStartAyah = valStart;
    specialEndAyah = maxAyats;
}

function initiateSpecialSessionExecution() {
    if (selectedSpecialSurah === null) return;
    validateSpecialInputs(selectedSpecialSurah);
    loadSpecialFullSectionExercise();
}

function loadSpecialFullSectionExercise() {
    resetRecordingStates();

    const currentRiwaya = userRiwaya;

    const showBtn = document.getElementById('show-btn');
    const ratingArea = document.getElementById('rating-area');
    const sheikhBtn = document.getElementById('sheikh-audio-btn');
    const recordBtn = document.getElementById('record-action-btn');

    if (showBtn) {
        showBtn.classList.remove('hidden');
        showBtn.removeAttribute('disabled');
        showBtn.style.opacity = '1';
        showBtn.setAttribute('onclick', 'revealSpecialFullAnswer()');
    }
    if (ratingArea) ratingArea.classList.add('hidden');
    if (sheikhBtn) sheikhBtn.classList.add('hidden');
    if (recordBtn) {
        recordBtn.removeAttribute('disabled');
        recordBtn.innerText = "🎙️ تسجيل";
        recordBtn.className = "btn-recording";
        recordBtn.setAttribute('onclick', 'handleSpecialRecordingToggle()');
    }

    const exerciseContainer = document.getElementById('exercise-container');

    let promptText = "";
    let promptNumDisplay = "";

    if (specialStartAyah === 1) {
        promptText = "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ";
        promptNumDisplay = "";
    } else {
        const prevIdx = specialStartAyah - 2;
        promptText = getAyahText(currentRiwaya, selectedSpecialSurah, prevIdx) || "";
        promptNumDisplay = prevIdx + 1;
    }

    let fullTargetHTML = "";
    for (let a = specialStartAyah - 1; a < specialEndAyah; a++) {
        const text = getAyahText(currentRiwaya, selectedSpecialSurah, a) || "";
        const num = a + 1;
        fullTargetHTML += `
            <span id="special-ayah-item-${a}"
                  onclick="handleSpecialAyahClick(${a})"
                  style="cursor: pointer; padding: 2px 4px; border-radius: 4px; transition: background 0.2s;">
                ${text} <span class="circle-num">${num}</span>
            </span> `;
    }

    const customLayoutHTML = `
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px;">
            <span style="font-size: 14px; font-weight: bold; color: #2d6a4f;">البدء من الآية ${specialStartAyah}</span>
            <span class="surah-title" style="font-size: 16px;">سورة: ${surahsNames[selectedSpecialSurah]}</span>
        </div>
        <div class="continuous-quran-text" style="text-align: right; font-size: 21px; line-height: 3.5;">
            <span class="ayah-blue">${promptText}</span>
            ${promptNumDisplay !== "" ? `<span class="circle-num">${promptNumDisplay}</span>` : ""}

            <span id="special-full-target-blank" class="blank-space" style="visibility: hidden; color: #16a34a !important;">${fullTargetHTML}</span>
        </div>
    `;

    if (exerciseContainer) {
        exerciseContainer.innerHTML = customLayoutHTML;
    }
}

// الضغط على أي آية داخل المقطع يُظهر الأزرار الأربعة
function handleSpecialAyahClick(ayahIndex) {
    resetRecordingStates();

    for (let a = specialStartAyah - 1; a < specialEndAyah; a++) {
        const el = document.getElementById(`special-ayah-item-${a}`);
        const menuEl = document.getElementById(`ayah-popup-menu-${a}`);
        if (el) el.style.backgroundColor = "transparent";
        if (menuEl) menuEl.remove();
    }

    const clickedAyahSpan = document.getElementById(`special-ayah-item-${ayahIndex}`);
    if (clickedAyahSpan) {
        clickedAyahSpan.style.backgroundColor = "rgba(254, 240, 138, 0.6)";

        const popupDiv = document.createElement('div');
        popupDiv.id = `ayah-popup-menu-${ayahIndex}`;
        popupDiv.style.cssText = `
            display: flex;
            gap: 6px;
            margin-top: 8px;
            margin-bottom: 8px;
            padding: 8px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            animation: fadeIn 0.2s ease-in-out;
        `;

        popupDiv.innerHTML = `
            <button class="btn-rate btn-forgot" style="font-size: 12px; padding: 4px 8px;" onclick="console.log('زر: تعثر (بحاجة لمراجعة) للآية ${ayahIndex + 1}')">⚠️ تعثر (بحاجة لمراجعة)</button>
            <button class="btn-rate btn-hard" style="font-size: 12px; padding: 4px 8px;" onclick="console.log('زر: سماع صوتي للآية ${ayahIndex + 1}')">🎙️ سماع صوتي</button>
            <button class="btn-rate btn-good" style="font-size: 12px; padding: 4px 8px;" onclick="console.log('زر: صوت الشيخ للآية ${ayahIndex + 1}')">🔊 صوت الشيخ</button>
            <button class="btn-rate btn-easy" style="font-size: 12px; padding: 4px 8px;" onclick="resumeNormalReading(${ayahIndex})">🔄 مواصلة</button>
        `;

        clickedAyahSpan.after(popupDiv);
    }
}

// زر المواصلة: إعادة الآية لوضعها الطبيعي وإخفاء النافذة المنبثقة
function resumeNormalReading(ayahIndex) {
    const clickedAyahSpan = document.getElementById(`special-ayah-item-${ayahIndex}`);
    const menuEl = document.getElementById(`ayah-popup-menu-${ayahIndex}`);

    if (clickedAyahSpan) clickedAyahSpan.style.backgroundColor = "transparent";
    if (menuEl) menuEl.remove();
}

function revealSpecialFullAnswer() {
    if (isRecording && mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        isRecording = false;
        isRecordingPaused = false;
    }

    const blankEl = document.getElementById('special-full-target-blank');
    if (blankEl) blankEl.style.visibility = 'visible';

    const showBtn = document.getElementById('show-btn');
    const ratingArea = document.getElementById('rating-area');
    const sheikhBtn = document.getElementById('sheikh-audio-btn');

    if (showBtn) showBtn.classList.add('hidden');
    if (ratingArea) ratingArea.classList.remove('hidden');
    if (sheikhBtn) sheikhBtn.classList.remove('hidden');

    const recordBtn = document.getElementById('record-action-btn');
    if (recordBtn) {
        recordBtn.innerText = "▶️ عرض التسجيل";
        recordBtn.className = "btn-recording";
    }
}

function handleSpecialRecordingToggle() {
    const recordBtn = document.getElementById('record-action-btn');
    const showBtn = document.getElementById('show-btn');
    const isAnswerRevealed = showBtn && showBtn.classList.contains('hidden');

    if (isAnswerRevealed) {
        togglePlaybackRecordedAudio(recordBtn);
    } else {
        toggleRecordUserVoice(recordBtn);
    }
}

function nextSpecialQuestion(ratingType) {
    alert("أحسنت! لقد أتممت جلسة المراجعة الخاصة بهذا المقطع بنجاح.");
    showSpecialSessionScreen();
}


// ==========================================================
// 9. أدوات صوتية مشتركة
// ==========================================================

function toggleRecordUserVoice(btnElement) {
    if (!isRecording && !isRecordingPaused) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                recordedAudioUrl = URL.createObjectURL(recordedAudioBlob);
                playbackAudioElement = new Audio(recordedAudioUrl);

                playbackAudioElement.onended = () => {
                    isPlayingRecording = false;
                    btnElement.innerText = "▶️ عرض التسجيل";
                    btnElement.classList.remove('playing-active');
                };
            };

            mediaRecorder.start();
            isRecording = true;
            isRecordingPaused = false;
            btnElement.innerText = "⏸️ إيقاف";
            btnElement.classList.add('recording-active');
        }).catch((err) => {
            alert("تعذر الوصول إلى الميكروفون.");
        });
    } else if (isRecording && !isRecordingPaused) {
        if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.pause();
        }
        isRecording = false;
        isRecordingPaused = true;
        btnElement.innerText = "⏺️ مواصلة";
        btnElement.classList.remove('recording-active');
    } else {
        if (mediaRecorder && mediaRecorder.state === "paused") {
            mediaRecorder.resume();
        }
        isRecording = true;
        isRecordingPaused = false;
        btnElement.innerText = "⏸️ إيقاف";
        btnElement.classList.add('recording-active');
    }
}

function togglePlaybackRecordedAudio(btnElement) {
    if (!recordedAudioBlob || !playbackAudioElement) {
        alert("لا يوجد تسجيل صوتي متاح للعرض بعد.");
        return;
    }

    if (!isPlayingRecording) {
        playbackAudioElement.play();
        isPlayingRecording = true;
        btnElement.innerText = "⏸️ إيقاف العرض";
        btnElement.classList.add('playing-active');
    } else {
        playbackAudioElement.pause();
        isPlayingRecording = false;
        btnElement.innerText = "▶️ مواصلة العرض";
        btnElement.classList.remove('playing-active');
    }
}

function resetRecordingStates() {
    if (mediaRecorder && mediaRecorder.state !== "inactive") {
        try { mediaRecorder.stop(); } catch (e) {}
    }
    if (playbackAudioElement) {
        playbackAudioElement.pause();
        playbackAudioElement = null;
    }
    isRecording = false;
    isRecordingPaused = false;
    isPlayingRecording = false;
    recordedAudioBlob = null;
    recordedAudioUrl = null;
    audioChunks = [];
}

function handleSheikhAudioPlaceholder() {
    console.log("زر صوت الشيخ - جاهز للنقاش المستقبلي");
}
